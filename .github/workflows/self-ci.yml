name: self-ci

# Lints this repository's OWN files - the reusable workflows/scripts calling
# projects (vocanova-platform-sandbox and any future one) `uses:` directly.
# Nothing here runs against a calling project; that's ci.yml's job. This repo
# had no self-validation of its own before 2026-08-08 - a bug in a workflow
# YAML file, a shell script, or a change-package YAML schema could only be
# caught by a calling project's real run failing, not by anything in this
# repo's own PRs. Deliberately narrow: actionlint (workflow YAML + embedded
# shell), shellcheck (standalone scripts under config/), and a plain YAML
# parse pass - not a full test suite, since this repo has no fixture caller
# to exercise the actual reusable-workflow logic against yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      # -ignore entries are specific, narrow known false positives, verified
      # against the real thing before being silenced here - not a blanket
      # noise-suppression habit. Re-verify each one still applies before
      # adding more, and remove one the moment it stops being a false
      # positive (e.g. actionlint's bundled popular-actions database catches
      # up, or the underlying repo condition changes).
      #
      # 2026-08-08: actionlint ships a bundled, static snapshot of popular
      # actions' input schemas rather than querying GitHub live - that
      # snapshot is stale for openai/codex-action@v1 specifically. Verified
      # directly against the live action.yml at that exact tag (`gh api
      # repos/openai/codex-action/contents/action.yml?ref=v1`): both
      # `permission-profile` and `allow-bot-users` genuinely are valid inputs
      # on the real @v1 today, contrary to actionlint's complaint.
      #
      # 2026-08-08: implement.yml's disabled openai/codex-action escalation
      # step uses `if: false` deliberately (kept, not deleted, for a one-line
      # revert if OpenAI quota is ever restored - see that step's own header
      # comment) - not stale prose actionlint should suggest removing.
      #
      # The last -ignore is a deliberate SEVERITY filter, not a false-positive
      # suppression: shellcheck's own "info"/"style" tier findings (cosmetic
      # suggestions like "consider grouping redirects") are real but
      # low-value - failing every PR on them trains people to ignore this
      # check. "warning"/"error" tier shellcheck findings still fail the
      # build; the 2026-08-08 first real run found one of each (SC2070
      # error, SC2044 warning) and both were fixed at the source, not
      # ignored here - see those commits for what they were.
      #
      # 2026-08-21: GitHub's current contexts reference defines
      # `job.workflow_repository` and `job.workflow_sha` specifically for a
      # reusable workflow to check out files co-located with its own exact
      # revision. actionlint's bundled `job` schema does not yet include those
      # two github.com properties. Keep these ignores exact; do not suppress
      # other undefined job-context properties.
      - name: Run actionlint
        run: |
          ./actionlint -color \
            -ignore 'input "permission-profile" is not defined' \
            -ignore 'input "allow-bot-users" is not defined' \
            -ignore 'property "workflow_repository" is not defined in object type' \
            -ignore 'property "workflow_sha" is not defined in object type' \
            -ignore 'constant expression "false" in condition' \
            -ignore 'shellcheck reported issue.*:(info|style):' \
            .github/workflows/*.yml \
            templates/project-repo/.github/workflows/*.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run shellcheck on config/*.sh
        run: shellcheck config/*.sh

  yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Parse every YAML file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" || {
              echo "::error file=$f::invalid YAML"
              fail=1
            }
          done < <(find . \( -name "*.yml" -o -name "*.yaml" \) -print0)
          exit "$fail"

  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run workflow policy regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
