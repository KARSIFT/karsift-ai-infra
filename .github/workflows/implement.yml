name: implement (reusable)

# Runs the "implementer" role against one task from an approved change package.
# Which model fills that role is resolved from THIS repo's own config/roles.yml,
# so swapping models never touches a calling project's own workflow.
#
# Restored to openai/codex-action (2026-07-23) once OpenAI API billing became
# available - see config/roles.yml's header comment for the prior same-vendor
# compromise (Claude Code for both implementer and reviewer) this replaced,
# and for the LATER same-vendor compromise (2026-07-24: Anthropic Console org
# disabled, reviewer/planner moved to openai/codex-action too) that currently
# applies again - check config/roles.yml's actual values before assuming
# implementer and reviewer are on different vendors right now; the two
# compromises are not the same event, just the same category of problem.
# Swapping vendors again in the future only touches this file's
# "Run implementer" step and config/roles.yml's `implementer` value - the
# role/prompt/branch/commit/PR machinery around it is provider-agnostic by
# design and needs no changes in review.yml/merge-gate.yml either way.
#
# MIXED-VENDOR (2026-07-25), SUPERSEDED (2026-07-26): `implementer` moved to
# OpenCode (opencode-go/kimi-k2.7-code - see config/roles.yml) on 2026-07-25;
# `implementer_escalation` deliberately stayed on openai/codex-action
# (gpt-5.6-sol) at first, as a genuinely different, strong fallback for the
# one retry that matters most - not just a cost lever, a real cross-vendor
# second opinion on the hardest attempt. That cross-vendor property was
# traded away on 2026-07-26 (founder: "no more quota in codex") -
# implementer_escalation moved to opencode-go/glm-5.2, collapsing this file
# back to a single real execution step ("Run implementer (opencode)"), same
# as review.yml/plan.yml. The openai/codex-action step is disabled
# (if: false), not deleted - see that step's own comment for why.
#
# MOVED TO CURSOR (2026-07-31): the OpenCode Go account behind
# OPENCODE_API_KEY looked exhausted/degraded across every model tried
# (VOC-032-T10's live-evaluation evidence; review.yml's own reviewer job was
# stuck ~30 minutes with zero output on the same day for the same reason -
# see that file's header comment for the full incident). Founder directive:
# move every role - implementer, implementer_escalation, reviewer, planner -
# to Cursor (a pre-existing Pro+ subscription), using a different,
# cost-effective model per role rather than one model everywhere. Both the
# base implementer and the escalation tier now run through the single "Run
# implementer (cursor-agent)" step below, collapsing the old
# opencode/claude-code-escalation split into one execution path the same way
# review.yml's migration did - the two are still just different config/
# roles.yml values (`implementer` vs `implementer_escalation`), only the
# model differs, not the CLI. The opencode and claude-code-escalation steps
# below are disabled (if: false), not deleted, for the same one-line-revert
# reason the openai/codex-action step already documents.
#
# Every claim about the Cursor CLI's real flags/behavior here was verified
# against the actually-installed CLI in a disposable sandbox, not assumed
# from fetched docs - see review.yml's header comment for the specific
# checks (workspace-trust blocking, --mode plan's real read-only guarantee,
# stdin prompt input avoiding the execve() argument-length limit, the
# single-JSON-object --output-format json shape). The one difference here:
# the implementer role needs real write access, so `--force`/`--yolo` is
# used instead of `--mode plan` - equivalent to opencode's `--auto` /
# claude's unrestricted `--allowedTools` for this same role.

on:
  workflow_call:
    inputs:
      change_id:
        description: 'The adopted change package to implement from, e.g. "VOC-007"'
        required: true
        type: string
      package_path:
        description: 'Path to the package directory, e.g. "specs/changes/VOC-007-some-slug"'
        required: true
        type: string
      task_id:
        description: "The specific task ID from the package's task list being implemented this run"
        required: true
        type: string
      issue_number:
        description: "The GitHub issue carrying implementation authority for this task"
        required: true
        type: string
      attempt:
        description: 1 or 2. On attempt 2 failure, escalate to the issue and stop - no attempt 3.
        required: false
        type: string
        default: "1"
      integration_branch:
        description: 'The calling project''s integration branch to base the work off - "develop" for a develop/main split, "main" for GitHub-flow-only projects.'
        required: false
        type: string
        default: "develop"
    secrets:
      OPENAI_API_KEY:
        description: "Unused since implementer_escalation moved to OpenCode (2026-07-26) - kept optional in case codex-action escalation is ever re-enabled, see this file's header comment."
        required: false
      OPENCODE_API_KEY:
        description: "Unused since implementer/implementer_escalation moved to Cursor (2026-07-31) - kept optional in case the opencode step is ever re-enabled, see this file's header comment."
        required: false
      OPENCODE_SECOND_API_KEY:
        description: "Unused secondary OpenCode account retained for the disabled OpenCode fallback path."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Unused since implementer_escalation moved to Cursor (2026-07-31) - kept optional in case the claude-code-escalation step is ever re-enabled, see this file's header comment."
        required: false
      CURSOR_API_KEY:
        description: "Used for both the base implementer and implementer_escalation roles (both Cursor-backed as of 2026-07-31, see this file's header comment)."
        required: true
      KARSIFT_BOT_APP_ID:
        description: >
          Optional. GitHub App ID for minting the PR-creation token. Without
          it, PR creation falls back to the default GITHUB_TOKEN, and GitHub
          will require a manual "Approve workflows to run" click on every
          resulting PR (a security behavior GitHub applies to any PR that
          GITHUB_TOKEN creates or updates, same-repo or not - not a bug in
          this workflow). Set this and KARSIFT_BOT_PRIVATE_KEY once a project
          has a GitHub App installed for it to remove that friction.
        required: false
      KARSIFT_BOT_PRIVATE_KEY:
        description: "Optional, paired with KARSIFT_BOT_APP_ID - see that input's description."
        required: false

jobs:
  implement:
    runs-on: ubuntu-latest
    concurrency:
      # One implementer at a time per adopted package. A queued manual
      # dispatch still has to pass the dependency preflight below, so this is
      # serialization plus validation rather than timing-dependent ordering.
      group: implement-${{ github.repository }}-${{ inputs.change_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_branch }}
          fetch-depth: 0

      - name: Checkout karsift-ai-infra
        uses: actions/checkout@v4
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra

      - name: Refuse to run without an adopted, authorized package
        id: package
        run: |
          pip install --quiet pyyaml
          python3 - "${{ inputs.package_path }}" "${{ inputs.issue_number }}" "$GITHUB_OUTPUT" <<'PYEOF'
          import sys
          import yaml

          package_path, expected_issue, github_output = sys.argv[1:4]
          data = yaml.safe_load(open(f"{package_path}/change.yaml"))

          if data.get("status") not in ("implementing", "adopted", "implementation-ready"):
              sys.exit(f"Package status '{data.get('status')}' is not implementation-ready - refusing to run.")

          impl = data.get("implementation", {})
          if not impl.get("authorized"):
              sys.exit("Package implementation.authorized is not true - refusing to run.")

          # impl.get("authority_issue", "") only falls back to "" when the key
          # is MISSING - a package that explicitly writes `authority_issue:
          # null` (valid YAML for "not applicable", e.g. a multi-task package
          # with no single authority issue) gets Python None back, and
          # str(None) is the non-empty string "None", which then fails the
          # match check below against every dispatched issue number. `or ""`
          # additionally coerces None (and only None) to "" so an explicit
          # null behaves the same as an absent key. Found live on
          # karsift-ai-infra-smoke-test's TEST-005 (first real multi-task
          # planner-drafted package): authority_issue: null incorrectly
          # blocked implement.yml with "authority_issue (None) does not match
          # the issue this run was dispatched for (7)."
          authority_issue = str(impl.get("authority_issue") or "")
          if authority_issue and authority_issue != str(expected_issue):
              sys.exit(
                  f"Package authority_issue ({authority_issue}) does not match "
                  f"the issue this run was dispatched for ({expected_issue})."
              )

          # Surface the package's own declared risk so "Open PR" can put a
          # real "Risk classification: R#" line in the PR body automatically -
          # merge-gate.yml fails closed (requires founder approval) without
          # one, so leaving this to be added by hand is a gap, not a feature.
          risk = str(data.get("risk", "")).upper()
          with open(github_output, "a") as f:
              f.write(f"risk={risk}\n")

          print(f"Package is adopted and authorized (declared risk: {risk or 'none declared'}) - proceeding.")
          PYEOF

      # `.karsift/tasks.json` is the adopted, immutable roster of record. New
      # rosters carry an explicit dependency edge for every non-root task.
      # Enforce it here as well as in auto-advance so a manual workflow_dispatch
      # cannot bypass sequencing. Legacy packages without a roster retain their
      # old behavior; every package adopted after this change is fail-closed.
      - name: Refuse to run before task dependencies are merged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_PATH: ${{ inputs.package_path }}
          TASK_ID: ${{ inputs.task_id }}
          EXPECTED_ISSUE: ${{ inputs.issue_number }}
          CHANGE_ID: ${{ inputs.change_id }}
        run: |
          set -euo pipefail
          roster="$PACKAGE_PATH/.karsift/tasks.json"
          if [ ! -f "$roster" ]; then
            echo "::warning::$roster does not exist; this is a legacy package, so dependency enforcement is unavailable."
            exit 0
          fi

          python3 - "$roster" "$TASK_ID" "$EXPECTED_ISSUE" <<'PYEOF' > /tmp/task-dependencies.tsv
          import json
          import sys

          roster_path, task_id, expected_issue = sys.argv[1:4]
          roster = json.load(open(roster_path))
          task_ids = [entry["task_id"] for entry in roster]
          if len(task_ids) != len(set(task_ids)):
              sys.exit(f"{roster_path} contains duplicate task IDs.")
          tasks = {entry["task_id"]: entry for entry in roster}
          if task_id not in tasks:
              sys.exit(f"{task_id} is not present in the adopted roster {roster_path}.")

          task = tasks[task_id]
          if str(task.get("issue")) != str(expected_issue):
              sys.exit(
                  f"{task_id} belongs to issue #{task.get('issue')}, not dispatched issue "
                  f"#{expected_issue}."
              )

          dependencies = task.get("depends_on", [])
          if not isinstance(dependencies, list):
              sys.exit(f"{task_id}.depends_on must be a JSON array.")
          for dependency in dependencies:
              if dependency not in tasks:
                  sys.exit(f"{task_id} depends on unknown task {dependency}.")
              print(f"{dependency}\t{tasks[dependency]['issue']}")
          PYEOF

          current_state=$(gh issue view "$EXPECTED_ISSUE" --json state -q .state)
          if [ "$current_state" != "OPEN" ]; then
            echo "Task $TASK_ID issue #$EXPECTED_ISSUE is $current_state; refusing duplicate or obsolete implementation." >&2
            exit 1
          fi

          while IFS=$'\t' read -r dependency dependency_issue; do
            [ -z "$dependency" ] && continue
            state=$(gh issue view "$dependency_issue" --json state -q .state)
            if [ "$state" != "CLOSED" ]; then
              echo "Task $TASK_ID is waiting for $dependency (issue #$dependency_issue is $state). Refusing out-of-order dispatch." >&2
              exit 1
            fi

            dependency_slug=$(echo "$dependency" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
            change_lower=$(echo "$CHANGE_ID" | tr '[:upper:]' '[:lower:]')
            dependency_branch="agent/${change_lower}-${dependency_slug}"
            merged_sha=$(gh pr list --head "$dependency_branch" --state all \
              --json mergedAt,mergeCommit \
              --jq '[.[] | select(.mergedAt != null and .mergeCommit != null)][0].mergeCommit.oid // ""')
            if [ -z "$merged_sha" ]; then
              echo "Task $TASK_ID is waiting for merged PR evidence from $dependency ($dependency_branch). A closed issue alone is insufficient." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$merged_sha" HEAD; then
              echo "Task $TASK_ID is waiting for $dependency merge $merged_sha to reach ${{ inputs.integration_branch }}." >&2
              exit 1
            fi
            echo "Dependency satisfied: $dependency via $merged_sha."
          done < /tmp/task-dependencies.tsv

      # On attempt 2+ (a remediate.yml retry), resume the existing
      # agent/<change>-<slug> branch instead of always branching fresh off
      # integration_branch. Found live 2026-07-25 on VOC-026-T00 (PR #88):
      # a review FAIL retry always recreated the branch from develop,
      # silently discarding attempt 1's entire (mostly-correct, per the
      # reviewer) implementation - the retry prompt's "prior review
      # findings" then referenced files that no longer existed in the
      # working tree. The escalation model (gpt-5.6-sol) correctly refused
      # to blindly reinvent ~900 lines of migrations/schemas from a review
      # excerpt rather than guess, which is what surfaced this. Attempt 1
      # is unaffected (no existing branch to resume from) - this only
      # changes retry behavior, and only when the branch actually exists.
      # Before the model runs, rebase that branch onto the latest integration
      # branch. Without this synchronization, a retry can repair yesterday's
      # tree while sibling tasks have already changed the underlying code and
      # tests on develop. The retry then spends its final attempt solving stale
      # state instead of the current failure.
      - name: Create implementation branch
        id: branch
        run: |
          set -euo pipefail
          slug=$(echo "${{ inputs.task_id }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          change_lower=$(echo "${{ inputs.change_id }}" | tr '[:upper:]' '[:lower:]')
          branch="agent/${change_lower}-${slug}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git fetch origin "${{ inputs.integration_branch }}"
          if [ "${{ inputs.attempt }}" != "1" ] && git ls-remote --exit-code --heads origin "$branch" | grep -q .; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            if git rebase "origin/${{ inputs.integration_branch }}"; then
              echo "sync_mode=rebased" >> "$GITHUB_OUTPUT"
            else
              # A stale branch must not strand the autonomous loop before the
              # implementer can run. Preserve the old revision as a readable
              # remote ref, abort the conflicted rebase, and restart this final
              # attempt from the current integration tip. The prompt tells the
              # model exactly where to inspect the previous work if useful.
              git rebase --abort
              git reset --hard "origin/${{ inputs.integration_branch }}"
              echo "sync_mode=fresh-after-rebase-conflict" >> "$GITHUB_OUTPUT"
              echo "::warning::Previous branch conflicted with ${{ inputs.integration_branch }}; retrying from the current integration tip."
            fi
          else
            git checkout -b "$branch" "origin/${{ inputs.integration_branch }}"
            echo "sync_mode=fresh" >> "$GITHUB_OUTPUT"
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Escalates to config/roles.yml's `implementer_escalation` (if
      # configured) on attempt 2 - the last chance before remediate.yml gives
      # up and escalates to a human, per that file's own 2-attempt cap. A
      # first attempt already failed CI or review; retrying with the exact
      # same model on the exact same task is a weaker second guess than
      # trying a stronger model for the one attempt that actually matters
      # (the alternative is a human getting paged regardless). This is the
      # inverse of review.yml's reviewer_fast_retry (which goes CHEAPER on
      # retry, since a review retry is narrow re-verification of an
      # already-scoped fix) - here a retry means the task itself is proving
      # harder than expected, so the lever points the other way.
      - name: Resolve implementer model
        id: model
        run: |
          set -euo pipefail
          role="implementer"
          if [ "${{ inputs.attempt }}" != "1" ]; then
            escalation=$(bash karsift-ai-infra/config/resolve-model.sh implementer_escalation karsift-ai-infra/config/roles.yml || echo "")
            if [ -n "$escalation" ]; then
              role="implementer_escalation"
            fi
          fi
          echo "Resolving implementer as: role=$role (attempt=${{ inputs.attempt }})"
          MODEL=$(bash karsift-ai-infra/config/resolve-model.sh "$role" karsift-ai-infra/config/roles.yml)
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      # On a remediation attempt (attempt > 1), the branch/PR from the
      # previous attempt already exists - fetch its most recent review
      # verdict and hand it to the implementer as required reading. Without
      # this, "attempt 2" would just be a second blind guess instead of an
      # actual fix for what the reviewer flagged.
      - name: Fetch prior review findings, if this is a retry
        id: prior-review
        if: inputs.attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --head "${{ steps.branch.outputs.branch }}" --state all --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            gh api "repos/${{ github.repository }}/issues/$pr_number/comments" \
              --jq '[.[] | select(.body | startswith("**Independent verification"))] | last | .body // ""' \
              > /tmp/prior-review.txt 2>/dev/null || true
          fi
          touch /tmp/prior-review.txt

      - name: Build prompt
        id: prompt
        run: |
          {
            cat karsift-ai-infra/prompts/implement.md
            echo
            echo "## Package: ${{ inputs.change_id }}"
            echo
            echo "### specification.md"
            cat "${{ inputs.package_path }}/specification.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### acceptance-criteria.md"
            cat "${{ inputs.package_path }}/acceptance-criteria.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### implementation-plan.md"
            cat "${{ inputs.package_path }}/implementation-plan.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### tasks.md"
            cat "${{ inputs.package_path }}/tasks.md" 2>/dev/null || echo "(missing)"
            echo
            echo "## Task to implement now"
            echo "Task ID: ${{ inputs.task_id }}"
            echo "This is attempt ${{ inputs.attempt }} of 2."
            if [ "${{ steps.branch.outputs.sync_mode }}" = "fresh-after-rebase-conflict" ]; then
              echo
              echo "## Upstream synchronization"
              echo
              echo "The previous attempt conflicted while rebasing onto the latest"
              echo "${{ inputs.integration_branch }}. This working tree was restarted from the"
              echo "current integration tip so you solve the current repository state. The"
              echo "previous revision remains available read-only at"
              echo "origin/${{ steps.branch.outputs.branch }} if you need to inspect or recover"
              echo "a useful part of it. Do not reset the working tree back to that stale ref."
            fi
            if [ "${{ inputs.attempt }}" != "1" ] && [ -s /tmp/prior-review.txt ]; then
              echo
              echo "## The previous attempt was reviewed and did not pass"
              echo
              echo "This is a remediation attempt. The independent reviewer found the"
              echo "problems below in the previous revision on this same branch. Fix"
              echo "every blocking (Critical/High) finding. Do not just acknowledge them -"
              echo "make the actual code/content change each one requires."
              echo
              cat /tmp/prior-review.txt
            fi
            echo
            echo "## Lessons learned (.karsift/lessons.md, if present)"
            cat .karsift/lessons.md 2>/dev/null || true
          } > /tmp/implement-prompt.txt

      # implementer_escalation moved onto OpenCode too (2026-07-26, founder
      # directive: "no more quota in codex") - collapsed back to the single
      # opencode step this file's own header comment anticipated. The
      # openai/codex-action step below is kept but disabled (if: false), not
      # deleted, so restoring Codex-backed escalation later is a one-line
      # revert if OpenAI quota comes back, rather than reconstructing the
      # actor-permission/verbosity workarounds from scratch.

      # implementer_escalation scoped OUT of the opencode steps below
      # (2026-07-28, VOC-031-T07) - both available OpenCode models hung on
      # this task at attempt 2 (minimax-m3 got stuck debugging a Playwright
      # visibility flake for 37 straight minutes with no further output;
      # kimi-k2.7-code, the escalation model, then produced zero output for
      # the full 55-minute budget) - a real implementer-side hang, not a
      # capacity/timeout-budget problem (raising timeout-minutes already
      # didn't help). Founder directive: try the escalation attempt on
      # Claude Sonnet 5 instead, via the Claude Code CLI - same validated
      # pattern as the 2026-07-26 temporary Haiku quota-fallback (see git
      # history for that commit if reviving more of it), narrowed to
      # implementer_escalation only so the base implementer role (which is
      # NOT hanging on other tasks) stays on OpenCode untouched.
      - name: Install opencode
        if: steps.model.outputs.role == 'implementer' && false
        run: curl -fsSL https://opencode.ai/install | bash

      # --agent build uses OpenCode's own built-in full-access agent (real
      # write/edit/bash needed here, unlike review.yml's restricted
      # read-only `reviewer` agent) - no custom opencode.jsonc needed.
      # --auto auto-approves the two permissions `build` itself marks "ask"
      # (doom_loop, external_directory) rather than denying them outright -
      # required so a headless CI run can't hang waiting for interactive
      # approval; safe here because this is a fresh, disposable checkout
      # with nothing sensitive outside the workspace to protect.
      # Prompt passed via `--file` (a real file the CLI itself reads), not
      # inlined into the command line as a positional argument - a large
      # prompt (full task/spec/acceptance-criteria/prior-findings content)
      # can exceed Linux's ~128KB single-argument exec limit
      # (MAX_ARG_STRLEN), independent of the much larger overall ARG_MAX.
      # See review.yml's identical fix for the live failure (VOC-026-T00,
      # PR #88, "Argument list too long") that surfaced this pattern.
      # Falls back to a second OpenCode account (OPENCODE_SECOND_API_KEY,
      # unset unless the calling project defines it) on what looks like
      # quota/balance exhaustion from the primary account - see review.yml's
      # identical fallback for the full rationale (only retries on that
      # specific failure class, never blindly on any failure).
      # timeout-minutes bounds a real hang, not just a slow run - see
      # plan.yml's identical addition for the live incident that surfaced
      # this gap (a planner hang, same underlying opencode CLI). Raised
      # 20 -> 35 (2026-07-26, matching plan.yml's identical raise the same
      # day): VOC-028-T05 (a large evaluation/observability task - 200+
      # synthetic cases, a golden regression set, mock-inventory updates)
      # hit the 20-minute cap with clean linear progress, no hang symptom -
      # a genuine capacity shortfall for a big task, same root cause as
      # plan.yml's VOC-028/P3 timeout increase.
      # Raised 35 -> 55 (2026-07-27): VOC-031-T07 (Playwright + axe-core
      # accessibility suite across every core-loop screen, plus wiring a new
      # CI workflow) hit the 35-minute cap twice in a row, each time mid
      # linear progress (writing/fixing test files, no repeated identical
      # tool call or other loop symptom) - same capacity-shortfall pattern
      # as VOC-028-T05, just a bigger task.
      - name: Run implementer (opencode)
        id: implementer-opencode
        if: steps.model.outputs.role == 'implementer' && false
        continue-on-error: true
        timeout-minutes: 55
        env:
          # Reverted (2026-07-28) - swapped 2026-07-25 when the primary
          # account's weekly OpenCode Go quota ran out; 3 days later, quota
          # should have reset, so back to the natural primary/fallback
          # assignment. Same revert applied to review.yml's identical swap.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_SECOND_API_KEY: ${{ secrets.OPENCODE_SECOND_API_KEY }}
        run: |
          set -uo pipefail
          source karsift-ai-infra/config/retry-helpers.sh
          run_implementer() {
            OPENCODE_API_KEY="$1" opencode run "Follow the instructions in the attached file exactly." \
              --file /tmp/implement-prompt.txt \
              --agent build \
              --model "${{ steps.model.outputs.model }}" \
              --auto 2> /tmp/opencode-stderr.log
          }
          # Transient-failure retry (same account/model, immediate) happens
          # first; only once THAT is exhausted do we consider this a real
          # quota-exhaustion signal worth swapping accounts for. See
          # retry-helpers.sh's header comment for the live incident and the
          # exact heuristic (fast + content-free failures only - this step's
          # own 55-minute timeout is unaffected since a near-timeout failure
          # never matches the short-duration retry branch).
          retry_if_transient /tmp/opencode-stderr.log -- run_implementer "$OPENCODE_API_KEY"
          exit_code=$?
          if [ "$exit_code" -ne 0 ] && [ -n "${OPENCODE_SECOND_API_KEY:-}" ] && \
             grep -qiE "insufficient balance|quota exceeded|rate.?limit|too many requests|429|payment required|402" \
               /tmp/opencode-stderr.log 2>/dev/null; then
            echo "::warning::Primary OpenCode account looks quota-exhausted - retrying with the second account."
            cat /tmp/opencode-stderr.log >&2
            retry_if_transient /tmp/opencode-stderr.log -- run_implementer "$OPENCODE_SECOND_API_KEY"
            exit_code=$?
          fi
          if [ "$exit_code" -ne 0 ]; then
            cat /tmp/opencode-stderr.log >&2
          fi
          exit "$exit_code"

      # TEMPORARY escalation-only fallback (2026-07-28, VOC-031-T07) - see
      # this file's "implementer_escalation scoped OUT" comment above the
      # opencode steps for why. --allowedTools grants real write/edit/bash
      # (this role has to actually produce a code change, unlike review.yml's
      # read-only reviewer). -p reading the prompt from stdin (not a
      # positional argument) avoids the ~128KB single-argument exec limit a
      # large prompt can hit - see review.yml's identical fix for the live
      # failure that surfaced this pattern. No second-account fallback here
      # (unlike the opencode step's OPENCODE_SECOND_API_KEY) - only one
      # Claude account is provisioned.
      - name: Install Claude Code
        if: steps.model.outputs.role == 'implementer_escalation' && false
        run: npm install -g @anthropic-ai/claude-code

      - name: Run implementer (claude-code escalation)
        id: implementer-claude
        if: steps.model.outputs.role == 'implementer_escalation' && false
        continue-on-error: true
        timeout-minutes: 55
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          source karsift-ai-infra/config/retry-helpers.sh
          run_claude_implementer() {
            claude --model "claude-sonnet-5" \
              --allowedTools "Read,Write,Edit,Bash,Grep,Glob" \
              --output-format json \
              -p < /tmp/implement-prompt.txt > /tmp/claude-raw.json 2> /tmp/claude-stderr.log
          }
          # No second-account fallback exists here (only one Claude account
          # is provisioned), so this only adds the transient-retry layer -
          # see retry-helpers.sh's header comment for the heuristic.
          retry_if_transient /tmp/claude-raw.json /tmp/claude-stderr.log -- run_claude_implementer
          exit_code=$?
          jq -r '.result // empty' /tmp/claude-raw.json 2>/dev/null || true
          echo "--- cost/cache telemetry ---"
          jq '{total_cost_usd, usage}' /tmp/claude-raw.json 2>/dev/null || true
          if [ "$exit_code" -ne 0 ]; then
            cat /tmp/claude-stderr.log >&2
          fi
          exit "$exit_code"

      # codex-action only runs `codex exec` in a sandbox - it never touches
      # git either. DISABLED 2026-07-26 (founder: "no more quota in codex") -
      # implementer_escalation moved onto the opencode step above. Left in
      # place (if: false) rather than deleted so re-enabling Codex-backed
      # escalation later is a one-line revert (this if: + the two if:
      # conditions above) if OpenAI quota is restored, instead of
      # reconstructing the actor-permission/verbosity workarounds below.
      - name: Run implementer (openai/codex-action escalation)
        id: implementer-openai
        if: false
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/implement-prompt.txt
          permission-profile: ":workspace"
          model: ${{ steps.model.outputs.model }}
          # codex-action's own actor-permission check queries the standard
          # collaborator-permission API for whoever triggered the run - which
          # resolves to karsift-ai-infra-bot[bot] (a GitHub App identity, not
          # a plain user) whenever this job runs as part of a chain that
          # traces back to a PR the bot itself opened or pushed to (e.g. a
          # remediate.yml retry, or plan-from-issue's downstream implement
          # dispatch) rather than a human's direct workflow_dispatch. That
          # lookup can't resolve a GitHub App the same way it resolves a
          # user, so it comes back "none" and the action refuses to run -
          # found live on VOC-020-T00's first remediate retry ("Actor
          # 'karsift-ai-infra-bot[bot]' is not permitted to run this action
          # ... Detected permission: 'none'"), even though the App
          # genuinely has write access via its installation permissions.
          # `allow-bots` only covers the generic github-actions[bot] identity
          # (not our custom App), so this repo's actual bot identity has to
          # be named explicitly via allow-bot-users instead.
          allow-bot-users: "karsift-ai-infra-bot[bot]"
          # codex-action's own default text.verbosity ("low") isn't accepted
          # by every model - gpt-5.2-codex rejected it outright ("Unsupported
          # value: 'low' is not supported with the 'gpt-5.2-codex' model.
          # Supported values are: 'medium'."), found on this exact model's
          # first live implement run. Forcing medium here works for every
          # model tried so far; a future model swap in config/roles.yml
          # should re-check this against that model's own supported values
          # rather than assuming medium is universal.
          codex-args: '["-c", "model_verbosity=\"medium\""]'

      # Both implementer and implementer_escalation now run through this
      # single step - see this file's header comment for why. --trust is
      # required non-interactively (a fresh runner workspace is untrusted by
      # default and would otherwise block on an unanswerable prompt - see
      # review.yml's header comment for the live verification of this).
      # --force/--yolo grants real write/shell access, the equivalent of
      # opencode's --auto or claude's unrestricted --allowedTools for this
      # role - unlike review.yml's reviewer, which deliberately omits this
      # and uses --mode plan instead. Prompt piped via stdin, not a
      # positional argument, for the same execve()-argument-length reason
      # documented on the opencode step above and in review.yml's header
      # comment.
      - name: Install Cursor CLI
        if: steps.model.outputs.role == 'implementer' || steps.model.outputs.role == 'implementer_escalation'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Verify the install actually worked before proceeding - found live
          # (VOC-035-T03's evidence PR #242) that cursor.com/install can
          # return a transient HTTP 500, and the `curl | bash` one-liner did
          # NOT fail this step outright when that happened (bash on the
          # right side of the pipe received truncated/empty input and still
          # exited 0) - the job silently continued into the next step, which
          # then failed with a cryptic, hard-to-diagnose "agent: command not
          # found" / exit 127 instead of a clear install-failure message.
          # This check fails loudly and immediately at the actual point of
          # failure instead.
          if ! "$HOME/.local/bin/agent" --version >/dev/null 2>&1; then
            echo "::error::Cursor CLI install failed - agent binary not found/working at \$HOME/.local/bin/agent after install. This is usually a transient issue with cursor.com/install itself (e.g. an HTTP 500 from their endpoint, seen live) - rerun the job." >&2
            exit 1
          fi

      - name: Run implementer (cursor-agent)
        id: implementer-cursor
        if: steps.model.outputs.role == 'implementer' || steps.model.outputs.role == 'implementer_escalation'
        continue-on-error: true
        timeout-minutes: 55
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -uo pipefail
          source karsift-ai-infra/config/retry-helpers.sh
          MODEL="${{ steps.model.outputs.model }}"
          MODEL="${MODEL#cursor/}"
          run_implementer() {
            agent -p --trust --force --model "$MODEL" --output-format json \
              < /tmp/implement-prompt.txt \
              > /tmp/cursor-response.json 2> /tmp/cursor-stderr.log
          }
          retry_if_transient /tmp/cursor-stderr.log /tmp/cursor-response.json -- run_implementer
          exit_code=$?
          if [ "$exit_code" -eq 0 ] && [ -s /tmp/cursor-response.json ] && jq -e '.is_error == true' /tmp/cursor-response.json >/dev/null 2>&1; then
            echo "cursor-agent reported an application-level error: $(jq -r '.result' /tmp/cursor-response.json)" >&2
            exit_code=1
          fi
          if [ "$exit_code" -ne 0 ]; then
            cat /tmp/cursor-stderr.log >&2
          fi
          exit "$exit_code"

      # Unconditional visibility into the model's own text response - added
      # after a real live incident (VOC-035-T02, first attempt) where the
      # CLI exited 0, is_error was false, but "Commit implementer's work"
      # found nothing staged (a genuine no-op, not a crash) and the run gave
      # no way to see WHY the model didn't write anything, since the
      # previous version of this step only printed output on a non-zero
      # exit or an is_error response. Mirrors review.yml's "Show verdict"
      # step for the same reason - always show the model's own explanation,
      # not just on failure.
      - name: Show implementer response (diagnostic)
        if: always() && (steps.model.outputs.role == 'implementer' || steps.model.outputs.role == 'implementer_escalation')
        run: |
          jq -r '.result // "(no result field)"' /tmp/cursor-response.json 2>/dev/null || echo "(no parseable response)"

      # Normalizes every branch's outcome into one `steps.implementer.outputs
      # .outcome` the rest of this job (which doesn't know or shouldn't need
      # to know which vendor ran) checks - always() so it runs even though
      # each branch above uses continue-on-error and only one of them ran at
      # all (the others' outcome is 'skipped', not 'failure').
      - name: Normalize implementer outcome
        id: implementer
        if: always()
        run: |
          for outcome in "${{ steps.implementer-cursor.outcome }}" "${{ steps.implementer-claude.outcome }}" "${{ steps.implementer-opencode.outcome }}" "${{ steps.implementer-openai.outcome }}"; do
            if [ "$outcome" != "skipped" ]; then
              echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "outcome=skipped" >> "$GITHUB_OUTPUT"

      # `secrets` isn't a recognized context inside a step-level `if:` here
      # (GitHub Actions rejects it outright: "Unrecognized named-value:
      # 'secrets'") - route the presence check through a plain env var and
      # a shell step's output instead, which is the reliable pattern.
      - name: Check for GitHub App credentials
        id: has-app
        if: steps.implementer.outputs.outcome == 'success'
        env:
          APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
        run: echo "configured=$([ -n \"$APP_ID\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Minted BEFORE "Commit and push" (moved here 2026-07-28, VOC-031-T07a)
      # - not just for "Open or update PR" as this step's name used to imply.
      # The default GITHUB_TOKEN structurally can never push a change to
      # .github/workflows/* regardless of this job's own `permissions:
      # workflows: write` block - GitHub enforces that at the token-type
      # level, not the requested-scope level, and rejects the push outright
      # ("refusing to allow a GitHub App to create or update workflow ...
      # without workflows permission"). Live failure: VOC-031-T07/T07a, a
      # task whose own scope was to add a new .github/workflows/*.yml file -
      # every attempt's implementer succeeded but the push silently failed
      # after, discarding real completed work. A GitHub App installation
      # token (if this project has one configured, see has-app above) CAN
      # carry workflows: write if granted at the App level - using it for
      # the push, not just PR creation, is the actual fix.
      - name: Mint App installation token for push and PR creation
        id: app-token
        if: steps.implementer.outputs.outcome == 'success' && steps.has-app.outputs.configured == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

      - name: Commit implementer's work
        id: commit
        if: steps.implementer.outputs.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "karsift-ai-infra-bot"
          git config user.email "actions@users.noreply.github.com"

          # The implementer role's prompt says "commit your changes to the
          # branch" (wording that made sense for Codex, which never touches
          # git at all) but a Claude Code implementer has real Bash access
          # and can - and on karsift-ai-infra-smoke-test's second run, did -
          # take that literally and run `git commit` itself. That left
          # nothing staged for this step to find, so "no changes" was
          # reported and the PR silently never got opened despite the
          # implementer succeeding. `git reset --soft` to the branch's
          # starting commit un-does any commit(s) the model made without
          # discarding the file changes, so the diff below is correct
          # whether the model committed, didn't, or committed multiple
          # times - this step remains the single source of truth for what
          # actually gets pushed, regardless of model behavior. (The prompt
          # itself is also being fixed to stop suggesting this - see
          # prompts/implement.md - but relying on prompt compliance alone
          # for something this consequential isn't good enough on its own.)
          git reset --soft "${{ steps.branch.outputs.base_sha }}"

          # karsift-ai-infra/ was checked out earlier as a nested working copy
          # (its own .git) purely so the implementer could read prompts/
          # config - it must never end up in the implementer's own commit.
          # `git add -A` from the repo root treats a nested .git as a gitlink
          # (implicit submodule reference with no .gitmodules entry), which
          # is exactly what happened on karsift-ai-infra-smoke-test's first
          # real run: the reviewer correctly caught it as a Critical,
          # out-of-scope, repo-integrity-breaking finding and failed the PR.
          # Removing the directory before staging is more robust than a
          # pathspec exclusion on git add - it can't regress if someone later
          # adds another `git add` call downstream.
          #
          # The checks script is copied out first so "Pre-push validation"
          # below can still run it after this directory is gone.
          cp karsift-ai-infra/config/run-app-checks.sh /tmp/run-app-checks.sh
          rm -rf karsift-ai-infra

          git add -A
          if git diff --cached --quiet; then
            echo "Implementer made no changes - nothing to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "${{ inputs.change_id }}: ${{ inputs.task_id }} (attempt ${{ inputs.attempt }})"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Best-effort, not a gate: this never blocks the push below (both
      # steps below are continue-on-error / unconditional on outcome) and
      # the real gate remains ci.yml running post-push plus remediate.yml's
      # existing 2-attempt-then-escalate contract. Point is to catch the
      # common, cheap-to-fix case (formatting, an obvious lint/type error,
      # a broken test) before spending a full CI round-trip and, on
      # failure, a whole extra remediate.yml attempt to learn about it -
      # exactly the gap the VOC-046-T03 live run exposed (attempt 1 failed
      # CI purely on stale/format-shaped issues a local check would have
      # caught immediately). Uses the exact same script ci.yml itself
      # runs (config/run-app-checks.sh) so a pass here is a real predictor
      # of ci.yml passing, not a hand-maintained approximation of it.
      - name: Pre-push validation
        id: prepush
        if: steps.commit.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          if bash /tmp/run-app-checks.sh > /tmp/prepush-checks.log 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/prepush-checks.log

      # One bounded self-correction round, same model/CLI as the base
      # implementer run, operating on the same on-disk working tree (not a
      # fresh checkout) so it can see and fix the actual failing files.
      # Deliberately not a loop to convergence - a single round catches the
      # common case (the model left a lint/format/obvious-typecheck issue)
      # without risking an implementer stuck re-fixing its own regressions
      # indefinitely inside one job. If this round doesn't fully fix it,
      # the pushed PR still goes through review/CI/remediate.yml exactly
      # as before - this step only ever narrows what reaches that point.
      - name: Self-correct failed pre-push validation
        id: selfcorrect
        if: steps.prepush.outputs.passed == 'false'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -uo pipefail
          MODEL="${{ steps.model.outputs.model }}"
          MODEL="${MODEL#cursor/}"
          {
            echo "Your previous changes on this branch failed this project's own CI checks - the same format/lint/typecheck/test/build commands GitHub Actions will run on this exact diff. Fix every failure below without changing scope beyond what's needed to pass. Do not revert or discard unrelated work already committed on this branch."
            echo
            echo "## Failing check output"
            echo '```'
            cat /tmp/prepush-checks.log
            echo '```'
          } > /tmp/selfcorrect-prompt.txt
          agent -p --trust --force --model "$MODEL" --output-format json \
            < /tmp/selfcorrect-prompt.txt \
            > /tmp/cursor-selfcorrect-response.json 2> /tmp/cursor-selfcorrect-stderr.log
          exit_code=$?
          jq -r '.result // "(no result field)"' /tmp/cursor-selfcorrect-response.json 2>/dev/null || true
          if [ "$exit_code" -ne 0 ]; then
            cat /tmp/cursor-selfcorrect-stderr.log >&2
          fi
          exit "$exit_code"

      - name: Re-commit self-corrected work
        if: steps.selfcorrect.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf karsift-ai-infra
          git add -A
          if git diff --cached --quiet; then
            echo "Self-correction produced no additional changes."
          else
            git commit -m "${{ inputs.change_id }}: ${{ inputs.task_id }} (attempt ${{ inputs.attempt }}, pre-push self-correction)"
          fi

      # Diagnostic only (continue-on-error, output unused downstream) - lets
      # the run's logs show whether self-correction actually worked without
      # gating anything further on it.
      - name: Re-run pre-push validation after self-correction
        if: steps.selfcorrect.outcome == 'success'
        continue-on-error: true
        run: bash /tmp/run-app-checks.sh

      # A GitHub Actions job cannot resume mid-job on rerun - a failed job
      # reruns from step 1 on a brand-new runner, and everything on the old
      # runner (including a successfully committed implementer diff sitting
      # only in its local working tree) is gone. Before 2026-07-28, a push
      # failure for ANY reason (the `workflows` permission gap that hit
      # VOC-031-T07/T07a repeatedly, a transient network blip, a real
      # force-with-lease race) meant redoing the ENTIRE implementer run from
      # scratch - burning real model cost and CI time on work that had
      # already succeeded once. Bundling the new commit(s) as a build
      # artifact right after commit, before the risky push, means a
      # push-only failure is now recoverable without re-invoking the model:
      # download the artifact, `git bundle unbundle` it onto a checkout of
      # the base branch, and push by hand (or via a future automated retry
      # job - not built yet, this just makes that possible).
      - name: Bundle committed work as a recovery artifact
        id: bundle
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git bundle create /tmp/implementer-work.bundle "${{ steps.branch.outputs.base_sha }}..HEAD"

      - name: Upload recovery artifact
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: implement-${{ inputs.change_id }}-${{ inputs.task_id }}-attempt${{ inputs.attempt }}
          path: /tmp/implementer-work.bundle
          retention-days: 14

      - name: Push branch
        id: push
        if: steps.commit.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Overrides actions/checkout's default GITHUB_TOKEN credential for
          # this push only, when an App token was minted above - see that
          # step's comment for why this specific push needs it (a task that
          # adds/modifies .github/workflows/*, which GITHUB_TOKEN can never
          # push regardless of this job's declared permissions).
          #
          # actions/checkout persists its own GITHUB_TOKEN credential as a
          # global `http.https://github.com/.extraheader` config value -
          # that extraheader takes precedence over whatever credential is
          # embedded in the remote URL, so `git remote set-url` alone is not
          # enough: the push silently kept authenticating as the OLD token
          # even after the URL was changed, and kept hitting the exact same
          # `workflows` permission rejection despite the App token
          # confirmed-minted with the right permission. Live failure
          # (2026-07-28, VOC-031-T07a, 3 repeat failures after the App
          # permission was actually fixed) - unsetting the extraheader
          # first is required for the URL-embedded token to actually win.
          if [ -n "$APP_TOKEN" ]; then
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          fi

          # --force-with-lease: on attempt 1 the remote branch doesn't
          # exist yet, so this behaves like a normal push. On a
          # remediation attempt (attempt > 1), the branch already exists
          # from the previous try and this run started from a fresh
          # checkout of integration_branch rather than that old branch -
          # force-updating replaces the previous (reviewed, failed)
          # revision with the corrected one instead of trying to merge
          # them, which is the outcome we actually want.
          #
          # --force-with-lease refuses to push unless the local repo's
          # own record of the remote branch's tip matches reality - and
          # this checkout never fetched that branch (it started fresh
          # from integration_branch), so on vocanova-platform-sandbox's
          # first live remediation attempt that record didn't exist at
          # all and the push was rejected outright as "stale info," even
          # though the implementer itself had succeeded. Fetching the
          # branch first (a no-op, exit-0 on attempt 1 when it doesn't
          # exist yet) gives the lease a real baseline to compare against.
          git fetch origin "${{ steps.branch.outputs.branch }}" 2>/dev/null || true
          git push --force-with-lease -u origin "${{ steps.branch.outputs.branch }}"

      # On a remediation attempt, the force-push above already updated the
      # existing PR (pushing new commits to a PR's head branch updates it
      # automatically - GitHub doesn't need a second `gh pr create` call,
      # and that call would just fail with "already exists"). Check first
      # and only create when there's genuinely no PR yet.
      - name: Open or update PR
        if: steps.commit.outputs.has_changes == 'true' && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "${{ steps.branch.outputs.branch }}" --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          body="$(cat <<EOF
          Implements task \`${{ inputs.task_id }}\` from \`${{ inputs.change_id }}\` (\`${{ inputs.package_path }}\`).

          Closes #${{ inputs.issue_number }}.

          Implemented by the implementer role (attempt ${{ inputs.attempt }} of 2,
          model resolved from karsift-ai-infra/config/roles.yml). Independent review
          and required human approval are still pending - this PR is not authorized
          to merge on its own.

          Risk classification: ${{ steps.package.outputs.risk }}

          Package path: \`${{ inputs.package_path }}\`
          EOF
          )"

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            # The body's "attempt N of 2" text is remediate.yml's only
            # source for the current attempt number - a comment-only update
            # left it permanently reading "attempt 1 of 2" from PR
            # creation, forever. remediate.yml then always recomputed
            # next_attempt as 1+1=2, no matter how many retries had
            # actually happened: the two-attempt cap was never real, and a
            # PR whose review kept failing for reasons unrelated to content
            # (e.g. a scope mismatch between the PR's stated task and what
            # attempt 2 actually delivered) could retry indefinitely.
            # Discovered on VOC-013-T00's real remediation run: a second
            # retry fired after the cap should have been hit. Editing the
            # body on every update, not just commenting, keeps this the
            # single source of truth remediate.yml already trusts it to be.
            gh pr edit "$existing" --body "$body"
            gh pr comment "$existing" --body "Pushed attempt ${{ inputs.attempt }} of 2 - see the commit above for what changed in response to the previous review."
            exit 0
          fi

          gh pr create \
            --base "${{ inputs.integration_branch }}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "${{ inputs.change_id }}: ${{ inputs.task_id }}" \
            --body "$body"

      # Two stacked bugs found live on VOC-028-T05, both now fixed:
      # 1. `!= 'success'`, not `== 'failure'` - a step that hits its own
      #    timeout-minutes is cancelled by the runner, and continue-on-error
      #    preserves that as outcome == 'cancelled' (not 'failure').
      # 2. `steps.implementer.outputs.outcome`, not `steps.implementer.outcome`
      #    (missing `.outputs`) - `steps.<id>.outcome` (no `.outputs`) is the
      #    *step's own* execution result (did "Normalize implementer outcome"
      #    itself run without erroring - an `echo` command, so always
      #    'success' no matter what it echoed), completely different from
      #    `steps.<id>.outputs.<name>`, the custom output value that step
      #    wrote. Fix #1 alone (still using the wrong field) made zero
      #    observable difference - re-timed-out on the very next T05 retry
      #    with the identical silent-success symptom, which is what
      #    surfaced this second, more fundamental bug. Together: neither
      #    "Escalate on final failed attempt" nor "Fail job if implementer
      #    step failed" had EVER actually fired on any real implementer
      #    failure since this Normalize/outcome pattern was introduced -
      #    both conditions were unconditionally false. Also fixed the same
      #    bug on line ~394 ("Commit and push"'s own `if:`), which had been
      #    running unconditionally regardless of implementer outcome for
      #    the same reason (harmless in practice only because its own
      #    internal git-diff check happens to no-op when nothing changed).
      # `steps.push.outcome == 'failure'` added 2026-07-28 alongside the
      # commit/push step split (see "Bundle committed work as a recovery
      # artifact" above) - previously the push happened inside "Commit and
      # push" itself, so a push failure's own non-zero exit (under
      # set -euo pipefail) failed that whole step before has_changes=true
      # was ever written, which this condition's `has_changes == 'false'`
      # branch caught. After the split, has_changes is set right after a
      # successful COMMIT, independent of push outcome - without this extra
      # check, a push-only failure (the `workflows` permission gap that hit
      # VOC-031-T07/T07a repeatedly) would satisfy neither existing
      # condition and silently skip the escalation comment on attempt 2.
      - name: Escalate on final failed attempt
        if: (steps.implementer.outputs.outcome != 'success' || steps.commit.outputs.has_changes == 'false' || steps.push.outcome == 'failure') && inputs.attempt >= '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.push.outcome }}" = "failure" ]; then
            gh issue comment ${{ inputs.issue_number }} --body \
              "The implementer succeeded on attempt ${{ inputs.attempt }}/2 for task \`${{ inputs.task_id }}\` in \`${{ inputs.change_id }}\`, but pushing the result failed (see this run's logs). Stopping - not retrying automatically. A human needs to look at this task. The completed work was NOT lost - download this run's \`implement-${{ inputs.change_id }}-${{ inputs.task_id }}-attempt${{ inputs.attempt }}\` artifact, \`git bundle unbundle\` it onto a checkout of \`${{ inputs.integration_branch }}\`, and push it by hand instead of waiting for a re-run to redo the implementer's work."
          else
            gh issue comment ${{ inputs.issue_number }} --body \
              "The implementer failed to produce a change on attempt ${{ inputs.attempt }}/2 for task \`${{ inputs.task_id }}\` in \`${{ inputs.change_id }}\`. Stopping - not retrying automatically. A human needs to look at this task."
          fi

      - name: Fail job if implementer step failed
        if: steps.implementer.outputs.outcome != 'success' || steps.push.outcome == 'failure'
        run: exit 1
