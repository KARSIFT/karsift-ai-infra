name: implement (reusable)

# Runs the "implementer" role against one task from an approved change package.
# Which model fills that role is resolved from THIS repo's own config/roles.yml,
# so swapping models never touches a calling project's own workflow.
#
# Restored to openai/codex-action (2026-07-23) once OpenAI API billing became
# available - see config/roles.yml's header comment for the prior same-vendor
# compromise (Claude Code for both implementer and reviewer) this replaced,
# and for the LATER same-vendor compromise (2026-07-24: Anthropic Console org
# disabled, reviewer/planner moved to openai/codex-action too) that currently
# applies again - check config/roles.yml's actual values before assuming
# implementer and reviewer are on different vendors right now; the two
# compromises are not the same event, just the same category of problem.
# Swapping vendors again in the future only touches this file's
# "Run implementer" step and config/roles.yml's `implementer` value - the
# role/prompt/branch/commit/PR machinery around it is provider-agnostic by
# design and needs no changes in review.yml/merge-gate.yml either way.
#
# MIXED-VENDOR (2026-07-25): `implementer` itself moved to OpenCode
# (opencode-go/kimi-k2.7-code - see config/roles.yml), but
# `implementer_escalation` deliberately stayed on openai/codex-action
# (gpt-5.6-sol) as a genuinely different, strong fallback for the one retry
# that matters most - not just a cost lever this time, a real cross-vendor
# second opinion on the hardest attempt. That means THIS file, unlike
# review.yml/plan.yml, now has two real execution steps ("Run implementer
# (opencode)" and "Run implementer (openai/codex-action escalation)"),
# gated by `steps.model.outputs.role`, not one - a future full move of
# implementer_escalation to OpenCode too would let this collapse back to a
# single step, but don't do that without checking config/roles.yml's actual
# current values first.

on:
  workflow_call:
    inputs:
      change_id:
        description: 'The adopted change package to implement from, e.g. "VOC-007"'
        required: true
        type: string
      package_path:
        description: 'Path to the package directory, e.g. "specs/changes/VOC-007-some-slug"'
        required: true
        type: string
      task_id:
        description: "The specific task ID from the package's task list being implemented this run"
        required: true
        type: string
      issue_number:
        description: "The GitHub issue carrying implementation authority for this task"
        required: true
        type: string
      attempt:
        description: 1 or 2. On attempt 2 failure, escalate to the issue and stop - no attempt 3.
        required: false
        type: string
        default: "1"
      integration_branch:
        description: 'The calling project''s integration branch to base the work off - "develop" for a develop/main split, "main" for GitHub-flow-only projects.'
        required: false
        type: string
        default: "develop"
    secrets:
      OPENAI_API_KEY:
        description: "Used only for implementer_escalation (gpt-5.6-sol) - see this file's header comment."
        required: true
      OPENCODE_API_KEY:
        description: "Used for the base implementer role (opencode-go/kimi-k2.7-code)."
        required: true
      KARSIFT_BOT_APP_ID:
        description: >
          Optional. GitHub App ID for minting the PR-creation token. Without
          it, PR creation falls back to the default GITHUB_TOKEN, and GitHub
          will require a manual "Approve workflows to run" click on every
          resulting PR (a security behavior GitHub applies to any PR that
          GITHUB_TOKEN creates or updates, same-repo or not - not a bug in
          this workflow). Set this and KARSIFT_BOT_PRIVATE_KEY once a project
          has a GitHub App installed for it to remove that friction.
        required: false
      KARSIFT_BOT_PRIVATE_KEY:
        description: "Optional, paired with KARSIFT_BOT_APP_ID - see that input's description."
        required: false

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_branch }}

      - name: Checkout karsift-ai-infra
        uses: actions/checkout@v4
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra

      - name: Refuse to run without an adopted, authorized package
        id: package
        run: |
          pip install --quiet pyyaml
          python3 - "${{ inputs.package_path }}" "${{ inputs.issue_number }}" "$GITHUB_OUTPUT" <<'PYEOF'
          import sys
          import yaml

          package_path, expected_issue, github_output = sys.argv[1:4]
          data = yaml.safe_load(open(f"{package_path}/change.yaml"))

          if data.get("status") not in ("implementing", "adopted", "implementation-ready"):
              sys.exit(f"Package status '{data.get('status')}' is not implementation-ready - refusing to run.")

          impl = data.get("implementation", {})
          if not impl.get("authorized"):
              sys.exit("Package implementation.authorized is not true - refusing to run.")

          # impl.get("authority_issue", "") only falls back to "" when the key
          # is MISSING - a package that explicitly writes `authority_issue:
          # null` (valid YAML for "not applicable", e.g. a multi-task package
          # with no single authority issue) gets Python None back, and
          # str(None) is the non-empty string "None", which then fails the
          # match check below against every dispatched issue number. `or ""`
          # additionally coerces None (and only None) to "" so an explicit
          # null behaves the same as an absent key. Found live on
          # karsift-ai-infra-smoke-test's TEST-005 (first real multi-task
          # planner-drafted package): authority_issue: null incorrectly
          # blocked implement.yml with "authority_issue (None) does not match
          # the issue this run was dispatched for (7)."
          authority_issue = str(impl.get("authority_issue") or "")
          if authority_issue and authority_issue != str(expected_issue):
              sys.exit(
                  f"Package authority_issue ({authority_issue}) does not match "
                  f"the issue this run was dispatched for ({expected_issue})."
              )

          # Surface the package's own declared risk so "Open PR" can put a
          # real "Risk classification: R#" line in the PR body automatically -
          # merge-gate.yml fails closed (requires founder approval) without
          # one, so leaving this to be added by hand is a gap, not a feature.
          risk = str(data.get("risk", "")).upper()
          with open(github_output, "a") as f:
              f.write(f"risk={risk}\n")

          print(f"Package is adopted and authorized (declared risk: {risk or 'none declared'}) - proceeding.")
          PYEOF

      # On attempt 2+ (a remediate.yml retry), resume the existing
      # agent/<change>-<slug> branch instead of always branching fresh off
      # integration_branch. Found live 2026-07-25 on VOC-026-T00 (PR #88):
      # a review FAIL retry always recreated the branch from develop,
      # silently discarding attempt 1's entire (mostly-correct, per the
      # reviewer) implementation - the retry prompt's "prior review
      # findings" then referenced files that no longer existed in the
      # working tree. The escalation model (gpt-5.6-sol) correctly refused
      # to blindly reinvent ~900 lines of migrations/schemas from a review
      # excerpt rather than guess, which is what surfaced this. Attempt 1
      # is unaffected (no existing branch to resume from) - this only
      # changes retry behavior, and only when the branch actually exists.
      # A human wanting a genuinely fresh restart (see item 31 in the bugs
      # list - sometimes a clean attempt beats patching a bad one) still
      # has that path: close the PR and re-dispatch as attempt 1.
      - name: Create implementation branch
        id: branch
        run: |
          set -euo pipefail
          slug=$(echo "${{ inputs.task_id }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          change_lower=$(echo "${{ inputs.change_id }}" | tr '[:upper:]' '[:lower:]')
          branch="agent/${change_lower}-${slug}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.attempt }}" != "1" ] && git ls-remote --exit-code --heads origin "$branch" | grep -q .; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Escalates to config/roles.yml's `implementer_escalation` (if
      # configured) on attempt 2 - the last chance before remediate.yml gives
      # up and escalates to a human, per that file's own 2-attempt cap. A
      # first attempt already failed CI or review; retrying with the exact
      # same model on the exact same task is a weaker second guess than
      # trying a stronger model for the one attempt that actually matters
      # (the alternative is a human getting paged regardless). This is the
      # inverse of review.yml's reviewer_fast_retry (which goes CHEAPER on
      # retry, since a review retry is narrow re-verification of an
      # already-scoped fix) - here a retry means the task itself is proving
      # harder than expected, so the lever points the other way.
      - name: Resolve implementer model
        id: model
        run: |
          set -euo pipefail
          role="implementer"
          if [ "${{ inputs.attempt }}" != "1" ]; then
            escalation=$(bash karsift-ai-infra/config/resolve-model.sh implementer_escalation karsift-ai-infra/config/roles.yml || echo "")
            if [ -n "$escalation" ]; then
              role="implementer_escalation"
            fi
          fi
          echo "Resolving implementer as: role=$role (attempt=${{ inputs.attempt }})"
          MODEL=$(bash karsift-ai-infra/config/resolve-model.sh "$role" karsift-ai-infra/config/roles.yml)
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      # On a remediation attempt (attempt > 1), the branch/PR from the
      # previous attempt already exists - fetch its most recent review
      # verdict and hand it to the implementer as required reading. Without
      # this, "attempt 2" would just be a second blind guess instead of an
      # actual fix for what the reviewer flagged.
      - name: Fetch prior review findings, if this is a retry
        id: prior-review
        if: inputs.attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --head "${{ steps.branch.outputs.branch }}" --state all --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            gh api "repos/${{ github.repository }}/issues/$pr_number/comments" \
              --jq '[.[] | select(.body | startswith("**Independent verification"))] | last | .body // ""' \
              > /tmp/prior-review.txt 2>/dev/null || true
          fi
          touch /tmp/prior-review.txt

      - name: Build prompt
        id: prompt
        run: |
          {
            cat karsift-ai-infra/prompts/implement.md
            echo
            echo "## Package: ${{ inputs.change_id }}"
            echo
            echo "### specification.md"
            cat "${{ inputs.package_path }}/specification.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### acceptance-criteria.md"
            cat "${{ inputs.package_path }}/acceptance-criteria.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### implementation-plan.md"
            cat "${{ inputs.package_path }}/implementation-plan.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### tasks.md"
            cat "${{ inputs.package_path }}/tasks.md" 2>/dev/null || echo "(missing)"
            echo
            echo "## Task to implement now"
            echo "Task ID: ${{ inputs.task_id }}"
            echo "This is attempt ${{ inputs.attempt }} of 2."
            if [ "${{ inputs.attempt }}" != "1" ] && [ -s /tmp/prior-review.txt ]; then
              echo
              echo "## The previous attempt was reviewed and did not pass"
              echo
              echo "This is a remediation attempt. The independent reviewer found the"
              echo "problems below in the previous revision on this same branch. Fix"
              echo "every blocking (Critical/High) finding. Do not just acknowledge them -"
              echo "make the actual code/content change each one requires."
              echo
              cat /tmp/prior-review.txt
            fi
          } > /tmp/implement-prompt.txt

      # Two vendor-branched execution steps, gated by which role
      # steps.model.outputs.role resolved to (see this file's header
      # comment for why implementer_escalation stayed on a different
      # vendor). Neither commits or pushes - that's the deterministic
      # "Commit and push" step below, not something either model is trusted
      # to do itself. A future full move of implementer_escalation to
      # OpenCode too would let these collapse back to one step.

      - name: Install opencode
        if: steps.model.outputs.role == 'implementer'
        run: curl -fsSL https://opencode.ai/install | bash

      # --agent build uses OpenCode's own built-in full-access agent (real
      # write/edit/bash needed here, unlike review.yml's restricted
      # read-only `reviewer` agent) - no custom opencode.jsonc needed.
      # --auto auto-approves the two permissions `build` itself marks "ask"
      # (doom_loop, external_directory) rather than denying them outright -
      # required so a headless CI run can't hang waiting for interactive
      # approval; safe here because this is a fresh, disposable checkout
      # with nothing sensitive outside the workspace to protect.
      # Prompt passed via `--file` (a real file the CLI itself reads), not
      # inlined into the command line as a positional argument - a large
      # prompt (full task/spec/acceptance-criteria/prior-findings content)
      # can exceed Linux's ~128KB single-argument exec limit
      # (MAX_ARG_STRLEN), independent of the much larger overall ARG_MAX.
      # See review.yml's identical fix for the live failure (VOC-026-T00,
      # PR #88, "Argument list too long") that surfaced this pattern.
      # Falls back to a second OpenCode account (OPENCODE_SECOND_API_KEY,
      # unset unless the calling project defines it) on what looks like
      # quota/balance exhaustion from the primary account - see review.yml's
      # identical fallback for the full rationale (only retries on that
      # specific failure class, never blindly on any failure).
      # timeout-minutes bounds a real hang, not just a slow run - see
      # plan.yml's identical addition for the live incident that surfaced
      # this gap (a planner hang, same underlying opencode CLI).
      - name: Run implementer (opencode)
        id: implementer-opencode
        if: steps.model.outputs.role == 'implementer'
        continue-on-error: true
        timeout-minutes: 20
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_SECOND_API_KEY: ${{ secrets.OPENCODE_SECOND_API_KEY }}
        run: |
          set -uo pipefail
          run_implementer() {
            OPENCODE_API_KEY="$1" opencode run "Follow the instructions in the attached file exactly." \
              --file /tmp/implement-prompt.txt \
              --agent build \
              --model "${{ steps.model.outputs.model }}" \
              --auto 2> /tmp/opencode-stderr.log
          }
          run_implementer "$OPENCODE_API_KEY"
          exit_code=$?
          if [ "$exit_code" -ne 0 ] && [ -n "${OPENCODE_SECOND_API_KEY:-}" ] && \
             grep -qiE "insufficient balance|quota exceeded|rate.?limit|too many requests|429|payment required|402" \
               /tmp/opencode-stderr.log 2>/dev/null; then
            echo "::warning::Primary OpenCode account looks quota-exhausted - retrying with the second account."
            cat /tmp/opencode-stderr.log >&2
            run_implementer "$OPENCODE_SECOND_API_KEY"
            exit_code=$?
          fi
          if [ "$exit_code" -ne 0 ]; then
            cat /tmp/opencode-stderr.log >&2
          fi
          exit "$exit_code"

      # codex-action only runs `codex exec` in a sandbox - it never touches
      # git either. Used only for implementer_escalation (attempt 2, a
      # different vendor from the base implementer above - see this file's
      # header comment).
      - name: Run implementer (openai/codex-action escalation)
        id: implementer-openai
        if: steps.model.outputs.role == 'implementer_escalation'
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/implement-prompt.txt
          permission-profile: ":workspace"
          model: ${{ steps.model.outputs.model }}
          # codex-action's own actor-permission check queries the standard
          # collaborator-permission API for whoever triggered the run - which
          # resolves to karsift-ai-infra-bot[bot] (a GitHub App identity, not
          # a plain user) whenever this job runs as part of a chain that
          # traces back to a PR the bot itself opened or pushed to (e.g. a
          # remediate.yml retry, or plan-from-issue's downstream implement
          # dispatch) rather than a human's direct workflow_dispatch. That
          # lookup can't resolve a GitHub App the same way it resolves a
          # user, so it comes back "none" and the action refuses to run -
          # found live on VOC-020-T00's first remediate retry ("Actor
          # 'karsift-ai-infra-bot[bot]' is not permitted to run this action
          # ... Detected permission: 'none'"), even though the App
          # genuinely has write access via its installation permissions.
          # `allow-bots` only covers the generic github-actions[bot] identity
          # (not our custom App), so this repo's actual bot identity has to
          # be named explicitly via allow-bot-users instead.
          allow-bot-users: "karsift-ai-infra-bot[bot]"
          # codex-action's own default text.verbosity ("low") isn't accepted
          # by every model - gpt-5.2-codex rejected it outright ("Unsupported
          # value: 'low' is not supported with the 'gpt-5.2-codex' model.
          # Supported values are: 'medium'."), found on this exact model's
          # first live implement run. Forcing medium here works for every
          # model tried so far; a future model swap in config/roles.yml
          # should re-check this against that model's own supported values
          # rather than assuming medium is universal.
          codex-args: '["-c", "model_verbosity=\"medium\""]'

      # Normalizes both branches' outcome into one `steps.implementer.outputs
      # .outcome` the rest of this job (which doesn't know or shouldn't need
      # to know which vendor ran) checks - always() so it runs even though
      # each branch above uses continue-on-error and only one of them ran at
      # all (the other's outcome is 'skipped', not 'failure').
      - name: Normalize implementer outcome
        id: implementer
        if: always()
        run: |
          if [ "${{ steps.model.outputs.role }}" = "implementer_escalation" ]; then
            outcome="${{ steps.implementer-openai.outcome }}"
          else
            outcome="${{ steps.implementer-opencode.outcome }}"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: steps.implementer.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "karsift-ai-infra-bot"
          git config user.email "actions@users.noreply.github.com"

          # The implementer role's prompt says "commit your changes to the
          # branch" (wording that made sense for Codex, which never touches
          # git at all) but a Claude Code implementer has real Bash access
          # and can - and on karsift-ai-infra-smoke-test's second run, did -
          # take that literally and run `git commit` itself. That left
          # nothing staged for this step to find, so "no changes" was
          # reported and the PR silently never got opened despite the
          # implementer succeeding. `git reset --soft` to the branch's
          # starting commit un-does any commit(s) the model made without
          # discarding the file changes, so the diff below is correct
          # whether the model committed, didn't, or committed multiple
          # times - this step remains the single source of truth for what
          # actually gets pushed, regardless of model behavior. (The prompt
          # itself is also being fixed to stop suggesting this - see
          # prompts/implement.md - but relying on prompt compliance alone
          # for something this consequential isn't good enough on its own.)
          git reset --soft "${{ steps.branch.outputs.base_sha }}"

          # karsift-ai-infra/ was checked out earlier as a nested working copy
          # (its own .git) purely so the implementer could read prompts/
          # config - it must never end up in the implementer's own commit.
          # `git add -A` from the repo root treats a nested .git as a gitlink
          # (implicit submodule reference with no .gitmodules entry), which
          # is exactly what happened on karsift-ai-infra-smoke-test's first
          # real run: the reviewer correctly caught it as a Critical,
          # out-of-scope, repo-integrity-breaking finding and failed the PR.
          # Removing the directory before staging is more robust than a
          # pathspec exclusion on git add - it can't regress if someone later
          # adds another `git add` call downstream.
          rm -rf karsift-ai-infra

          git add -A
          if git diff --cached --quiet; then
            echo "Implementer made no changes - nothing to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "${{ inputs.change_id }}: ${{ inputs.task_id }} (attempt ${{ inputs.attempt }})"
            # --force-with-lease: on attempt 1 the remote branch doesn't
            # exist yet, so this behaves like a normal push. On a
            # remediation attempt (attempt > 1), the branch already exists
            # from the previous try and this run started from a fresh
            # checkout of integration_branch rather than that old branch -
            # force-updating replaces the previous (reviewed, failed)
            # revision with the corrected one instead of trying to merge
            # them, which is the outcome we actually want.
            #
            # --force-with-lease refuses to push unless the local repo's
            # own record of the remote branch's tip matches reality - and
            # this checkout never fetched that branch (it started fresh
            # from integration_branch), so on vocanova-platform-sandbox's
            # first live remediation attempt that record didn't exist at
            # all and the push was rejected outright as "stale info," even
            # though the implementer itself had succeeded. Fetching the
            # branch first (a no-op, exit-0 on attempt 1 when it doesn't
            # exist yet) gives the lease a real baseline to compare against.
            git fetch origin "${{ steps.branch.outputs.branch }}" 2>/dev/null || true
            git push --force-with-lease -u origin "${{ steps.branch.outputs.branch }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # `secrets` isn't a recognized context inside a step-level `if:` here
      # (GitHub Actions rejects it outright: "Unrecognized named-value:
      # 'secrets'") - route the presence check through a plain env var and
      # a shell step's output instead, which is the reliable pattern.
      - name: Check for GitHub App credentials
        id: has-app
        env:
          APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
        run: echo "configured=$([ -n \"$APP_ID\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # PRs created with the default GITHUB_TOKEN land their own resulting
      # pull_request-triggered workflow runs in "action_required" - GitHub
      # requires a manual "Approve workflows to run" click every time,
      # regardless of same-repo or fork (see this file's secrets: block
      # above for why). Minting a short-lived GitHub App installation token
      # instead avoids that entirely. Optional and backward-compatible: a
      # project with no App configured falls straight through to
      # github.token, unchanged from before.
      - name: Mint App installation token for PR creation
        id: app-token
        if: steps.commit.outputs.has_changes == 'true' && steps.has-app.outputs.configured == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

      # On a remediation attempt, the force-push above already updated the
      # existing PR (pushing new commits to a PR's head branch updates it
      # automatically - GitHub doesn't need a second `gh pr create` call,
      # and that call would just fail with "already exists"). Check first
      # and only create when there's genuinely no PR yet.
      - name: Open or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "${{ steps.branch.outputs.branch }}" --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          body="$(cat <<EOF
          Implements task \`${{ inputs.task_id }}\` from \`${{ inputs.change_id }}\` (\`${{ inputs.package_path }}\`).

          Closes #${{ inputs.issue_number }}.

          Implemented by the implementer role (attempt ${{ inputs.attempt }} of 2,
          model resolved from karsift-ai-infra/config/roles.yml). Independent review
          and required human approval are still pending - this PR is not authorized
          to merge on its own.

          Risk classification: ${{ steps.package.outputs.risk }}

          Package path: \`${{ inputs.package_path }}\`
          EOF
          )"

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            # The body's "attempt N of 2" text is remediate.yml's only
            # source for the current attempt number - a comment-only update
            # left it permanently reading "attempt 1 of 2" from PR
            # creation, forever. remediate.yml then always recomputed
            # next_attempt as 1+1=2, no matter how many retries had
            # actually happened: the two-attempt cap was never real, and a
            # PR whose review kept failing for reasons unrelated to content
            # (e.g. a scope mismatch between the PR's stated task and what
            # attempt 2 actually delivered) could retry indefinitely.
            # Discovered on VOC-013-T00's real remediation run: a second
            # retry fired after the cap should have been hit. Editing the
            # body on every update, not just commenting, keeps this the
            # single source of truth remediate.yml already trusts it to be.
            gh pr edit "$existing" --body "$body"
            gh pr comment "$existing" --body "Pushed attempt ${{ inputs.attempt }} of 2 - see the commit above for what changed in response to the previous review."
            exit 0
          fi

          gh pr create \
            --base "${{ inputs.integration_branch }}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "${{ inputs.change_id }}: ${{ inputs.task_id }}" \
            --body "$body"

      - name: Escalate on final failed attempt
        if: (steps.implementer.outcome == 'failure' || steps.commit.outputs.has_changes == 'false') && inputs.attempt >= '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ inputs.issue_number }} --body \
            "The implementer failed to produce a change on attempt ${{ inputs.attempt }}/2 for task \`${{ inputs.task_id }}\` in \`${{ inputs.change_id }}\`. Stopping - not retrying automatically. A human needs to look at this task."

      - name: Fail job if implementer step failed
        if: steps.implementer.outcome == 'failure'
        run: exit 1
