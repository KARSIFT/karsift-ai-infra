name: remediate (reusable)

# Closes the loop that used to require a human to notice: when the reviewer
# returns FAIL, OR when CI itself fails outright (before review ever runs -
# review needs a green CI to even start, see pipeline.yml's `review` job),
# this automatically re-dispatches the implementer once, with the failure
# details included as required reading, then - if that retry also fails -
# stops and escalates to the authority issue instead of trying a third time.
# Two attempts total, same cap implement.yml already enforced for its own
# internal failures. A reviewer-infrastructure error is deliberately different:
# it records bounded metadata and does not spend an implementation attempt,
# because no code finding exists for an implementer to repair.
#
# The CI-failure path was added 2026-07-24 after finding it live: a plain CI
# failure (a formatting slip, a cross-package module-resolution gap) left a
# PR permanently stuck with no automatic retry, because review.yml never ran
# to produce a verdict for this job to react to - the pre-existing FAIL-only
# design had a blind spot for exactly the failure mode most likely on a
# vendor swap's first real runs (gpt-5.3-codex's first two implement
# attempts on VOC-018-T02 both needed a human to notice and push a fix by
# hand). Requires pipeline.yml's `remediate` job to itself run on a CI
# failure now (see that file), passing `ci_failed` through as an input.
#
# A PASS, PASS WITH NON-BLOCKING FINDINGS, an exact-SHA operator-live-evidence
# waiting verdict, or no verdict yet (review hasn't posted, and CI didn't fail
# either) is still a no-op. Waiting is deliberately distinct from a code-defect
# FAIL so it cannot consume the one implementation retry.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      package_path:
        description: 'Path to the change package directory, e.g. "specs/changes/VOC-007-some-slug"'
        required: true
        type: string
      integration_branch:
        required: false
        type: string
        default: "develop"
      ci_failed:
        description: "Whether the ci job on this PR failed outright (pipeline.yml passes needs.ci.result == 'failure')."
        required: false
        type: string
        default: "false"
      review_job_failed:
        description: "Whether the review job itself errored before posting any verdict (pipeline.yml passes needs.review.result == 'failure'). Distinct from a genuine posted FAIL verdict - see decide step's comment for why this needs its own signal."
        required: false
        type: string
        default: "false"
      expected_head_sha:
        description: "PR head SHA that produced the caller pipeline run. A different live head makes this remediation decision stale."
        required: false
        type: string
        default: ""
      expected_base_sha:
        description: "PR base SHA from the same caller run. A different live base makes review evidence and remediation stale."
        required: false
        type: string
        default: ""
    secrets:
      KARSIFT_BOT_APP_ID:
        required: false
      KARSIFT_BOT_PRIVATE_KEY:
        required: false

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    outputs:
      should_retry: ${{ steps.parse.outputs.should_retry }}
      change_id: ${{ steps.parse.outputs.change_id }}
      task_id: ${{ steps.parse.outputs.task_id }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      next_attempt: ${{ steps.parse.outputs.next_attempt }}
      waiting_for_operator_live_evidence: ${{ steps.parse.outputs.waiting_for_operator_live_evidence }}
      review_infrastructure_failure: ${{ steps.parse.outputs.review_infrastructure_failure }}
      stale_run: ${{ steps.parse.outputs.stale_run }}
      operator_escalation: ${{ steps.parse.outputs.operator_escalation }}
      ownership_state: ${{ steps.parse.outputs.ownership_state }}
      ownership_reason: ${{ steps.parse.outputs.ownership_reason }}
    steps:
      - name: Checkout karsift-ai-infra policy helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra
          persist-credentials: false

      - name: Checkout caller repository at the remediation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_head_sha }}
          path: caller
          persist-credentials: false
          fetch-depth: 1

      # The PR body's exact wording is implement.yml's own template (see
      # "Open PR" there) - this parses it back out. Both files must stay in
      # sync; this is the one place outside implement.yml that depends on
      # that exact format.
      - name: Parse verdict, attempt, and package identity from the PR
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_REPO: ${{ github.repository }}
          CI_FAILED: ${{ inputs.ci_failed }}
          REVIEW_JOB_FAILED: ${{ inputs.review_job_failed }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: |
          set -euo pipefail

          # `gh pr view` / `gh issue comment` are porcelain commands that
          # normally infer the target repo from a local git remote - this
          # job never checks one out, so without GH_REPO set explicitly
          # (env var `gh` respects for exactly this case) they fail with
          # "not a git repository", not an auth or permissions error. Found
          # via karsift-ai-infra-smoke-test PR #7: a genuine PASS verdict
          # should have been a silent no-op here and instead errored the job.
          pr_json=$(gh pr view "$PR_NUMBER" --json body,headRefOid,baseRefOid)
          body=$(echo "$pr_json" | jq -r .body)
          head_sha=$(echo "$pr_json" | jq -r .headRefOid)
          base_sha=$(echo "$pr_json" | jq -r .baseRefOid)

          head_state=$(python3 karsift-ai-infra/config/verify-expected-head.py \
            --expected-sha "$EXPECTED_HEAD_SHA" \
            --current-sha "$head_sha")
          if [ "$head_state" != "CURRENT" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "waiting_for_operator_live_evidence=false" >> "$GITHUB_OUTPUT"
            echo "review_infrastructure_failure=false" >> "$GITHUB_OUTPUT"
            echo "stale_run=true" >> "$GITHUB_OUTPUT"
            echo "operator_escalation=false" >> "$GITHUB_OUTPUT"
            echo "ownership_state=" >> "$GITHUB_OUTPUT"
            echo "ownership_reason=" >> "$GITHUB_OUTPUT"
            echo "Exact-head precondition is $head_state; refusing remediation."
            exit 0
          fi
          if ! [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [ "$base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "waiting_for_operator_live_evidence=false" >> "$GITHUB_OUTPUT"
            echo "review_infrastructure_failure=false" >> "$GITHUB_OUTPUT"
            echo "stale_run=true" >> "$GITHUB_OUTPUT"
            echo "operator_escalation=false" >> "$GITHUB_OUTPUT"
            echo "ownership_state=" >> "$GITHUB_OUTPUT"
            echo "ownership_reason=" >> "$GITHUB_OUTPUT"
            echo "Exact-base precondition is stale or invalid; refusing remediation."
            exit 0
          fi

          task_id=$(echo "$body" | grep -oP '(?<=Implements task `)[^`]+' | head -1 || echo "")
          change_id=$(echo "$body" | grep -oP '(?<=from `)[^`]+(?=` \()' | head -1 || echo "")
          issue_number=$(echo "$body" | grep -oP '(?<=Closes #)[0-9]+' | head -1 || echo "")
          mapfile -t package_paths < <(printf '%s\n' "$body" | grep -oP '(?<=Package path: `)[^`]+' || true)
          attempt=$(echo "$body" | grep -oP '(?<=attempt )[0-9]+(?= of 2)' | head -1 || echo "1")

          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "waiting_for_operator_live_evidence=false" >> "$GITHUB_OUTPUT"
          echo "review_infrastructure_failure=false" >> "$GITHUB_OUTPUT"
          echo "stale_run=false" >> "$GITHUB_OUTPUT"
          echo "operator_escalation=false" >> "$GITHUB_OUTPUT"

          # CI/review-job failure inputs belong to the caller run's head, not
          # whichever head happens to be live when this reusable job starts.
          # A superseded run must never remediate a newer revision.
          initial_decision=$(python3 karsift-ai-infra/config/decide-remediation.py \
            --expected-sha "$EXPECTED_HEAD_SHA" \
            --current-sha "$head_sha" \
            --review-state PENDING \
            --ci-failed "$CI_FAILED" \
            --review-job-failed "$REVIEW_JOB_FAILED" \
            --ownership-state ORDINARY)
          if [ "$initial_decision" = "STALE" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "stale_run=true" >> "$GITHUB_OUTPUT"
            echo "Caller pipeline SHA $EXPECTED_HEAD_SHA is stale; live PR head is $head_sha. Refusing remediation."
            exit 0
          fi

          # Classify task ownership from this run's immutable caller checkout.
          # The machine-readable live-evidence contract is authoritative; the
          # exact task-stanza marker is only a structural secondary signal.
          # Missing, malformed, conflicting, or unreadable metadata fails
          # closed and can never authorize an implementer retry.
          ownership_state="FAIL_CLOSED"
          ownership_reason="invalid_remediation_identity"
          if [ "${#package_paths[@]}" -eq 1 ] && [ "${package_paths[0]}" = "$PACKAGE_PATH" ] &&
             [[ "$task_id" =~ ^[A-Z][A-Z0-9]+-[0-9]+-T[0-9]+[a-z]?$ ]] &&
             [[ "$change_id" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] &&
             [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            ownership_json=$(python3 karsift-ai-infra/config/remediation-ownership.py \
              --repository-root caller \
              --package-path "$PACKAGE_PATH" \
              --task-id "$task_id")
            ownership_state=$(jq -r .state <<<"$ownership_json")
            ownership_reason=$(jq -r .reason <<<"$ownership_json")
          fi
          case "$ownership_state" in
            ORDINARY|OPERATOR|FAIL_CLOSED) ;;
            *) ownership_state="FAIL_CLOSED"; ownership_reason="invalid_classifier_output" ;;
          esac
          [[ "$ownership_reason" =~ ^[a-z0-9_]+$ ]] || ownership_reason="invalid_classifier_reason"
          echo "ownership_state=$ownership_state" >> "$GITHUB_OUTPUT"
          echo "ownership_reason=$ownership_reason" >> "$GITHUB_OUTPUT"
          # Only a review explicitly bound to this run's current PR head can
          # drive a lifecycle decision. Earlier-head comments are ignored.
          verdict=""
          if [ "${#package_paths[@]}" -eq 1 ] && [ "${package_paths[0]}" = "$PACKAGE_PATH" ] &&
             [[ "$task_id" =~ ^[A-Z][A-Z0-9]+-[0-9]+-T[0-9]+$ ]] &&
             [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            review_header="**Independent verification - bound to commit \`$head_sha\`**"
            task_line="task_id: \`$task_id\`"
            package_line="package_path: \`$PACKAGE_PATH\`"
            issue_line="authority_issue: \`$issue_number\`"
            base_line="base_sha: \`$base_sha\`"
            verdict=$(gh api --paginate --slurp \
              "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
              | jq -r \
                --arg header "$review_header" \
                --arg task "$task_line" \
                --arg package "$package_line" \
                --arg issue "$issue_line" \
                --arg base "$base_line" \
                '[.[][] | select(
                  .user.login == "karsift-ai-infra-bot[bot]" and
                  .user.type == "Bot" and
                  (.body | startswith($header)) and
                  ((.body | split("\n") | index($header)) != null) and
                  ((.body | split("\n") | index($task)) != null) and
                  ((.body | split("\n") | index($package)) != null) and
                  ((.body | split("\n") | index($issue)) != null)
                  and ((.body | split("\n") | index($base)) != null)
                )] | sort_by(.created_at, .id) | last | .body // ""')
          fi
          printf '%s\n' "$verdict" > /tmp/review-verdict.md
          review_state=$(python3 karsift-ai-infra/config/classify-review-verdict.py /tmp/review-verdict.md)
          decision=$(python3 karsift-ai-infra/config/decide-remediation.py \
            --expected-sha "$EXPECTED_HEAD_SHA" \
            --current-sha "$head_sha" \
            --review-state "$review_state" \
            --ci-failed "$CI_FAILED" \
            --review-job-failed "$REVIEW_JOB_FAILED" \
            --ownership-state "$ownership_state")

          if [ "$decision" = "REVIEW_INFRA_FAILURE" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "review_infrastructure_failure=true" >> "$GITHUB_OUTPUT"
            echo "The reviewer infrastructure failed before producing a code verdict; recording metadata without dispatching the implementer."
            exit 0
          fi

          # The shared classifier tolerates historical markdown decoration,
          # makes any machine-readable FAIL dominant over WAITING, and keeps
          # both merge/remediation parsing identical. The decision helper then
          # gives current-SHA CI failures precedence over waiting while stale
          # runs remain absolute no-ops. Reviewer-infrastructure failures were
          # handled above without consuming an implementation attempt.
          if [ "$decision" = "WAITING" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "waiting_for_operator_live_evidence=true" >> "$GITHUB_OUTPUT"
            echo "Current exact-SHA review is waiting for operator-owned live evidence - implementation remediation is intentionally suppressed."
            exit 0
          fi

          # PASS/PASS_WITH_FINDINGS/PENDING are no-ops when CI and the review
          # job itself are healthy. Reviewer-infrastructure errors were
          # separated above because they are not actionable code findings.
          if [ "$decision" = "NOOP" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "No FAIL verdict or waiting state, CI did not fail, and the review job itself did not error - nothing to remediate."
            exit 0
          fi

          if [ "$decision" = "ESCALATE_OPERATOR" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "operator_escalation=true" >> "$GITHUB_OUTPUT"
            echo "A retry signal exists, but ownership is $ownership_state; escalating without dispatching the general implementer."
            exit 0
          fi

          if [ "$decision" != "RETRY" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "Unexpected remediation decision '$decision' - refusing to dispatch." >&2
            exit 0
          fi

          if [ -z "$task_id" ] || [ -z "$change_id" ] || [ -z "$issue_number" ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            echo "A retry condition is present but task_id/change_id/issue_number could not be parsed from the PR body - refusing to guess, leaving this for a human." >&2
            exit 0
          fi

          next_attempt=$((attempt + 1))

          if [ "$next_attempt" -gt 2 ]; then
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "next_attempt=" >> "$GITHUB_OUTPUT"
            reason="was reviewed and failed"
            [ "$CI_FAILED" = "true" ] && reason="failed CI"
            gh issue comment "$issue_number" --body \
              "Attempt $attempt of 2 $reason. Stopping - not retrying automatically. A human needs to look at task \`$task_id\` in \`$change_id\` (PR #$PR_NUMBER)."
            exit 0
          fi

          echo "should_retry=true" >> "$GITHUB_OUTPUT"
          echo "next_attempt=$next_attempt" >> "$GITHUB_OUTPUT"
          if [ "$CI_FAILED" = "true" ]; then
            echo "CI failed on attempt $attempt - will retry as attempt $next_attempt."
          else
            echo "FAIL verdict on attempt $attempt - will retry as attempt $next_attempt."
          fi

      - name: Publish sanitized operator-ownership escalation
        if: steps.parse.outputs.operator_escalation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          TASK_ID: ${{ steps.parse.outputs.task_id }}
          CHANGE_ID: ${{ steps.parse.outputs.change_id }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          PACKAGE_PATH: ${{ inputs.package_path }}
          OWNERSHIP_STATE: ${{ steps.parse.outputs.ownership_state }}
          OWNERSHIP_REASON: ${{ steps.parse.outputs.ownership_reason }}
          CI_FAILED: ${{ inputs.ci_failed }}
        run: |
          set -euo pipefail
          live_pair=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,state)
          if [ "$(jq -r .state <<<"$live_pair")" != "OPEN" ] ||
             [ "$(jq -r .headRefOid <<<"$live_pair")" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$(jq -r .baseRefOid <<<"$live_pair")" != "$EXPECTED_BASE_SHA" ]; then
            echo "PR base/head pair changed before ownership escalation; suppressing stale publication."
            exit 0
          fi

          target="$PR_NUMBER"
          [[ "$TASK_ID" =~ ^[A-Za-z][A-Za-z0-9]*-[0-9]+-T[0-9]+[a-z]?$ ]] || TASK_ID="unavailable"
          [[ "$CHANGE_ID" =~ ^[A-Za-z][A-Za-z0-9]*-[0-9]+$ ]] || CHANGE_ID="unavailable"
          case "$OWNERSHIP_STATE" in OPERATOR|FAIL_CLOSED) ;; *) OWNERSHIP_STATE="FAIL_CLOSED" ;; esac
          [[ "$OWNERSHIP_REASON" =~ ^[a-z0-9_]+$ ]] || OWNERSHIP_REASON="invalid_classifier_reason"
          trigger="review_fail"
          [ "$CI_FAILED" = "true" ] && trigger="ci_failure"
          marker="<!-- remediation-ownership-escalation task=$TASK_ID head=$EXPECTED_HEAD_SHA -->"
          prefix="VOC-106: Remediation operator escalation for \`$TASK_ID\`"
          existing=$(gh api --paginate --slurp "repos/$GH_REPO/issues/$target/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[][] | select(.body | contains($marker))] | length')
          if [ "$existing" -gt 0 ]; then
            echo "An escalation for this exact task/head already exists; not duplicating it."
            exit 0
          fi
          {
            echo "$marker"
            echo "$prefix"
            echo
            echo "A current exact-SHA remediation signal was suppressed because this task is operator-owned or its ownership metadata failed closed. No general implementer was dispatched and no implementation attempt was consumed."
            echo
            echo "should_retry: \`false\`"
            echo "- change_id: \`$CHANGE_ID\`"
            echo "- task_id: \`$TASK_ID\`"
            echo "- package_path: \`$PACKAGE_PATH\`"
            echo "- pr_number: \`$PR_NUMBER\`"
            echo "- run_id: \`$GITHUB_RUN_ID\`"
            echo "- pull_request: \`#$PR_NUMBER\`"
            echo "- head_sha: \`$EXPECTED_HEAD_SHA\`"
            echo "- base_sha: \`$EXPECTED_BASE_SHA\`"
            echo "- trigger: \`$trigger\`"
            echo "- ownership_state: \`$OWNERSHIP_STATE\`"
            echo "- reason_code: \`$OWNERSHIP_REASON\`"
            echo
            echo "This record contains no raw logs, model output, OAuth data, environment values, user identifiers, or credentials. Continue through the repository-controlled operator/reconciliation path."
          } > /tmp/operator-escalation.md
          gh issue comment "$target" --body-file /tmp/operator-escalation.md

      # CI can fail before review produces a signed verdict. Record only the
      # immutable identifiers needed to audit that retry. Raw job logs are not
      # a safe transport: they may contain terminal sequences, arbitrary test
      # data, or values GitHub did not recognize as secrets. The implementer
      # receives a deterministic "reproduce repository checks" instruction
      # directly from implement.yml when no trusted review record exists.
      - name: Record sanitized CI failure metadata without log replay
        if: inputs.ci_failed == 'true' && steps.parse.outputs.next_attempt != ''
        continue-on-error: true
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          sanitized_run_id="$GITHUB_RUN_ID"
          [[ "$sanitized_run_id" =~ ^[1-9][0-9]*$ ]] || sanitized_run_id="unavailable"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || EXPECTED_HEAD_SHA="unavailable"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || EXPECTED_BASE_SHA="unavailable"
          {
            echo "### Sanitized CI remediation metadata"
            echo
            echo "run_id: \`$sanitized_run_id\`"
            echo "head_sha: \`$EXPECTED_HEAD_SHA\`"
            echo "base_sha: \`$EXPECTED_BASE_SHA\`"
            echo "job_name: \`ci / ci\`"
            echo "conclusion: \`failure\`"
            echo
            echo "No raw logs, artifacts, step output, environment values, or credentials"
            echo "were fetched or replayed. The bounded retry must reproduce the failure"
            echo "with repository-controlled validation commands."
          } >> "$GITHUB_STEP_SUMMARY"

      # A reviewer-infrastructure failure is not a code finding. Record only
      # bounded Actions metadata so the retry has a machine-readable reason
      # without copying model output, prompts, terminal sequences, arbitrary
      # logs, environment values, or credentials into a PR comment.
      - name: Record sanitized review-job-error metadata without implementation retry
        if: inputs.review_job_failed == 'true' && steps.parse.outputs.review_infrastructure_failure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail

          review_job=$(gh run view "$GITHUB_RUN_ID" --json jobs -q \
            '[.jobs[] | select((.name == "review / publish-review" or .name == "review / review") and .conclusion == "failure")][0] // {}')
          review_job_id=$(jq -r '.databaseId // "unavailable"' <<<"$review_job")
          review_job_name=$(jq -r '.name // "unavailable"' <<<"$review_job")
          review_job_conclusion=$(jq -r '.conclusion // "failure"' <<<"$review_job")

          sanitized_run_id="$GITHUB_RUN_ID"
          [[ "$sanitized_run_id" =~ ^[1-9][0-9]*$ ]] || sanitized_run_id="unavailable"
          [[ "$review_job_id" =~ ^[1-9][0-9]*$ ]] || review_job_id="unavailable"
          case "$review_job_name" in
            "review / review"|"review / publish-review") ;;
            *) review_job_name="unavailable" ;;
          esac
          case "$review_job_conclusion" in
            failure|cancelled|timed_out) ;;
            *) review_job_conclusion="failure" ;;
          esac

          {
            echo "**Independent verification - review job error, not a reviewer verdict**"
            echo
            echo "The review job itself errored before producing any verdict (e.g. a"
            echo "transient failure in the reviewer's own tooling, not a finding about"
            echo "this PR's code). The diagnostic is intentionally metadata-only:"
            echo
            echo "head_sha: \`$EXPECTED_HEAD_SHA\`"
            echo "base_sha: \`$EXPECTED_BASE_SHA\`"
            echo "run_id: \`$sanitized_run_id\`"
            echo "job_id: \`$review_job_id\`"
            echo "job_name: \`$review_job_name\`"
            echo "conclusion: \`$review_job_conclusion\`"
            echo
            echo "No raw logs, model output, prompts, environment values, or credentials"
            echo "were copied into this comment. Inspect the Actions run through the"
            echo "repository-controlled operator path if deeper diagnosis is required."
          } > /tmp/review-failure-comment.md

          # Recheck immediately before the mutation, after all diagnostic
          # discovery and body construction, so an older run cannot annotate
          # a replacement revision during a synchronize/cancellation race.
          live_pair=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,state)
          if [ "$(jq -r .state <<<"$live_pair")" != "OPEN" ] ||
             [ "$(jq -r .headRefOid <<<"$live_pair")" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$(jq -r .baseRefOid <<<"$live_pair")" != "$EXPECTED_BASE_SHA" ]; then
            echo "PR base/head pair changed before reviewer-infrastructure metadata publication; suppressing stale comment."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file /tmp/review-failure-comment.md

  retry:
    needs: decide
    if: needs.decide.outputs.should_retry == 'true'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/implement.yml@main
    with:
      change_id: ${{ needs.decide.outputs.change_id }}
      package_path: ${{ inputs.package_path }}
