name: auto-advance (reusable)

# Closes the "who dispatches the next task" gap the founder-gate workflow
# was doing by hand until now (2026-07-25): once a package is ADOPTED, a
# human/founder already authorized its whole task roster in one decision at
# adoption time (see adopt.yml) - so routine task-to-task progression
# through that already-authorized roster is not a second decision point.
# The two decisions that still need a human are package adoption (merging
# the plan/ PR) and release promotion (release.yml's "Release: <id>" issue,
# unaffected by this file) - this workflow only fills the gap in between:
# when a task's tracking issue closes (normally via its PR merging), find
# the next task_id in `<package_path>/.karsift/tasks.json` and either dispatch
# implement.yml for an ordinary next task or prepare a deterministic
# operator-owned live-evidence carrier without starting the implementer
# (VOC-102).
#
# Deliberately conservative about when it fires - a wrongly-triggered
# duplicate dispatch is a worse failure mode than staying silent:
#   - No-ops on any issue whose title isn't "<CHANGE-ID>: ..." (mirrors
#     release.yml's own check-completion guard).
#   - No-ops if there's no next task (release.yml's check-completion job
#     handles that case - opening the release-approval issue instead).
#   - No-ops if the next task's issue is already closed (already done or
#     already in flight).
#   - For ordinary next tasks only: no-ops if a PR already exists on the
#     deterministic agent/<change>-<slug> branch (avoids double-dispatch).
#   - Operator-owned / live-actions next tasks re-enter the clean carrier
#     publisher instead of treating an existing PR as a global early return.

on:
  workflow_call:
    inputs:
      integration_branch:
        description: 'The calling project''s integration branch, e.g. "develop".'
        required: false
        type: string
        default: "develop"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_SECOND_API_KEY:
        required: false
      KARSIFT_BOT_APP_ID:
        required: false
      KARSIFT_BOT_PRIVATE_KEY:
        required: false

jobs:
  advance:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
      contents: read
    outputs:
      decision: ${{ steps.next.outputs.decision }}
      reason: ${{ steps.next.outputs.reason }}
      should_dispatch: ${{ steps.next.outputs.should_dispatch }}
      change_id: ${{ steps.next.outputs.change_id }}
      package_path: ${{ steps.next.outputs.package_path }}
      task_id: ${{ steps.next.outputs.task_id }}
      issue_number: ${{ steps.next.outputs.issue_number }}
      evidence_relative_path: ${{ steps.next.outputs.evidence_relative_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.integration_branch }}

      - name: Checkout shared auto-advance policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      # Same identify pattern as release.yml's check-completion job (title
      # prefix -> package directory glob -> roster file), reused verbatim
      # for consistency - plus the closed issue's own task_id, parsed from
      # the same "<change_id>: <task_id> - <title>" convention plan.yml
      # uses when opening these issues.
      - name: Determine next task, if any
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PYTHONPATH: karsift-ai-infra/config
        run: |
          set -euo pipefail
          echo "decision=none" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"
          echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          echo "evidence_relative_path=" >> "$GITHUB_OUTPUT"

          change_id=$(echo "$ISSUE_TITLE" | grep -oP '^[A-Za-z][A-Za-z0-9]*-\d+(?=:)' || true)
          closed_task_id=$(echo "$ISSUE_TITLE" | grep -oP '(?<=: )[A-Za-z0-9]+-\d+-T\d+[a-z]?' || true)
          if [ -z "$change_id" ] || [ -z "$closed_task_id" ]; then
            echo "Closed issue title doesn't match '<CHANGE-ID>: <TASK-ID> - ...' - not a tracked task issue, nothing to do."
            exit 0
          fi

          package_path=$(find specs/changes -maxdepth 1 -mindepth 1 -type d -name "${change_id}-*" | head -1 || true)
          if [ -z "$package_path" ]; then
            echo "No package directory found for $change_id under specs/changes/ on ${{ inputs.integration_branch }} - nothing to do."
            exit 0
          fi

          roster="$package_path/.karsift/tasks.json"
          if [ ! -f "$roster" ]; then
            echo "$package_path has no .karsift/tasks.json - nothing to do."
            exit 0
          fi

          next=$(python3 - "$roster" "$closed_task_id" <<'PYEOF'
          import json
          import sys

          roster_path, closed = sys.argv[1:3]
          roster = json.load(open(roster_path))
          ids = [t["task_id"] for t in roster]
          if closed not in ids:
              print("")
          else:
              i = ids.index(closed)
              if i + 1 < len(roster):
                  nxt = roster[i + 1]
                  print(f'{nxt["task_id"]}\t{nxt["issue"]}')
              else:
                  print("")
          PYEOF
          )
          if [ -z "$next" ]; then
            echo "No next task after $closed_task_id in $roster (last task, or not found in roster) - nothing to do; release.yml's check-completion handles the last-task case."
            exit 0
          fi

          next_task_id=$(echo "$next" | cut -f1)
          next_issue=$(echo "$next" | cut -f2)

          next_state=$(gh issue view "$next_issue" --json state -q .state)
          if [ "$next_state" != "OPEN" ]; then
            echo "Next task's issue #$next_issue is already $next_state - not redispatching."
            exit 0
          fi

          python3 karsift-ai-infra/config/auto-advance-classifier.py \
            --package-path "$package_path" \
            --next-task-id "$next_task_id" \
            --change-id "$change_id" \
            --issue-number "$next_issue"

          decision=$(grep '^decision=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          if [ "$decision" = "implement" ]; then
            slug=$(echo "$next_task_id" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
            change_lower=$(echo "$change_id" | tr '[:upper:]' '[:lower:]')
            branch="agent/${change_lower}-${slug}"
            existing_pr=$(gh pr list --head "$branch" --state all --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -n "$existing_pr" ]; then
              echo "Branch $branch already has PR #$existing_pr - not redispatching."
              {
                echo "decision=none"
                echo "should_dispatch=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

  prepare-live-evidence:
    needs: advance
    if: needs.advance.outputs.decision == 'prepare-live-evidence'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout shared auto-advance policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Mint separate operator token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Publish deterministic live-evidence carrier
        env:
          KARSIFT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: karsift-ai-infra/config
        run: |
          set -euo pipefail
          python3 karsift-ai-infra/config/auto-advance-carrier-publisher.py \
            --integration-branch "${{ inputs.integration_branch }}" \
            --change-id "${{ needs.advance.outputs.change_id }}" \
            --package-path "${{ needs.advance.outputs.package_path }}" \
            --task-id "${{ needs.advance.outputs.task_id }}" \
            --issue-number "${{ needs.advance.outputs.issue_number }}" \
            --evidence-relative-path "${{ needs.advance.outputs.evidence_relative_path }}"

  fail-closed:
    needs: advance
    if: needs.advance.outputs.decision == 'fail-closed'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Checkout shared auto-advance policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Mint separate operator token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Post sanitized fail-closed marker
        env:
          KARSIFT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: karsift-ai-infra/config
        run: |
          set -euo pipefail
          python3 karsift-ai-infra/config/auto-advance-fail-closed.py \
            --task-id "${{ needs.advance.outputs.task_id }}" \
            --issue-number "${{ needs.advance.outputs.issue_number }}" \
            --reason "${{ needs.advance.outputs.reason }}"

  implement:
    needs: advance
    if: needs.advance.outputs.should_dispatch == 'true'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/implement.yml@main
    with:
      change_id: ${{ needs.advance.outputs.change_id }}
      package_path: ${{ needs.advance.outputs.package_path }}
      task_id: ${{ needs.advance.outputs.task_id }}
      issue_number: ${{ needs.advance.outputs.issue_number }}
      attempt: "1"
      integration_branch: ${{ inputs.integration_branch }}
    secrets: inherit
