name: plan-review (reusable)

# Runs the "plan_reviewer" role: independent, read-only verification of a DRAFT
# change package proposal (a "plan/"-branch PR opened by plan.yml or
# plan-from-issue), before a human adopts it. Closes the gap where plan PRs
# previously got no independent verification at all - review.yml's "review"
# job only ever ran on "agent/"-branch implementation PRs (see pipeline.yml's
# own job conditions), so a plan PR's verdict stayed permanently PENDING and
# could never satisfy merge-gate.yml's approve-and-merge or auto-merge paths,
# regardless of risk class or automatic_merge_allowed. Every plan PR therefore
# needed a direct manual merge, with no automated safety net checking the
# proposal itself for soundness first. Added 2026-08-14 (founder-requested
# fix: "reviewer should review plan too").
#
# Deliberately a SEPARATE reusable workflow from review.yml, not a mode flag
# on it: review.yml judges a diff against an ALREADY-ADOPTED package (it reads
# change.yaml/specification.md/etc as the source of truth the diff is checked
# against, and scopes to one task_id at a time). A plan PR has no adopted
# package to diff against - the PR's own diff IS the entire proposed package,
# freshly created, all tasks at once. The prompt-building content and what
# "correct" even means are different enough that folding this into review.yml
# would mean threading an is_plan_review flag through most of its steps -
# a second file is more legible than that.
#
# Posts the same "**Independent verification - bound to commit `<sha>`**" ...
# "VERDICT: ..." comment shape review.yml uses, so merge-gate.yml's existing
# verdict-parsing (report-status and approve-and-merge both grep for a
# comment starting with that literal string, then anchor on the VERDICT
# line) picks this up with NO changes needed there. A plan PR that passes
# this review is therefore eligible for the founder's "approved" comment
# to actually merge it, and - if the package's own automatic_merge_allowed
# is true - genuinely auto-merge, the same as any implementation PR. Adoption
# itself remains a separate, later human decision this review does not
# substitute for; a merged plan PR is still just a draft in the tree until a
# human (or founder-delegate) flips its change.yaml to adopted.
#
# Current state (VOC-117, 2026-08-24): the plan reviewer runs through Cursor
# on Grok 4.6 Standard with explicit high effort. See review.yml for the
# shared read-only CLI mechanism; parameterized model preparation must stay
# aligned in both files.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        description: "Immutable PR head SHA from the caller's pull_request event. Plan review refuses a missing, invalid, or superseded revision."
        required: false
        type: string
        default: ""
      expected_base_sha:
        description: "Immutable PR base SHA from the same pull_request event. The reviewed diff is constructed only from this base and expected_head_sha."
        required: false
        type: string
        default: ""
    secrets:
      CURSOR_API_KEY:
        required: true
      KARSIFT_BOT_APP_ID:
        required: true
      KARSIFT_BOT_PRIVATE_KEY:
        required: true

jobs:
  plan-review:
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.pr.outputs.package_path }}
      sha: ${{ steps.pr.outputs.sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch PR diff, metadata, and exact SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
             ! [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Caller omitted or supplied an invalid expected PR base/head SHA; refusing to run plan review." >&2
            exit 1
          fi

          # Confirm the live PR still names the immutable base/head pair from
          # the caller event. The reviewed diff itself is built locally from
          # those commit objects after checkout; it never comes from GitHub's
          # mutable PR-diff endpoint.
          gh pr view "$PR_NUMBER" --json body,title,headRefOid,baseRefOid > /tmp/pr.json
          live_sha=$(jq -r .headRefOid /tmp/pr.json)
          live_base_sha=$(jq -r .baseRefOid /tmp/pr.json)
          if [ "$live_sha" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$live_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Caller pipeline base/head pair is stale; refusing to review a superseded plan revision." >&2
            exit 1
          fi
          echo "sha=$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$EXPECTED_BASE_SHA" >> "$GITHUB_OUTPUT"

          # plan.yml's own "Open pull request" step always writes this exact
          # line into the PR body - same convention adopt.yml's "Locate the
          # adopted package" step already relies on. Fail loudly rather than
          # guess if a PR reaches this job without it (e.g. a plan/-prefixed
          # branch opened by something other than plan.yml).
          package_path=$(jq -r .body /tmp/pr.json | grep -oP '(?<=New package directory: `)[^`]+' | head -1)
          if [ -z "$package_path" ]; then
            echo "::error::No 'New package directory: \`...\`' line in PR #${{ inputs.pr_number }}'s body - not a plan.yml-authored PR, or its format changed. Refusing to guess." >&2
            exit 1
          fi
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"

      # Checks out the PR's own reviewed commit, not the integration branch -
      # same reasoning as review.yml's identical step (see that file's own
      # comment for the live incident this avoids repeating).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build diff from immutable base and head commits
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Checkout did not resolve to the exact expected plan head." >&2
            exit 1
          fi
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          merge_base=$(git merge-base "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA")
          if ! [[ "$merge_base" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve an immutable merge base for plan review." >&2
            exit 1
          fi
          git --no-pager diff --no-ext-diff --no-textconv --find-renames \
            "$merge_base" "$EXPECTED_HEAD_SHA" -- > /tmp/pr.diff

      - name: Checkout karsift-ai-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra
          persist-credentials: false

      - name: Resolve plan_reviewer model
        id: model
        run: |
          set -euo pipefail
          MODEL=$(bash karsift-ai-infra/config/resolve-model.sh plan_reviewer karsift-ai-infra/config/roles.yml)
          python3 karsift-ai-infra/config/prepare_cursor_model.py "$MODEL" >/dev/null
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Build prompt
        run: |
          pkg="${{ steps.pr.outputs.package_path }}"
          {
            cat karsift-ai-infra/prompts/plan-review.md
            echo
            echo "## Reviewed commit SHA: ${{ steps.pr.outputs.sha }}"
            echo
            echo "## Draft package under review: $pkg"
            echo
            echo "### specification.md"
            cat "$pkg/specification.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### tasks.md"
            cat "$pkg/tasks.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### acceptance-criteria.md"
            cat "$pkg/acceptance-criteria.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### impact-analysis.md"
            cat "$pkg/impact-analysis.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### test-plan.md"
            cat "$pkg/test-plan.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### release-plan.md"
            cat "$pkg/release-plan.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### change.yaml"
            cat "$pkg/change.yaml" 2>/dev/null || echo "(missing)"
            echo
            echo "### .karsift/tasks.json (machine-readable task roster/dependencies, if present)"
            cat "$pkg/.karsift/tasks.json" 2>/dev/null || echo "(not yet present - opened at adoption by adopt.yml)"
            echo
            echo "## AGENTS.md automatic_merge_allowed drafting rule (for reference)"
            grep -A 25 '### Drafting `automatic_merge_allowed`' AGENTS.md 2>/dev/null || echo "(AGENTS.md not found or section missing at this commit)"
            echo
            echo "## PR metadata"
            cat /tmp/pr.json
            echo
            echo "## Diff (the entire proposed package - this is a new package, not an addition to an adopted one)"
            cat /tmp/pr.diff
            echo
            echo "## Lessons learned (.karsift/lessons.md, if present)"
            cat .karsift/lessons.md 2>/dev/null || true
          } > /tmp/review-prompt.txt

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! "$HOME/.local/bin/agent" --version >/dev/null 2>&1; then
            echo "::error::Cursor CLI install failed - agent binary not found/working at \$HOME/.local/bin/agent after install. This is usually a transient issue with cursor.com/install itself - rerun the job." >&2
            exit 1
          fi

      - name: Run independent verification
        id: verify
        timeout-minutes: 30
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -uo pipefail
          source karsift-ai-infra/config/retry-helpers.sh
          if ! MODEL=$(python3 karsift-ai-infra/config/prepare_cursor_model.py \
            --require-api-key "${{ steps.model.outputs.model }}"); then
            echo "::error::Plan-review Cursor model preparation failed closed." >&2
            exit 1
          fi
          run_review() {
            if agent -p --trust --mode plan \
              --model "$MODEL" \
              --output-format json \
              < /tmp/review-prompt.txt \
              > /tmp/verdict-response.json 2> /tmp/cursor-stderr.log; then
              :
            else
              agent_rc=$?
              return "$agent_rc"
            fi
            python3 karsift-ai-infra/config/extract-cursor-result.py \
              /tmp/verdict-response.json /tmp/verdict.md
          }
          retry_if_transient /tmp/cursor-stderr.log /tmp/verdict-response.json -- run_review
          exit_code=$?
          exit "$exit_code"

      - name: Build bounded plan-review failure record
        id: failure-record
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/plan-review-failure
          classification_status=0
          python3 karsift-ai-infra/config/extract-cursor-result.py \
            /tmp/verdict-response.json /tmp/verdict.md \
            --github-annotation \
            --failure-record=/tmp/plan-review-failure/failure.json \
            --failure-input=/tmp/cursor-stderr.log || classification_status=$?
          if [ "$classification_status" -ne 75 ] ||
             [ ! -s /tmp/plan-review-failure/failure.json ]; then
            echo "Bounded plan-review failure classification could not be recorded." >&2
            exit 1
          fi

      - name: Upload bounded plan-review failure record
        if: ${{ always() && steps.failure-record.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-review-failure-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
          path: /tmp/plan-review-failure/failure.json
          if-no-files-found: error
          retention-days: 1

      - name: Extract verdict text
        run: |
          python3 karsift-ai-infra/config/extract-cursor-result.py \
            /tmp/verdict-response.json /tmp/verdict.md

      - name: Show verdict
        run: cat /tmp/verdict.md

      - name: Remove model-authored binding lookalikes
        run: |
          python3 karsift-ai-infra/config/normalize-review-narrative.py \
            /tmp/verdict.md /tmp/verdict-narrative.md

      - name: Build verification record for isolated publisher
        run: |
          {
            echo "**Independent verification - bound to commit \`${{ steps.pr.outputs.sha }}\`**"
            echo
            echo "package_path: \`${{ steps.pr.outputs.package_path }}\`"
            echo "base_sha: \`${{ steps.pr.outputs.base_sha }}\`"
            echo "pipeline_run_id: \`${{ github.run_id }}\`"
            echo
            cat /tmp/verdict-narrative.md
          } > /tmp/verdict-comment.md

      - name: Upload verification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-review-verdict-${{ inputs.pr_number }}-${{ steps.pr.outputs.sha }}
          path: /tmp/verdict-comment.md
          retention-days: 1

  publish-plan-review:
    needs: plan-review
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download verification record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: plan-review-verdict-${{ inputs.pr_number }}-${{ needs.plan-review.outputs.sha }}
          path: /tmp/plan-review-publish

      - name: Validate exact plan head and verdict shape
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ needs.plan-review.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ needs.plan-review.outputs.base_sha }}
          EXPECTED_PACKAGE_PATH: ${{ needs.plan-review.outputs.package_path }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
             ! [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Plan-review publication identity is malformed." >&2
            exit 1
          fi
          gh pr view "$PR_NUMBER" --json body,headRefOid,baseRefOid,state > /tmp/live-pr.json
          python3 - /tmp/plan-review-publish/verdict-comment.md /tmp/live-pr.json \
            "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_PACKAGE_PATH" "$EXPECTED_RUN_ID" <<'PYEOF'
          import json
          from pathlib import Path
          import re
          import sys

          verdict_path, pr_path, expected_sha, expected_base, expected_package, expected_run = sys.argv[1:7]
          raw = Path(verdict_path).read_bytes()
          if not raw or len(raw) > 131_072:
              raise SystemExit("Plan verification record is empty or too large.")
          text = raw.decode("utf-8")
          pr = json.loads(Path(pr_path).read_text())
          if (
              pr.get("state") != "OPEN"
              or pr.get("headRefOid") != expected_sha
              or pr.get("baseRefOid") != expected_base
          ):
              raise SystemExit("Plan PR base/head pair changed before verdict publication.")
          packages = re.findall(r"New package directory: `([^`]+)`", pr.get("body") or "")
          if packages != [expected_package]:
              raise SystemExit("Plan package metadata changed or is ambiguous.")
          lines = text.splitlines()
          required = (
              f"**Independent verification - bound to commit `{expected_sha}`**",
              f"package_path: `{expected_package}`",
              f"base_sha: `{expected_base}`",
              f"pipeline_run_id: `{expected_run}`",
          )
          if not lines or lines[0] != required[0] or any(lines.count(line) != 1 for line in required):
              raise SystemExit("Plan verification binding is invalid or ambiguous.")
          verdicts = [
              line for line in lines
              if re.fullmatch(r"VERDICT: (?:FAIL|PASS|PASS WITH NON-BLOCKING FINDINGS)", line)
          ]
          if len(verdicts) != 1 or verdicts[0] != next(
              (line for line in reversed(lines) if line.strip()), ""
          ):
              raise SystemExit("Plan verification must end in one unambiguous verdict.")
          PYEOF

      - name: Mint verdict-signing App token on the clean runner
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # `gh pr comment` uses GraphQL addComment on a PullRequest subject;
          # pull-requests:write covers the PR and its related comments.
          permission-pull-requests: write

      - name: Publish App-signed plan verification comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ needs.plan-review.outputs.sha }}
          EXPECTED_BASE_SHA: ${{ needs.plan-review.outputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          live_pair=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,state)
          if [ "$(jq -r .state <<<"$live_pair")" != "OPEN" ] ||
             [ "$(jq -r .headRefOid <<<"$live_pair")" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$(jq -r .baseRefOid <<<"$live_pair")" != "$EXPECTED_BASE_SHA" ]; then
            echo "Plan PR base/head pair changed immediately before App publication." >&2
            exit 1
          fi
          gh pr comment "$PR_NUMBER" \
            --body-file /tmp/plan-review-publish/verdict-comment.md

  publish-plan-review-failure:
    needs: plan-review
    if: ${{ always() && needs.plan-review.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download bounded plan-review failure record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: plan-review-failure-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
          path: /tmp/plan-review-failure-input

      - name: Checkout exact shared failure-publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KARSIFT/karsift-ai-infra
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Validate exact plan PR identity and bounded failure classification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json state,headRefOid,baseRefOid > /tmp/live-pr.json
          python3 karsift-ai-infra/config/build-review-failure-comment.py \
            plan-reviewer /tmp/live-pr.json \
            /tmp/plan-review-failure-input/failure.json \
            /tmp/plan-review-failure-comment.md "$EXPECTED_HEAD_SHA" \
            "$EXPECTED_BASE_SHA" "${{ github.run_id }}"

      - name: Mint plan-failure-comment App token on the clean runner
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Publish App-signed bounded plan failure comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          live_pair=$(gh pr view "$PR_NUMBER" --json state,headRefOid,baseRefOid)
          if [ "$(jq -r .state <<<"$live_pair")" != "OPEN" ] ||
             [ "$(jq -r .headRefOid <<<"$live_pair")" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$(jq -r .baseRefOid <<<"$live_pair")" != "$EXPECTED_BASE_SHA" ]; then
            echo "Plan PR base/head pair changed immediately before failure publication." >&2
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body-file /tmp/plan-review-failure-comment.md
