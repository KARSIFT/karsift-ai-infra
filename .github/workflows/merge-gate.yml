name: merge-gate (reusable)

# Risk-aware, fail-closed by design. This mirrors the real activation model
# used across KARSIFT projects (see e.g. vocanova-platform's
# docs/governance/amendments/A-003 and its a003-transition-state.yaml):
# governance PERMISSION and technical ACTIVATION are separate states. R0-R4
# can earn autonomous merge once deterministic checks and independent review
# pass. This workflow does not
# invent a project's risk policy - it only reads a risk declaration the PR
# already carries and enforces the gate proportionate to it.
#
# auto_merge_enabled defaults to "false" because that is the real, current,
# evidenced activation state in every KARSIFT project this has been checked
# against as of this writing - not a cautious guess. Flipping it to "true" is
# a deliberate future edit made after real evidence the loop is reliable for
# the risk classes it will actually cover, never a default.

on:
  workflow_call:
    inputs:
      auto_merge_enabled:
        description: 'Master switch for automatic merge at R0-R4 after CI and independent verification pass.'
        required: false
        type: string
        default: "false"
      founder_username:
        description: 'Deprecated compatibility input. Founder comments are not merge authority.'
        required: false
        type: string
        default: ""
    secrets:
      KARSIFT_BOT_APP_ID:
        description: >
          Optional. GitHub App ID used to close a merged PR's linked task
          issue with an identity other than the default GITHUB_TOKEN. Required
          for that close to actually propagate to release.yml's `issues:
          closed` trigger - GitHub does not fire further workflow-triggering
          events for actions performed by the default GITHUB_TOKEN (anti-
          recursion protection; see "Close linked task issue" below for where
          this was found live). Without it, the issue still closes, but
          release.yml's package-completion check never sees it happen.
        required: false
      KARSIFT_BOT_PRIVATE_KEY:
        description: "Optional, paired with KARSIFT_BOT_APP_ID - see that secret's description."
        required: false

jobs:
  # Path 1: on every PR update, report risk class, check status, and what the
  # gate would do. Never merges by itself.
  report-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      # `gh pr checks` reads statusCheckRollup via GraphQL, which needs
      # this scope. Without it the call fails outright ("GraphQL: Resource
      # not accessible by integration"), the `|| echo "false"` fallback in
      # the step below swallows that error silently, and checks_ok is
      # unconditionally "false" regardless of what CI actually did - not a
      # race, not a self-reference issue (an earlier commit on this same
      # file guessed wrong and added an unrelated check-name filter to
      # "fix" a race that was never the real cause; that filter is
      # harmless and left in place, but this permission was necessary, and
      # turned out not sufficient by itself). Found on VOC-012's first real
      # auto-merge attempt: report-status printed checks_ok="false" on
      # every single evaluation, no matter how long CI/review had already
      # been green.
      checks: read
      # `checks: read` alone still wasn't enough: `gh pr checks`'s GraphQL
      # query also resolves each check's `checkSuite.workflowRun`, which is
      # a separate resource needing `actions: read` - without it the same
      # "Resource not accessible by integration" error recurs, just on a
      # narrower field path. Confirmed by re-running VOC-012's PR after
      # adding `checks: read` alone and seeing the identical checks_ok=false
      # outcome with a fully green PR, one permission short.
      actions: read
    outputs:
      risk: ${{ steps.status.outputs.risk }}
      checks_ok: ${{ steps.status.outputs.checks_ok }}
      verdict: ${{ steps.status.outputs.verdict }}
      automatic_merge_allowed: ${{ steps.status.outputs.automatic_merge_allowed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Determine risk class, checks, and verification status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=${{ github.event.pull_request.number }}

          # Fail closed: no parseable declaration means "unknown", and unknown
          # is never auto-mergeable, at any value of auto_merge_enabled.
          pr_json=$(gh pr view "$pr_number" --json body,author)
          body=$(echo "$pr_json" | jq -r '.body')
          pr_author=$(echo "$pr_json" | jq -r '.author.login')
          risk=$(echo "$body" | grep -ioP '^[[:space:]]*Risk classification:[[:space:]]*R[0-4]\b' \
            | grep -oP 'R[0-4]' | head -1 || true)
          if [ -z "$risk" ]; then
            risk="unknown"
          fi
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

          # A package's own change.yaml can carry a top-level
          # `automatic_merge_allowed: false` - a per-package opt-out a human
          # sets when they specifically want this exact package kept out of
          # unattended auto-merge, independent of its risk class (e.g. "R1,
          # but I want eyes on this one"). Found live (VOC-019-T00's
          # independent review) that this field was parsed by nothing: every
          # prior package that set it to false (VOC-016/017/018/019) was
          # still fully eligible for auto-merge, because only the repo-level
          # `auto_merge_enabled` input gated Path 3 below. This only affects
          # the *auto-merge* path - a human's "approved" comment (Path 2)
          # stays valid regardless, same as it already is for R4/unknown.
          # Default "true" (no restriction) when the field is absent or the
          # package_path can't be parsed, so bare doc-only PRs or packages
          # predating this field aren't retroactively blocked.
          package_path=$(echo "$body" | grep -oP '(?<=Package path: `)[^`]+' || true)
          automatic_merge_allowed="true"
          if [ -n "$package_path" ] && [ -f "$package_path/change.yaml" ]; then
            value=$(grep -oP '^automatic_merge_allowed:\s*\K(true|false)' "$package_path/change.yaml" || true)
            if [ "$value" = "false" ]; then
              automatic_merge_allowed="false"
            fi
          fi
          echo "automatic_merge_allowed=$automatic_merge_allowed" >> "$GITHUB_OUTPUT"

          # Excludes this pipeline's own governance checks ("merge-gate / *",
          # "remediate / *") from the checks_ok computation - not just the
          # code checks (ci, review, etc.). This job's own check-run (and,
          # on the auto-merge path, its still-queued downstream siblings
          # merge-gate/auto-merge and remediate/decide+retry, which wait on
          # this job via `needs`) are necessarily non-terminal while this
          # step is running, so including them made checks_ok evaluate to
          # false almost every time on a PR with multiple concurrent
          # merge-gate/remediate jobs in flight - discovered on
          # vocanova-platform-sandbox's first real VOC-012 auto-merge
          # attempt: ci and review had both genuinely passed, but checks_ok
          # was false anyway because this job's own in-progress check (and
          # its queued dependents) were included in the "all checks green"
          # count. The single-job "approved"-comment path mostly avoided
          # this by luck (fewer concurrent jobs, less chance of catching one
          # mid-flight), not by design - it has the identical bug below.
          checks_ok=$(gh pr checks "$pr_number" --json name,state -q \
            '[.[] | select( ((.name|startswith("merge-gate")) or (.name|startswith("remediate"))) | not )] | map(.state) | all(. == "SUCCESS" or . == "SKIPPED")' \
            || echo "false")
          echo "checks_ok=$checks_ok" >> "$GITHUB_OUTPUT"

          # Bot-authored PRs (Dependabot etc.) never get a `review` job run
          # against them - that job is gated to the agent/task-authored
          # pipeline, by design (a version bump has no implementation for a
          # reviewer to verify; CI passing is the verification). Searching
          # for an "**Independent verification" comment that structurally
          # can never exist made every such PR permanently resolve to
          # PENDING, so neither this path nor auto-merge could ever
          # complete for them regardless of how clean CI was or how
          # explicitly a human approved - found live, 2026-08-09,
          # vocanova-platform-sandbox PRs #421-#430. Treat "no review
          # applies because the author is a recognized bot" as distinct
          # from "review hasn't finished yet": CI green is the whole
          # verification for a dependency bump with no code for a human or
          # agent to have written.
          if [ "$pr_author" = "dependabot[bot]" ]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          verdict=$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" \
            --jq '[.[] | select(.body | startswith("**Independent verification"))] | last | .body // ""')

          # A prior '^FAIL' anchor here missed "## Verdict: **FAIL**" - a
          # markdown heading with the bold token on the same line, not
          # alone at line-start (vocanova-platform-sandbox VOC-013-T00's
          # first real FAIL run, discovered the same day remediate.yml hit
          # the identical bug independently). prompts/review.md requires an
          # exact, undecorated "VERDICT: ..." anchor as the reviewer's
          # literal last line - but a FOURTH occurrence (2026-07-25,
          # VOC-025-T04 PR #76, first real run under the new OpenCode
          # reviewer/deepseek-v4-pro) posted "**VERDICT: FAIL**" - the whole
          # line wrapped in bold, not decoration mixed into a heading - and
          # was read as PENDING instead of FAIL, the same failure mode as
          # before under new dressing. A different model violating the same
          # explicit prompt instruction is exactly the scenario "instruct it
          # away" doesn't reliably survive - see implement.yml's identical
          # lesson about git-commit compliance. A FIFTH occurrence
          # (2026-07-26, VOC-030-T00 PR #134, same reviewer model) posted
          # "**VERDICT: FAIL** — H1 (...) blocks. H2 (...)" - a genuine FAIL
          # with explanatory text trailing the bold-closed token on the same
          # line, which the then-exact `...\*{0,2}$` end-anchor still
          # missed even after tolerating the bold wrapping itself. The
          # end-anchor is now a word boundary instead of end-of-line, so
          # trailing prose after the verdict token no longer defeats the
          # match - the anchor only needs to identify which line carries the
          # verdict token, not consume the entire line. Order still matters:
          # FAIL is checked before either PASS form so a FAIL can never be
          # misread as a pass, and PASS WITH NON-BLOCKING FINDINGS is
          # checked before bare PASS so a findings-verdict line (which bare
          # PASS's prefix would also match) resolves correctly.
          if echo "$verdict" | grep -qE '^\*{0,2}VERDICT:[[:space:]]*FAIL\b'; then
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
          elif echo "$verdict" | grep -qE '^\*{0,2}VERDICT:[[:space:]]*PASS WITH NON-BLOCKING FINDINGS\b'; then
            echo "verdict=PASS_WITH_FINDINGS" >> "$GITHUB_OUTPUT"
          elif echo "$verdict" | grep -qE '^\*{0,2}VERDICT:[[:space:]]*PASS\b'; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
          fi

      - name: Post status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=${{ github.event.pull_request.number }}
          risk="${{ steps.status.outputs.risk }}"
          checks_ok="${{ steps.status.outputs.checks_ok }}"
          verdict="${{ steps.status.outputs.verdict }}"
          automatic_merge_allowed="${{ steps.status.outputs.automatic_merge_allowed }}"

          gates_pass=false
          if [ "$checks_ok" = "true" ] && [ "$verdict" != "FAIL" ] && [ "$verdict" != "PENDING" ]; then
            gates_pass=true
          fi

          if [ "$risk" = "unknown" ]; then
            decision="BLOCKED - no parseable 'Risk classification: R#' line found in the PR body; correct the declaration"
          elif [ "$gates_pass" = "true" ] && [ "${{ inputs.auto_merge_enabled }}" = "true" ]; then
            decision="WOULD AUTO-MERGE ($risk, auto_merge_enabled=true)"
          elif [ "$gates_pass" = "true" ]; then
            decision="BLOCKED - gates pass for $risk but autonomous merge is not technically activated"
          else
            decision="would NOT merge yet (risk=$risk, checks_ok=$checks_ok, verdict=$verdict)"
          fi

          gh pr comment "$pr_number" --body "**merge-gate:** $decision. Founder approval comments are not part of the merge path; failed or missing gates remain fail-closed."

  # Automatic path: auto_merge_enabled=true and report-status already found
  # every non-human gate passing for a parseable R0-R4 declaration. This only runs once a
  # project deliberately flips the switch - it is inert while the switch is
  # false, which is the default and the current real state everywhere.
  auto-merge:
    needs: report-status
    if: |
      github.event_name == 'pull_request' &&
      inputs.auto_merge_enabled == 'true' &&
      needs.report-status.outputs.risk != 'unknown' &&
      needs.report-status.outputs.checks_ok == 'true' &&
      needs.report-status.outputs.verdict != 'FAIL' &&
      needs.report-status.outputs.verdict != 'PENDING'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require GitHub App credentials
        env:
          APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "GitHub App credentials are required for workflow-triggering merges; refusing to merge with github.token." >&2
            exit 1
          fi

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

      # The App token is essential: a merge made with github.token does not
      # emit the pull_request:closed event that starts adopt.yml.
      - name: Merge automatically
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Same ruleset-propagation retry as approve-and-merge's "Merge"
          # step above - see that step's comment (karsift-ai-infra#22).
          for attempt in 1 2 3; do
            if gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch; then
              exit 0
            fi
            echo "Merge attempt $attempt/3 failed - retrying in 5s (possible ruleset-propagation lag)." >&2
            sleep 5
          done
          echo "Merge still failing after 3 attempts - not a transient lag, failing for real." >&2
          exit 1

      # Explicitly close a linked task issue with the same App identity so
      # release/auto-advance receive their issues:closed event.
      # PR_BODY goes through env:, never ${{ }}-interpolated directly into
      # the script - same script-injection reasoning as the "Check approval
      # signal" step above (a PR body is attacker-controlled text, this job
      # has contents:write).
      - name: Close linked task issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          issue_number=$(echo "$PR_BODY" | grep -oP '(?<=Closes #)[0-9]+' | head -1 || true)
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "Closed by merge-gate after PR #${{ github.event.pull_request.number }} merged." || true
          fi
