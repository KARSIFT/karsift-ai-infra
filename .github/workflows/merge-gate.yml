name: merge-gate (reusable)

# Risk-aware, fail-closed by design. This mirrors the real activation model
# used across KARSIFT projects (see e.g. vocanova-platform's
# docs/governance/amendments/A-003 and its a003-transition-state.yaml):
# governance PERMISSION and technical ACTIVATION are separate states. R0-R4
# can earn autonomous merge once deterministic checks and independent review
# pass. This workflow does not
# invent a project's risk policy - it only reads a risk declaration the PR
# already carries and enforces the gate proportionate to it.
#
# auto_merge_enabled defaults to "false" because that is the real, current,
# evidenced activation state in every KARSIFT project this has been checked
# against as of this writing - not a cautious guess. Flipping it to "true" is
# a deliberate future edit made after real evidence the loop is reliable for
# the risk classes it will actually cover, never a default.

on:
  workflow_call:
    inputs:
      auto_merge_enabled:
        description: 'Master switch for automatic merge at R0-R4 after CI and independent verification pass.'
        required: false
        type: string
        default: "false"
      expected_head_sha:
        description: "PR head SHA that produced the caller pipeline run. A different live head makes this invocation stale and non-mergeable."
        required: false
        type: string
        default: ""
      expected_base_sha:
        description: "PR base SHA from the same caller run. A different live base invalidates checks and signed review evidence."
        required: false
        type: string
        default: ""
      reuse_outcome:
        description: "Caller ready_for_review reuse decision: reuse-evidence, full-path, or fail-closed-to-full-path."
        required: false
        type: string
        default: ""
      reuse_prior_run_id:
        description: "Validated prior pipeline run id when reuse_outcome is reuse-evidence."
        required: false
        type: string
        default: ""
      current_ci_result:
        description: "Current caller-run CI job result, bound through the caller needs context."
        required: false
        type: string
        default: ""
      founder_username:
        description: 'Deprecated compatibility input. Founder comments are not merge authority.'
        required: false
        type: string
        default: ""
    secrets:
      KARSIFT_BOT_APP_ID:
        description: >
          Optional. GitHub App ID used to publish the immutable task-completion
          marker and close a merged PR's linked task issue with an identity
          other than the default GITHUB_TOKEN. Required for the marker and
          close to propagate to release.yml's `issue_comment` and `issues:
          closed` triggers - GitHub does not fire further workflow-triggering
          events for actions performed by the default GITHUB_TOKEN (anti-
          recursion protection; see "Publish task completion marker and close
          linked task issue" below for where this was found live). Without it,
          the task cannot emit authoritative completion evidence or wake the
          package-completion check.
        required: false
      KARSIFT_BOT_PRIVATE_KEY:
        description: "Optional, paired with KARSIFT_BOT_APP_ID - see that secret's description."
        required: false

jobs:
  # Path 1: on every PR update, report risk class, check status, and what the
  # gate would do. Never merges by itself.
  report-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      # `gh pr checks` reads statusCheckRollup via GraphQL, which needs
      # this scope. Without it the call fails outright ("GraphQL: Resource
      # not accessible by integration"), the `|| echo "false"` fallback in
      # the step below swallows that error silently, and checks_ok is
      # unconditionally "false" regardless of what CI actually did - not a
      # race, not a self-reference issue (an earlier commit on this same
      # file guessed wrong and added an unrelated check-name filter to
      # "fix" a race that was never the real cause; that filter is
      # harmless and left in place, but this permission was necessary, and
      # turned out not sufficient by itself). Found on VOC-012's first real
      # auto-merge attempt: report-status printed checks_ok="false" on
      # every single evaluation, no matter how long CI/review had already
      # been green.
      checks: read
      # `checks: read` alone still wasn't enough: `gh pr checks`'s GraphQL
      # query also resolves each check's `checkSuite.workflowRun`, which is
      # a separate resource needing `actions: read` - without it the same
      # "Resource not accessible by integration" error recurs, just on a
      # narrower field path. Confirmed by re-running VOC-012's PR after
      # adding `checks: read` alone and seeing the identical checks_ok=false
      # outcome with a fully green PR, one permission short.
      actions: read
    outputs:
      risk: ${{ steps.status.outputs.risk }}
      checks_ok: ${{ steps.status.outputs.checks_ok }}
      verdict: ${{ steps.status.outputs.verdict }}
      head_sha: ${{ steps.status.outputs.head_sha }}
      base_sha: ${{ steps.status.outputs.base_sha }}
      is_draft: ${{ steps.status.outputs.is_draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout karsift-ai-infra policy helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KARSIFT/karsift-ai-infra
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Determine risk class, checks, and verification status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=${{ github.event.pull_request.number }}
          expected_head_sha="${{ inputs.expected_head_sha }}"
          expected_base_sha="${{ inputs.expected_base_sha }}"
          reuse_outcome="${{ inputs.reuse_outcome }}"
          reuse_prior_run_id="${{ inputs.reuse_prior_run_id }}"
          current_ci_result="${{ inputs.current_ci_result }}"

          # Fail closed: no parseable declaration means "unknown", and unknown
          # is never auto-mergeable, at any value of auto_merge_enabled.
          pr_json=$(gh pr view "$pr_number" --json body,author,headRefName,headRefOid,baseRefOid,isDraft)
          body=$(echo "$pr_json" | jq -r '.body')
          export PR_BODY="$body"
          PYTHONPATH=karsift-ai-infra/config python3 - <<'PYEOF'
          import os
          from cross_repo_reference import reject_foreign_repository_closing_text

          reject_foreign_repository_closing_text(
              os.environ["PR_BODY"], target_repository=os.environ["GITHUB_REPOSITORY"]
          )
          PYEOF
          pr_author=$(echo "$pr_json" | jq -r '.author.login')
          head_ref=$(echo "$pr_json" | jq -r '.headRefName')
          head_sha=$(echo "$pr_json" | jq -r '.headRefOid')
          base_sha=$(echo "$pr_json" | jq -r '.baseRefOid')
          # GitHub documents isDraft as a boolean. Treat a missing, null, or
          # otherwise malformed value as an infrastructure failure instead
          # of normalizing it to "false" and opening a merge path.
          is_draft=$(echo "$pr_json" | jq -r \
            'if (.isDraft | type) == "boolean" then (.isDraft | tostring) else error("invalid isDraft value") end')
          echo "head_sha=$expected_head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$expected_base_sha" >> "$GITHUB_OUTPUT"
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          risk=$(echo "$body" | grep -ioP '^[[:space:]]*Risk classification:[[:space:]]*R[0-4]\b' \
            | grep -oP 'R[0-4]' | head -1 || true)
          if [ -z "$risk" ]; then
            risk="unknown"
          fi
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

          if ! [[ "$expected_head_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
             ! [[ "$expected_base_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "checks_ok=false" >> "$GITHUB_OUTPUT"
            echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
            echo "Caller omitted or supplied an invalid expected PR base/head SHA. Refusing to reuse checks or review state."
            exit 0
          fi
          if [ "$head_sha" != "$expected_head_sha" ] || [ "$base_sha" != "$expected_base_sha" ]; then
            echo "checks_ok=false" >> "$GITHUB_OUTPUT"
            echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
            echo "Caller pipeline base/head pair is stale. Refusing to reuse checks or review state."
            exit 0
          fi

          # Excludes this pipeline's own governance checks ("merge-gate / *",
          # "remediate / *") from the checks_ok computation - not just the
          # code checks (ci, review, etc.). This job's own check-run (and,
          # on the auto-merge path, its still-queued downstream siblings
          # merge-gate/auto-merge and remediate/decide+retry, which wait on
          # this job via `needs`) are necessarily non-terminal while this
          # step is running, so including them made checks_ok evaluate to
          # false almost every time on a PR with multiple concurrent
          # merge-gate/remediate jobs in flight - discovered on
          # vocanova-platform-sandbox's first real VOC-012 auto-merge
          # attempt: ci and review had both genuinely passed, but checks_ok
          # was false anyway because this job's own in-progress check (and
          # its queued dependents) were included in the "all checks green"
          # count. The single-job "approved"-comment path mostly avoided
          # this by luck (fewer concurrent jobs, less chance of catching one
          # mid-flight), not by design - it has the identical bug below.
          if ! gh api "repos/${{ github.repository }}/pulls/$pr_number" \
               > /tmp/merge-pr.json ||
             ! gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
               "repos/${{ github.repository }}/commits/$head_sha/check-runs?per_page=100" \
               > /tmp/merge-check-runs.json ||
             ! gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
               "repos/${{ github.repository }}/commits/$head_sha/status?per_page=100" \
               > /tmp/merge-statuses.json ||
             ! python3 karsift-ai-infra/config/authoritative-checks-runner.py \
               --check-runs-file /tmp/merge-check-runs.json \
               --statuses-file /tmp/merge-statuses.json \
               --repository "${{ github.repository }}" \
               --pr-number "$pr_number" \
               --base-sha "$base_sha" \
               --head-sha "$head_sha" \
               --pull-request-file /tmp/merge-pr.json \
               --workflow-event "pull_request" \
               --output /tmp/merge-authoritative.json; then
            echo "checks_ok=false" >> "$GITHUB_OUTPUT"
            echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq '.checks' /tmp/merge-authoritative.json > /tmp/pr-checks.json
          prior_jobs_available=false
          current_run_id="${{ github.run_id }}"
          current_policy_matches=false
          if [ "$reuse_outcome" = "reuse-evidence" ] &&
             [[ "$reuse_prior_run_id" =~ ^[0-9]+$ ]] &&
             [ "$reuse_prior_run_id" -lt "$current_run_id" ] &&
             gh api "repos/${{ github.repository }}/actions/runs/$current_run_id" > /tmp/current-run.json &&
             gh api "repos/${{ github.repository }}/actions/runs/$reuse_prior_run_id" > /tmp/prior-run.json; then
            prior_run_valid=$(jq -r \
              --argjson run_id "$reuse_prior_run_id" \
              --arg head_sha "$head_sha" \
              --arg base_sha "$base_sha" \
              --arg head_ref "$head_ref" \
              --argjson pr_number "$pr_number" \
              '.id == $run_id and .name == "pipeline" and
               .path == ".github/workflows/pipeline.yml" and
               .event == "pull_request" and .head_sha == $head_sha and
               .head_branch == $head_ref and .status == "completed" and
               .conclusion == "success" and
               ([.pull_requests[]? | select(
                 .number == $pr_number and .base.sha == $base_sha and
                 .head.sha == $head_sha
               )] | length) == 1' \
              /tmp/prior-run.json || echo "false")
            if [ "$prior_run_valid" = "true" ] &&
               gh api "repos/${{ github.repository }}/actions/runs/$reuse_prior_run_id/jobs?per_page=100" > /tmp/prior-jobs.json; then
              prior_total=$(jq -r '.total_count // 0' /tmp/prior-jobs.json)
              prior_len=$(jq -r '.jobs | length' /tmp/prior-jobs.json)
              if [ "$prior_total" = "$prior_len" ] && [ "$prior_len" -gt 0 ] && [ "$prior_len" -le 100 ]; then
                prior_jobs_available=true
              fi
            fi
            current_policy_matches=$(python3 karsift-ai-infra/config/merge-gate-reuse-checks.py policy \
              --current-run-file /tmp/current-run.json \
              --prior-run-file /tmp/prior-run.json || echo "false")
          fi
          if [ "$reuse_outcome" = "reuse-evidence" ]; then
            if [ "$prior_jobs_available" = "true" ] &&
               [ "$current_policy_matches" = "true" ] &&
               [ "$current_ci_result" = "success" ]; then
              checks_ok=$(python3 karsift-ai-infra/config/merge-gate-reuse-checks.py checks \
                --pr-checks-file /tmp/pr-checks.json \
                --prior-jobs-file /tmp/prior-jobs.json \
                --head-ref "$head_ref" \
                --reuse-outcome "$reuse_outcome" || echo "false")
            else
              checks_ok=false
            fi
          else
            checks_ok=$(python3 karsift-ai-infra/config/merge-gate-reuse-checks.py checks \
              --pr-checks-file /tmp/pr-checks.json \
              --head-ref "$head_ref" \
              --reuse-outcome "$reuse_outcome" || echo "false")
          fi
          echo "checks_ok=$checks_ok" >> "$GITHUB_OUTPUT"

          # Bot-authored PRs (Dependabot etc.) never get a `review` job run
          # against them - that job is gated to the agent/task-authored
          # pipeline, by design (a version bump has no implementation for a
          # reviewer to verify; CI passing is the verification). Searching
          # for an "**Independent verification" comment that structurally
          # can never exist made every such PR permanently resolve to
          # PENDING, so neither this path nor auto-merge could ever
          # complete for them regardless of how clean CI was or how
          # explicitly a human approved - found live, 2026-08-09,
          # vocanova-platform-sandbox PRs #421-#430. Treat "no review
          # applies because the author is a recognized bot" as distinct
          # from "review hasn't finished yet": CI green is the whole
          # verification for a dependency bump with no code for a human or
          # agent to have written.
          if [ "$pr_author" = "dependabot[bot]" ]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          review_check=""
          task_line=""
          issue_line=""
          package_line=""
          if [[ "$head_ref" == agent/* ]]; then
            review_check="review / publish-review"
            mapfile -t tasks < <(printf '%s\n' "$body" | grep -oP '(?<=Implements task `)[^`]+' || true)
            mapfile -t packages < <(printf '%s\n' "$body" | grep -oP '(?<=Package path: `)[^`]+' || true)
            mapfile -t issues < <(printf '%s\n' "$body" | grep -oP '(?<=Closes #)[0-9]+' || true)
            if [ "${#tasks[@]}" -ne 1 ] || [ "${#packages[@]}" -ne 1 ] || [ "${#issues[@]}" -ne 1 ]; then
              echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            task_line="task_id: \`${tasks[0]}\`"
            package_line="package_path: \`${packages[0]}\`"
            issue_line="authority_issue: \`${issues[0]}\`"
          elif [[ "$head_ref" == plan/* ]]; then
            review_check="plan-review / publish-plan-review"
            mapfile -t packages < <(printf '%s\n' "$body" | grep -oP '(?<=New package directory: `)[^`]+' || true)
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            package_line="package_path: \`${packages[0]}\`"
          else
            echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$reuse_outcome" = "reuse-evidence" ]; then
            if [ "$prior_jobs_available" = "true" ]; then
              review_check_ok=$(python3 karsift-ai-infra/config/merge-gate-reuse-checks.py publisher \
                --pr-checks-file /tmp/pr-checks.json \
                --prior-jobs-file /tmp/prior-jobs.json \
                --head-ref "$head_ref" \
                --reuse-outcome "$reuse_outcome" || echo "false")
            else
              review_check_ok=false
            fi
          else
            review_check_ok=$(jq -r --arg name "$review_check" \
              '[.[] | select(.name == $name)] | length > 0 and all(.state == "SUCCESS")' \
              /tmp/pr-checks.json)
          fi
          if [ "$review_check_ok" != "true" ]; then
            echo "verdict=PENDING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          review_header="**Independent verification - bound to commit \`$head_sha\`**"
          base_line="base_sha: \`$base_sha\`"
          run_line=""
          if [ "$reuse_outcome" = "reuse-evidence" ]; then
            run_line="pipeline_run_id: \`$reuse_prior_run_id\`"
          fi
          verdict=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/issues/$pr_number/comments?per_page=100" \
            | jq -r \
              --arg header "$review_header" \
              --arg task "$task_line" \
              --arg package "$package_line" \
              --arg issue "$issue_line" \
              --arg base "$base_line" \
              --arg run "$run_line" \
              '[.[][] | select(
                .user.login == "karsift-ai-infra-bot[bot]" and
                .user.type == "Bot" and
                (.body | startswith($header)) and
                ((.body | split("\n") | index($header)) != null) and
                ((.body | split("\n") | index($package)) != null) and
                ((.body | split("\n") | index($base)) != null) and
                ($run == "" or ((.body | split("\n") | index($run)) != null)) and
                ($task == "" or ((.body | split("\n") | index($task)) != null)) and
                ($issue == "" or ((.body | split("\n") | index($issue)) != null))
              )] | sort_by(.created_at, .id) | last | .body // ""')
          printf '%s\n' "$verdict" > /tmp/review-verdict.md

          # Use the same fail-dominant parser as remediation. It tolerates
          # historical bold/trailing-prose variants while refusing to let a
          # WAITING marker mask any machine-readable FAIL in the report.
          review_state=$(python3 karsift-ai-infra/config/classify-review-verdict.py /tmp/review-verdict.md)
          echo "verdict=$review_state" >> "$GITHUB_OUTPUT"

      - name: Post status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=${{ github.event.pull_request.number }}
          risk="${{ steps.status.outputs.risk }}"
          checks_ok="${{ steps.status.outputs.checks_ok }}"
          verdict="${{ steps.status.outputs.verdict }}"
          is_draft="${{ steps.status.outputs.is_draft }}"
          gates_pass=false
          if [ "$checks_ok" = "true" ] && [ "$verdict" != "FAIL" ] && [ "$verdict" != "WAITING" ] && [ "$verdict" != "PENDING" ]; then
            gates_pass=true
          fi

          if [ "$risk" = "unknown" ]; then
            decision="BLOCKED - no parseable 'Risk classification: R#' line found in the PR body; correct the declaration"
          elif [ "$is_draft" = "true" ]; then
            decision="BLOCKED - PR is draft; mark it ready only after its required evidence is complete"
          elif [ "$gates_pass" = "true" ] && [ "${{ inputs.auto_merge_enabled }}" = "true" ]; then
            decision="WOULD AUTO-MERGE ($risk, auto_merge_enabled=true)"
          elif [ "$gates_pass" = "true" ]; then
            decision="BLOCKED - gates pass for $risk but autonomous merge is not technically activated"
          else
            decision="would NOT merge yet (risk=$risk, checks_ok=$checks_ok, verdict=$verdict)"
          fi

          gh pr comment "$pr_number" --body "**merge-gate:** $decision. Founder approval comments are not part of the merge path; failed or missing gates remain fail-closed."

  # Automatic path: auto_merge_enabled=true and report-status already found
  # every non-human gate passing for a parseable R0-R4 declaration. This only runs once a
  # project deliberately flips the switch - it is inert while the switch is
  # false, which is the default and the current real state everywhere.
  auto-merge:
    needs: report-status
    if: |
      github.event_name == 'pull_request' &&
      inputs.auto_merge_enabled == 'true' &&
      needs.report-status.outputs.is_draft == 'false' &&
      needs.report-status.outputs.risk != 'unknown' &&
      needs.report-status.outputs.checks_ok == 'true' &&
      needs.report-status.outputs.verdict != 'FAIL' &&
      needs.report-status.outputs.verdict != 'WAITING' &&
      needs.report-status.outputs.verdict != 'PENDING'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout shared lifecycle policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Require GitHub App credentials
        env:
          APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "GitHub App credentials are required for workflow-triggering merges; refusing to merge with github.token." >&2
            exit 1
          fi

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

      - name: Publish immutable reuse transition attestation
        if: inputs.reuse_outcome == 'reuse-evidence'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ needs.report-status.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.report-status.outputs.base_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          POLICY_SHA: ${{ job.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRIOR_RUN_ID: ${{ inputs.reuse_prior_run_id }}
          READY_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$PRIOR_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$READY_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             [ "$PRIOR_RUN_ID" -ge "$READY_RUN_ID" ] ||
             [ -z "$HEAD_REF" ] || [ -z "$REPOSITORY" ]; then
            echo "Reuse transition inputs are malformed; refusing to attest or merge." >&2
            exit 1
          fi
          live_pair=$(gh pr view "$PR_NUMBER" --json headRefName,headRefOid,baseRefOid,state,isDraft)
          if [ "$(jq -r .state <<<"$live_pair")" != "OPEN" ] ||
             ! jq -e '(.isDraft | type) == "boolean" and .isDraft == false' >/dev/null <<<"$live_pair" ||
             [ "$(jq -r .headRefName <<<"$live_pair")" != "$HEAD_REF" ] ||
             [ "$(jq -r .headRefOid <<<"$live_pair")" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$(jq -r .baseRefOid <<<"$live_pair")" != "$EXPECTED_BASE_SHA" ]; then
            echo "PR identity changed before reuse attestation; refusing stale evidence." >&2
            exit 1
          fi
          header='**Ready-for-review reuse — pre-merge attestation**'
          body=$(printf '%s\n' \
            "$header" \
            "repository: \`$REPOSITORY\`" \
            "pr_number: \`$PR_NUMBER\`" \
            "head_ref: \`$HEAD_REF\`" \
            "head_sha: \`$EXPECTED_HEAD_SHA\`" \
            "base_sha: \`$EXPECTED_BASE_SHA\`" \
            "ready_run_id: \`$READY_RUN_ID\`" \
            "prior_run_id: \`$PRIOR_RUN_ID\`" \
            "policy_sha: \`$POLICY_SHA\`" \
            '' \
            'This App-authored record binds the optimized transition before merge.')
          comments=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")
          matching_headers=$(jq -r --arg header "$header" \
            '[.[][] | select(
              .user.login == "karsift-ai-infra-bot[bot]" and
              .user.type == "Bot" and
              (.body | startswith($header))
            )] | length' <<<"$comments")
          exact_matches=$(jq -r --arg body "$body" \
            '[.[][] | select(
              .user.login == "karsift-ai-infra-bot[bot]" and
              .user.type == "Bot" and .body == $body
            )] | length' <<<"$comments")
          if [ "$matching_headers" = "0" ]; then
            jq -n --arg body "$body" '{body: $body}' |
              gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null
          elif [ "$matching_headers" != "1" ] || [ "$exact_matches" != "1" ]; then
            echo "Reuse transition attestation is conflicting or ambiguous; refusing to merge." >&2
            exit 1
          fi

      # The App token is essential: a merge made with github.token does not
      # emit the pull_request:closed event that starts adopt.yml.
      - name: Merge automatically
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEWED_HEAD_SHA: ${{ needs.report-status.outputs.head_sha }}
          REVIEWED_BASE_SHA: ${{ needs.report-status.outputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Same ruleset-propagation retry as approve-and-merge's "Merge"
          # step above - see that step's comment (karsift-ai-infra#22).
          for attempt in 1 2 3; do
            live_pair=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,state,isDraft)
            if [ "$(jq -r .state <<<"$live_pair")" != "OPEN" ] ||
               ! jq -e '(.isDraft | type) == "boolean" and .isDraft == false' \
                 >/dev/null <<<"$live_pair" ||
               [ "$(jq -r .headRefOid <<<"$live_pair")" != "$REVIEWED_HEAD_SHA" ] ||
               [ "$(jq -r .baseRefOid <<<"$live_pair")" != "$REVIEWED_BASE_SHA" ]; then
              echo "PR became closed or draft, or its base/head pair changed immediately before merge; refusing stale evidence." >&2
              exit 1
            fi
            if gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$REVIEWED_HEAD_SHA"; then
              exit 0
            fi
            echo "Merge attempt $attempt/3 failed - retrying in 5s (possible ruleset-propagation lag)." >&2
            sleep 5
          done
          echo "Merge still failing after 3 attempts - not a transient lag, failing for real." >&2
          exit 1

      # Publish immutable caller-merge evidence before closing the linked
      # task issue. Issue state alone is never completion authority. The
      # adapter fetches the live merged PR body so an authorized body repair
      # is visible to a failed-job rerun; the original event snapshot is not
      # completion authority.
      - name: Publish task completion marker and close linked task issue
        if: startsWith(github.event.pull_request.head.ref, 'agent/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: karsift-ai-infra/config
        run: |
          set -euo pipefail
          python3 karsift-ai-infra/config/task-completion-runner.py publish \
            --repository "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --reviewed-head-sha "${{ needs.report-status.outputs.head_sha }}" \
            --reviewed-base-sha "${{ needs.report-status.outputs.base_sha }}"

      - name: Recover missing integration push workflows for merged SHA
        if: always() && steps.merge.outcome == 'success' && startsWith(github.event.pull_request.head.ref, 'agent/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: karsift-ai-infra/config
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          merged_sha=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
          base_ref=$(gh pr view "$PR_NUMBER" --json baseRefName -q .baseRefName)
          if ! [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]] || [ -z "$base_ref" ]; then
            echo "Merged integration SHA or base ref is unavailable; refusing recovery." >&2
            exit 1
          fi
          python3 karsift-ai-infra/config/actions-check-recovery-runner.py \
            --repository "${{ github.repository }}" \
            --mode integration_push \
            --target-sha "$merged_sha" \
            --branch-ref "$base_ref" \
            --timeout-seconds 1800 \
            --github-token "$GH_TOKEN"
