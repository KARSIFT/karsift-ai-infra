name: review (reusable)

# Runs the "reviewer" role: independent, read-only verification of an
# implementation PR against its approved change package. Which model fills
# this role is resolved from THIS repo's own config/roles.yml.
#
# Known limitation: the *model* is config-driven (roles.yml), but the
# *execution step* below is still specific to whichever CLI/action fills the
# role (its own install step, its own permission-profile/tool-restriction
# flags). Swapping the reviewer role to a different vendor's CLI/action means
# editing the "Run independent verification" step itself, not just
# roles.yml - full run-time provider abstraction isn't built yet. Don't claim
# more decoupling than exists.
#
# TEMPORARY (2026-07-24): rewritten from Claude Code CLI to openai/codex-action
# because the Anthropic Console org behind ANTHROPIC_API_KEY was disabled with
# no fallback Claude access available - see config/roles.yml's header comment
# for the full same-vendor-compromise rationale and the explicit note to
# revert this once Claude access is restored.
#
# PILOT (2026-07-25): rewritten a second time, reviewer-only, from
# openai/codex-action to a raw `opencode` CLI invocation (OpenCode -
# opencode.ai - a model-agnostic coding-agent client, not itself a vendor).
# Founder's explicit reason: cost - an existing OpenCode Go subscription
# ($10/month) unlocks a set of `opencode-go/`-prefixed models, letting the
# reviewer role run on a coding-tuned model (opencode-go/kimi-k2.7-code)
# without paying OpenAI's own per-token tiers. There is no official reusable
# action for this the way openai/codex-action or anthropics/claude-code-action
# exist - OpenCode's own `anomalyco/opencode/github@latest` Action is built
# for interactive `/opencode` PR-comment mentions, not a workflow_call/
# one-shot dispatch like this job, so it isn't used here.
#
# `opencode run` (the actual installed CLI, v1.18.5 as of this pilot) has NO
# `--permissions` or `--quiet` flag - an earlier version of this same step
# assumed both existed (from web-fetched docs that turned out unreliable -
# see config/roles.yml's correction note) and every run hard-failed
# immediately on the rejected `--permissions` flag, never even reaching a
# model. Real read-only enforcement is agent-based: a `reviewer` agent is
# defined in a generated `opencode.jsonc` (see "Configure opencode" step
# below) with every permission key explicitly `allow` (read/grep/glob/list)
# or `deny` (everything else - edit, bash, webfetch, websearch, task,
# todowrite, external_directory, question, skill, lsp, doom_loop) - this is
# what preserves the no-write, no-merge guarantee for this role, the
# equivalent of codex-action's `:read-only` profile. `--format json` gives
# structured nd-JSON events instead of the default formatted output (which
# mixes in ANSI color codes and decorative tool-call trace lines even when
# stdout isn't a TTY) - the "Extract verdict text" step below pulls out only
# `type: "text"` events' `part.text`, the model's actual response.
#
# This pilot is reviewer-only by explicit founder instruction - implementer
# and planner stay on openai/codex-action; do not extend this pattern to
# those roles without a separate explicit decision.
#
# Needs OPENCODE_API_KEY (NOT OPENCODE_ZEN_API_KEY - an earlier version of
# this pilot used that name, tied to OpenCode Zen's separate pay-as-you-go
# balance, which is unfunded; the Go-subscription key is OPENCODE_API_KEY)
# as a repo/org secret on the calling project - same Free-plan-org
# private-repo caveat as OPENAI_API_KEY documented in the project template's
# pipeline.yml (org secrets can silently not reach a private repo; set at
# repo level too if so).

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      package_path:
        description: 'Path to the change package directory, e.g. "specs/changes/VOC-007-some-slug"'
        required: true
        type: string
      integration_branch:
        description: 'The calling project''s integration branch the package lives on - "develop" for a develop/main split, "main" for GitHub-flow-only projects.'
        required: false
        type: string
        default: "develop"
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No repo checked out yet at this point - gh needs GH_REPO set
      # explicitly rather than inferring it from a local git remote (same
      # fix already applied in remediate.yml's own metadata-parsing step,
      # for the identical reason).
      - name: Fetch PR diff, metadata, and exact SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr diff ${{ inputs.pr_number }} > /tmp/pr.diff
          gh pr view ${{ inputs.pr_number }} --json body,title,headRefOid > /tmp/pr.json
          echo "sha=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      # Checks out the PR's own reviewed commit, not integration_branch -
      # found live (VOC-022-T00) that checking out integration_branch here
      # gave the reviewer a tree that genuinely did not contain the commit
      # it was told to review, and no way to fetch it either (read-only
      # Read/Grep/Glob tools, no Bash). Twice now this has produced a bad
      # review: once the model asked an unanswerable question instead of a
      # verdict (fixed in prompts/review.md), and once it correctly
      # disclosed the limitation per that fix but still treated "commit
      # unreachable" as a disqualifying Critical finding on an otherwise-
      # clean structural review - the actual root cause was always that the
      # commit really was unreachable, not a model quality problem either
      # time. Checking out the exact reviewed SHA removes the root cause:
      # the reviewer now has the real file tree for what it's reviewing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Checkout karsift-ai-infra
        uses: actions/checkout@v4
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra

      # Routes a remediate.yml retry (attempt 2) on a low-risk (R0/R1)
      # package to a cheaper/faster model (config/roles.yml's
      # `reviewer_fast_retry`) instead of the full `reviewer` model - see
      # that role's comment for why this is scoped to retries only, never a
      # first-pass review, and never R2+. Both attempt and risk are parsed
      # here rather than plumbed as new inputs from pipeline.yml: attempt is
      # already embedded in the PR body ("attempt N of 2", the same text
      # remediate.yml itself parses), and risk is already in change.yaml,
      # which this job reads anyway for the prompt below - no new wiring
      # needed in the calling project's pipeline.yml.
      - name: Resolve reviewer model
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attempt=$(jq -r .body /tmp/pr.json | grep -oP '(?<=attempt )[0-9]+(?= of 2)' | head -1 || echo "1")
          risk=$(grep -oP '^risk:\s*\K.*' "${{ inputs.package_path }}/change.yaml" 2>/dev/null | head -1 || echo "")

          role="reviewer"
          if [ "$attempt" -ge 2 ] && { [ "$risk" = "R0" ] || [ "$risk" = "R1" ]; }; then
            fast=$(bash karsift-ai-infra/config/resolve-model.sh reviewer_fast_retry karsift-ai-infra/config/roles.yml || echo "")
            if [ -n "$fast" ]; then
              role="reviewer_fast_retry"
            fi
          fi
          echo "Routing this review as: role=$role (attempt=$attempt, risk=${risk:-unknown})"

          MODEL=$(bash karsift-ai-infra/config/resolve-model.sh "$role" karsift-ai-infra/config/roles.yml)
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      # codex-action has no prompt-caching equivalent to Anthropic's, so the
      # static-instructions/variable-content split that mattered for Claude
      # Code CLI (system prompt vs. -p text) has no benefit here - back to
      # one concatenated prompt file, prompts/review.md first.
      #
      # task_id extraction (2026-07-24 fix): implement.yml's PR body always
      # contains "Implements task `<task_id>` from `<change_id>`" (see that
      # workflow's "Open pull request" step). Multi-task packages get one PR
      # per task, each reviewed independently before the package is done -
      # pasting the *whole* acceptance-criteria.md with no task scope caused
      # every non-final task's PR to fail review against AC that only a
      # later task's PR is meant to satisfy (found live on VOC-024-T00, PR
      # #61: reviewer correctly read AC-01..AC-05 in acceptance-criteria.md,
      # correctly noticed the nested route/AC-01..03 weren't implemented,
      # and failed a PR that was only ever scoped to AC-00/AC-04/AC-05 per
      # tasks.md). Pasting tasks.md too and telling the reviewer which
      # task_id is under review - the same context implement.yml already
      # gives the implementer - lets it scope correctly instead of judging
      # task N's diff against the full package's finished-state criteria.
      - name: Build prompt
        run: |
          task_id=$(jq -r .body /tmp/pr.json | grep -oP '(?<=Implements task `)[^`]+' | head -1 || echo "")

          {
            cat karsift-ai-infra/prompts/review.md
            echo
            echo "## Reviewed commit SHA: ${{ steps.pr.outputs.sha }}"
            if [ -n "$task_id" ]; then
              echo
              echo "## Task under review: $task_id"
              echo
              echo "This PR implements ONLY the task above, one of possibly several tasks"
              echo "in this package (see tasks.md below). Scope your acceptance-criteria"
              echo "assessment to the acceptance criteria this task's own tasks.md entry"
              echo "declares for it, not the full package's acceptance-criteria.md - later"
              echo "tasks are separate, independently reviewed PRs and are not yet"
              echo "implemented by design. Do not fail this PR for not yet satisfying"
              echo "another task's criteria."
            fi
            echo
            echo "## Package under review"
            echo
            echo "### specification.md"
            cat "${{ inputs.package_path }}/specification.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### tasks.md (task breakdown and per-task scope)"
            cat "${{ inputs.package_path }}/tasks.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### acceptance-criteria.md (full package - see task scope note above)"
            cat "${{ inputs.package_path }}/acceptance-criteria.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### impact-analysis.md (protected areas, declared risk)"
            cat "${{ inputs.package_path }}/impact-analysis.md" 2>/dev/null || echo "(missing)"
            echo
            echo "### change.yaml"
            cat "${{ inputs.package_path }}/change.yaml" 2>/dev/null || echo "(missing)"
            echo
            echo "## PR metadata"
            cat /tmp/pr.json
            echo
            echo "## Diff"
            cat /tmp/pr.diff
          } > /tmp/review-prompt.txt

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      # Read-only enforcement lives here, not in a CLI flag - see this file's
      # header comment for why `run` has no `--permissions`/`--quiet` flag to
      # use instead. Every permission key from OpenCode's own published
      # schema (https://opencode.ai/config.json, $defs.PermissionConfig) is
      # set explicitly so nothing falls through to an implicit default.
      - name: Configure opencode
        run: |
          cat > opencode.jsonc <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "agent": {
              "reviewer": {
                "description": "Independent read-only reviewer - never edits or executes",
                "mode": "primary",
                "permission": {
                  "read": "allow",
                  "grep": "allow",
                  "glob": "allow",
                  "list": "allow",
                  "edit": "deny",
                  "bash": "deny",
                  "webfetch": "deny",
                  "websearch": "deny",
                  "task": "deny",
                  "todowrite": "deny",
                  "external_directory": "deny",
                  "question": "deny",
                  "skill": "deny",
                  "lsp": "deny",
                  "doom_loop": "deny"
                }
              }
            }
          }
          EOF

      # No allow-bot-users equivalent needed: opencode has no actor-permission
      # gate the way codex-action does (that check was specific to resolving
      # a GitHub Actions actor identity against repo-collaborator permissions
      # before running - opencode has no such concept, it just runs with
      # whatever credentials/permissions the active agent config grants).
      #
      # --format json gives nd-JSON events instead of decorated text (see
      # header comment) - "Extract verdict text" below pulls the actual
      # response out of it. No --auto flag: every permission the `reviewer`
      # agent could need is already explicitly allow/deny above, so nothing
      # should ever hit an "ask" prompt this run could hang on; --auto would
      # only paper over a permission key I forgot to enumerate, which is
      # exactly the failure mode worth surfacing (a hang/timeout), not
      # silently auto-approving.
      # The prompt used to be spliced in as a single positional argument
      # (`opencode run "$(cat ...)"`) - fine for a small package but Linux's
      # execve() rejects any single argument over ~128KB (MAX_ARG_STRLEN)
      # regardless of the much larger overall ARG_MAX, and a real review
      # prompt (full diff + task files + acceptance criteria) crosses that
      # on anything but a trivial PR. Found live 2026-07-25 on VOC-026-T00
      # (a migration/schema-heavy PR, PR #88): failed in 8s with "Argument
      # list too long", exit 126, before ever reaching the model. Fixed by
      # attaching the prompt as a file (`-f`/`--file`, which the CLI reads
      # itself rather than the shell placing it on the exec argv) instead of
      # inlining its content into the command line.
      # Falls back to a second OpenCode account (OPENCODE_SECOND_API_KEY,
      # unset unless the calling project defines it - a per-project cost
      # decision, not a karsift-ai-infra default) if the primary account's
      # own run fails with what looks like quota/balance exhaustion, rather
      # than failing the whole review outright. Only retries on that
      # specific failure class (matched against stderr/stdout by the
      # vendor's own wording, e.g. "Insufficient balance" per the OpenCode
      # pilot's item 26/27) - any other failure (a real prompt/model/CLI
      # bug) fails normally instead of silently burning the second
      # account's quota chasing an unrelated error.
      # timeout-minutes bounds a real hang, not just a slow run - see
      # plan.yml's identical addition for the live incident that surfaced
      # this gap (a planner hang, same underlying opencode CLI). Raised
      # 15 -> 30 (2026-07-26): VOC-030-T00's PR #134 (a large R3 diff - five
      # new tables plus a full domain module) hit this timeout twice in a
      # row on the same commit with no error, just ran out of time - and
      # because remediate.yml's retry decision reads attempt count from the
      # PR body (which a hand-pushed fix commit doesn't update), a timed-out
      # review kept re-triggering a redundant attempt-2 implementer dispatch
      # against findings that were already fixed on the branch, instead of
      # just needing the review itself to finish. 30 minutes matches
      # implement.yml's own budget for large diffs.
      - name: Run independent verification
        id: verify
        timeout-minutes: 30
        env:
          # TEMPORARILY SWAPPED (2026-07-25) - see plan.yml's identical swap
          # for why: the primary account's weekly OpenCode Go quota ran out.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_SECOND_API_KEY }}
          OPENCODE_SECOND_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -uo pipefail
          run_review() {
            OPENCODE_API_KEY="$1" opencode run "Follow the instructions in the attached file exactly." \
              --file /tmp/review-prompt.txt \
              --agent reviewer \
              --model "${{ steps.model.outputs.model }}" \
              --format json > /tmp/verdict-events.jsonl 2> /tmp/opencode-stderr.log
          }
          run_review "$OPENCODE_API_KEY"
          exit_code=$?
          if [ "$exit_code" -ne 0 ] && [ -n "${OPENCODE_SECOND_API_KEY:-}" ] && \
             grep -qiE "insufficient balance|quota exceeded|rate.?limit|too many requests|429|payment required|402" \
               /tmp/opencode-stderr.log /tmp/verdict-events.jsonl 2>/dev/null; then
            echo "::warning::Primary OpenCode account looks quota-exhausted - retrying with the second account."
            cat /tmp/opencode-stderr.log >&2
            run_review "$OPENCODE_SECOND_API_KEY"
            exit_code=$?
          fi
          if [ "$exit_code" -ne 0 ]; then
            cat /tmp/opencode-stderr.log >&2
          fi
          exit "$exit_code"

      - name: Extract verdict text
        run: |
          python3 - <<'PYEOF'
          import json

          chunks = []
          with open("/tmp/verdict-events.jsonl") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  event = json.loads(line)
                  if event.get("type") == "text":
                      chunks.append(event["part"]["text"])

          if not chunks:
              raise SystemExit(
                  "opencode produced no text response - see /tmp/verdict-events.jsonl "
                  "in this job's logs for the raw event stream (likely an error event)."
              )

          with open("/tmp/verdict.md", "w") as f:
              f.write("".join(chunks))
          PYEOF

      - name: Show verdict
        run: cat /tmp/verdict.md

      - name: Post verification comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Independent verification - bound to commit \`${{ steps.pr.outputs.sha }}\`**"
            echo
            cat /tmp/verdict.md
          } > /tmp/verdict-comment.md
          gh pr comment ${{ inputs.pr_number }} --body-file /tmp/verdict-comment.md
