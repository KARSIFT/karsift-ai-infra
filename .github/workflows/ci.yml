name: ci (reusable)

# Generic application-level checks only. vocanova-platform's own
# governance-policy.yml / repository-governance.yml workflows already run the
# governance/risk-classification checks in-repo - this does not duplicate them.
#
# The actual check logic lives in karsift-ai-infra/config/run-app-checks.sh,
# not inline here - implement.yml's pre-push validation step runs the exact
# same script before the implementer's work is ever pushed, so a pre-push
# pass is a real predictor of this job passing rather than a hand-maintained
# approximation that can silently drift from what this job actually checks.

on:
  workflow_call: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout karsift-ai-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra

      - name: Detect and run pnpm checks
        shell: bash
        run: bash karsift-ai-infra/config/run-app-checks.sh
