name: ci (reusable)

# Generic application-level checks only. vocanova-platform's own
# governance-policy.yml / repository-governance.yml workflows already run the
# governance/risk-classification checks in-repo - this does not duplicate them.
#
# The actual check logic lives in karsift-ai-infra/config/run-app-checks.sh,
# not inline here - implement.yml's pre-push validation step runs the exact
# same script before the implementer's work is ever pushed, so a pre-push
# pass is a real predictor of this job passing rather than a hand-maintained
# approximation that can silently drift from what this job actually checks.

on:
  workflow_call:
    inputs:
      reuse_evidence:
        description: "Emit the required CI context without repeating checks after exact-SHA reuse was approved."
        required: false
        type: boolean
        default: false
      pr_base_sha:
        description: "Immutable PR base SHA when the caller supplies promotion recovery metadata."
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "Immutable PR head SHA when the caller supplies promotion recovery metadata."
        required: false
        type: string
        default: ""
      promotion_pr:
        description: "Authenticated same-repository production <- integration promotion pair."
        required: false
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Record exact-SHA CI evidence reuse
        if: inputs.reuse_evidence
        run: echo "Exact-SHA CI evidence was revalidated by the reuse policy and merge gate."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ !inputs.reuse_evidence }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout karsift-ai-infra
        if: ${{ !inputs.reuse_evidence }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KARSIFT/karsift-ai-infra
          path: karsift-ai-infra
          persist-credentials: false

      - name: Detect and run pnpm checks
        if: ${{ !inputs.reuse_evidence }}
        shell: bash
        env:
          INPUT_PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          INPUT_PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          INPUT_PROMOTION_PR: ${{ inputs.promotion_pr }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_PR_BASE_SHA" ] && [ -n "$INPUT_PR_HEAD_SHA" ]; then
            app_check_args=(
              --pr-base-sha "$INPUT_PR_BASE_SHA"
              --pr-head-sha "$INPUT_PR_HEAD_SHA"
            )
            if [ "$INPUT_PROMOTION_PR" = "true" ]; then
              app_check_args+=(--promotion-pr)
            fi
            bash karsift-ai-infra/config/run-app-checks.sh "${app_check_args[@]}"
          elif [ "$WORKFLOW_EVENT" = "pull_request" ]; then
            app_check_args=(
              --pr-base-sha "$EVENT_BASE_SHA"
              --pr-head-sha "$EVENT_HEAD_SHA"
            )
            if [ "$EVENT_BASE_REF" = "main" ] &&
               [ "$EVENT_HEAD_REF" = "develop" ] &&
               [ "$EVENT_HEAD_REPO" = "${{ github.repository }}" ]; then
              app_check_args+=(--promotion-pr)
            fi
            bash karsift-ai-infra/config/run-app-checks.sh "${app_check_args[@]}"
          else
            bash karsift-ai-infra/config/run-app-checks.sh --squash-safe-push
          fi
