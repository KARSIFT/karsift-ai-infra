name: live-evidence-reconcile (reusable)

# Repository-controlled operator path for declared live GitHub Actions evidence.
# It reads only run/job metadata, never logs or artifacts. Mutations use the
# separately installed KARSIFT GitHub App. Declared workflow dispatch uses only
# this dedicated job's scoped GITHUB_TOKEN because the App installation does not
# require Actions write permission. The implementer receives neither token. A
# qualifying run creates one sanitized result commit, which changes the PR head
# and therefore forces the caller's ordinary exact-SHA review path to run again.

on:
  workflow_call:
    inputs:
      mode:
        description: "reconcile polls declared workflows; observe validates one run id; dispatch invokes one declared workflow."
        required: true
        type: string
      workflow_run_id:
        description: "Observe mode only: repository Actions run id to validate."
        required: false
        type: string
        default: ""
      pr_number:
        description: "Optional reconcile target; required for dispatch mode."
        required: false
        type: string
        default: ""
    secrets:
      KARSIFT_BOT_APP_ID:
        required: true
      KARSIFT_BOT_PRIVATE_KEY:
        required: true

concurrency:
  group: live-evidence-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout shared reconciliation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The github context belongs to the caller. These job contexts point
          # to the exact called reusable-workflow revision instead.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Mint separate operator token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          # The qualified attestation is posted on the waiting pull request.
          # GitHub Apps authorize that conversation through Pull requests,
          # even though the REST route is under /issues/{number}/comments.
          permission-pull-requests: write

      - name: Reconcile declared live evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KARSIFT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RECONCILE_MODE: ${{ inputs.mode }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          args=(
            --mode "$RECONCILE_MODE"
            --repository "$GITHUB_REPOSITORY"
          )
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            args+=(--run-id "$WORKFLOW_RUN_ID")
          fi
          if [ -n "$TARGET_PR_NUMBER" ]; then
            args+=(--pr-number "$TARGET_PR_NUMBER")
          fi
          python3 karsift-ai-infra/config/live-evidence-reconcile-runner.py "${args[@]}"
