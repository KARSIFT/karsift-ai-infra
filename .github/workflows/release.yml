name: release (reusable)

# Issue, reconcile, and terminal-check events are only wake-up hints. One
# serialized job revalidates caller-merge markers and newest exact-head gates,
# then performs at most one promotion merge. A check completion therefore
# wakes cheap evaluation without dispatching unchanged-SHA CI or a reviewer.

on:
  workflow_call:
    inputs:
      founder_username:
        description: 'Deprecated compatibility input; never used as release authority.'
        required: false
        type: string
      release_issue_number:
        description: 'Audit issue to reconcile after an interrupted promotion.'
        required: false
        type: string
      integration_branch:
        description: 'Branch a completed package promotes FROM.'
        required: false
        type: string
        default: "develop"
      production_branch:
        description: 'Branch a completed package promotes TO.'
        required: false
        type: string
        default: "main"
      auto_release_enabled:
        description: 'Deprecated compatibility input; completed rosters promote automatically.'
        required: false
        type: string
        default: "false"
    secrets:
      KARSIFT_BOT_APP_ID:
        required: true
      KARSIFT_BOT_PRIVATE_KEY:
        required: true

jobs:
  identify:
    if: |
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_issue_number != '') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'check_run' && github.event.action == 'completed') ||
      (github.event_name == 'workflow_run' && github.event.action == 'completed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_evaluate: ${{ steps.identify.outputs.should_evaluate }}
      change_id: ${{ steps.identify.outputs.change_id }}
      package_path: ${{ steps.identify.outputs.package_path }}
      release_issue_number: ${{ steps.identify.outputs.release_issue_number }}
      promotion_pr_number: ${{ steps.identify.outputs.promotion_pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.integration_branch }}
          persist-credentials: false

      - name: Checkout shared lifecycle policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false

      - name: Resolve an authoritative release identity
        id: identify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PYTHONPATH: karsift-ai-infra/config
          EVENT_PR_BASE: ${{ github.event.pull_request.base.ref }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "should_evaluate=false" >> "$GITHUB_OUTPUT"
          echo "change_id=" >> "$GITHUB_OUTPUT"
          echo "package_path=" >> "$GITHUB_OUTPUT"
          echo "release_issue_number=" >> "$GITHUB_OUTPUT"
          echo "promotion_pr_number=" >> "$GITHUB_OUTPUT"

          event="${{ github.event_name }}"
          release_issue=""
          promotion_pr=""
          change_id=""
          if [ "$event" = "issues" ]; then
            change_id=$(printf '%s\n' "$ISSUE_TITLE" | grep -oP '^[A-Za-z][A-Za-z0-9]*-\d+(?=:)' || true)
            task_id=$(printf '%s\n' "$ISSUE_TITLE" | grep -oP '(?<=: )[A-Za-z0-9]+-\d+-T\d+[a-z]?' || true)
            if [ -z "$change_id" ] || [ -z "$task_id" ]; then
              echo "Closed issue is not a tracked task; nothing to evaluate."
              exit 0
            fi
          elif [ "$event" = "workflow_dispatch" ]; then
            release_issue="${{ inputs.release_issue_number }}"
            if ! [[ "$release_issue" =~ ^[1-9][0-9]*$ ]]; then
              echo "Release reconciliation issue is malformed; refusing." >&2
              exit 1
            fi
            audit=$(gh issue view "$release_issue" --json title,labels,state)
            title=$(jq -r .title <<<"$audit")
            labeled=$(jq -r '[.labels[].name] | index("karsift:release") != null' <<<"$audit")
            change_id=${title#Release: }
            if [ "$title" = "$change_id" ] || [ "$labeled" != "true" ]; then
              echo "Issue #$release_issue is not a release audit; refusing." >&2
              exit 1
            fi
            if [ "$(jq -r .state <<<"$audit")" = "CLOSED" ]; then
              echo "Release audit is already terminal; successful no-op."
              exit 0
            fi
          elif [ "$event" = "pull_request" ]; then
            if [ "$EVENT_PR_BASE" != "${{ inputs.production_branch }}" ] || \
               [ "$EVENT_PR_HEAD" != "${{ inputs.integration_branch }}" ]; then
              echo "Pull request is not the promotion pair; nothing to evaluate."
              exit 0
            fi
            promotion_pr="$EVENT_PR_NUMBER"
            pr_body=$(gh pr view "$promotion_pr" --json body -q .body)
            mapfile -t release_issues < <(printf '%s\n' "$pr_body" | grep -oP '(?<=release_issue: `)[0-9]+(?=`)' || true)
            mapfile -t change_ids < <(printf '%s\n' "$pr_body" | grep -oP '(?<=change_id: `)[A-Za-z][A-Za-z0-9]*-[0-9]+(?=`)' || true)
            if [ "${#release_issues[@]}" -ne 1 ] || [ "${#change_ids[@]}" -ne 1 ]; then
              echo "Promotion PR lacks one machine-readable release identity; refusing." >&2
              exit 1
            fi
            release_issue="${release_issues[0]}"
            change_id="${change_ids[0]}"
          else
            gh pr list --base "${{ inputs.production_branch }}" --head "${{ inputs.integration_branch }}" \
              --state open --json number,state,headRefName,headRefOid,baseRefName > /tmp/open-promotions.json
            promotion_count=$(jq 'length' /tmp/open-promotions.json)
            if [ "$promotion_count" -ne 1 ]; then
              echo "Terminal check has no unique open promotion PR; safe no-op."
              exit 0
            fi
            if ! python3 - "$GITHUB_EVENT_PATH" /tmp/open-promotions.json "${{ github.repository }}" \
              "${{ inputs.integration_branch }}" "${{ inputs.production_branch }}" <<'PYEOF'
          import json
          import sys
          from release_reevaluation import should_reevaluate
          event = json.load(open(sys.argv[1], encoding="utf-8"))
          promotion_pr = json.load(open(sys.argv[2], encoding="utf-8"))[0]
          raise SystemExit(0 if should_reevaluate(
              event, promotion_pr=promotion_pr, repository=sys.argv[3],
              integration_branch=sys.argv[4], production_branch=sys.argv[5]
          ) else 1)
          PYEOF
            then
              echo "Terminal check is not bound to the promotion PR; nothing to evaluate."
              exit 0
            fi
            promotion_pr=$(jq -r '.[0].number' /tmp/open-promotions.json)
            pr_body=$(gh pr view "$promotion_pr" --json body -q .body)
            mapfile -t release_issues < <(printf '%s\n' "$pr_body" | grep -oP '(?<=release_issue: `)[0-9]+(?=`)' || true)
            mapfile -t change_ids < <(printf '%s\n' "$pr_body" | grep -oP '(?<=change_id: `)[A-Za-z][A-Za-z0-9]*-[0-9]+(?=`)' || true)
            if [ "${#release_issues[@]}" -ne 1 ] || [ "${#change_ids[@]}" -ne 1 ]; then
              echo "Promotion PR lacks one machine-readable release identity; refusing stale wake-up." >&2
              exit 1
            fi
            release_issue="${release_issues[0]}"
            change_id="${change_ids[0]}"
          fi

          package_path=$(find specs/changes -maxdepth 1 -mindepth 1 -type d -name "${change_id}-*" | head -1 || true)
          roster="$package_path/.karsift/tasks.json"
          if [ -z "$package_path" ] || [ ! -f "$roster" ]; then
            echo "No adopted roster found for $change_id; refusing release evaluation." >&2
            exit 1
          fi
          if [ "$event" = "issues" ] && ! python3 karsift-ai-infra/config/task-completion-runner.py validate-task \
            --repository "${{ github.repository }}" --package-path "$package_path" \
            --roster "$roster" --issue-number "${{ github.event.issue.number }}"; then
            echo "Closed issue has no authoritative caller-merge marker; safe no-op."
            exit 0
          fi
          echo "should_evaluate=true" >> "$GITHUB_OUTPUT"
          echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "release_issue_number=$release_issue" >> "$GITHUB_OUTPUT"
          echo "promotion_pr_number=$promotion_pr" >> "$GITHUB_OUTPUT"

  converge:
    needs: identify
    if: needs.identify.outputs.should_evaluate == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-converge-${{ github.repository }}-${{ needs.identify.outputs.change_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.integration_branch }}
          persist-credentials: false
      - name: Checkout shared lifecycle policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: karsift-ai-infra
          persist-credentials: false
      - name: Mint App installation token for release mutation
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.KARSIFT_BOT_APP_ID }}
          private-key: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

      - name: Validate the full roster from caller-merge markers
        id: roster
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: karsift-ai-infra/config
        run: |
          set -euo pipefail
          package_path="${{ needs.identify.outputs.package_path }}"
          if python3 karsift-ai-infra/config/task-completion-runner.py validate-roster \
            --repository "${{ github.repository }}" --package-path "$package_path" \
            --roster "$package_path/.karsift/tasks.json"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "Roster is not authoritatively complete; safe no-op."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or reuse one release audit
        id: audit
        if: steps.roster.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUESTED_ISSUE: ${{ needs.identify.outputs.release_issue_number }}
        run: |
          set -euo pipefail
          change_id="${{ needs.identify.outputs.change_id }}"
          title="Release: $change_id"
          issue_number="$REQUESTED_ISSUE"
          if [ -n "$issue_number" ]; then
            issue=$(gh issue view "$issue_number" --json state,title,labels)
            if [ "$(jq -r .state <<<"$issue")" = "CLOSED" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(jq -r .title <<<"$issue")" != "$title" ] || \
               [ "$(jq -r '[.labels[].name] | index("karsift:release") != null' <<<"$issue")" != "true" ]; then
              echo "Requested release issue identity is invalid; refusing." >&2
              exit 1
            fi
          else
            issue_number=$(gh issue list --state open --search "in:title \"$title\"" \
              --json number,title --jq "[.[] | select(.title == \"$title\")] | if length == 1 then .[0].number elif length == 0 then \"\" else error(\"duplicate release audits\") end")
            if [ -z "$issue_number" ]; then
              gh label create "karsift:release" --color "5319E7" \
                --description "System-generated release audit - not a planning request" --force
              issue_url=$(gh issue create --title "$title" --label "karsift:release" --body "$(cat <<EOF
          The App-validated caller-merge markers prove every task in \`$change_id\` complete.

          Promotion from \`${{ inputs.integration_branch }}\` to \`${{ inputs.production_branch }}\` converges automatically after the newest exact-head checks pass. No founder comment is a release gate.
          EOF
              )")
              issue_number=$(basename "$issue_url")
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the single promotion PR
        id: promotion
        if: steps.audit.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ISSUE: ${{ steps.audit.outputs.issue_number }}
        run: |
          set -euo pipefail
          change_id="${{ needs.identify.outputs.change_id }}"
          requested_pr="${{ needs.identify.outputs.promotion_pr_number }}"
          compare=$(gh api "repos/${{ github.repository }}/compare/${{ inputs.production_branch }}...${{ inputs.integration_branch }}")
          if [ "$(jq -r .ahead_by <<<"$compare")" = "0" ]; then
            gh issue close "$RELEASE_ISSUE" --comment "Already promoted; production contains the completed integration state."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(gh pr list --base "${{ inputs.production_branch }}" --head "${{ inputs.integration_branch }}" \
            --state open --json number --jq 'if length == 1 then .[0].number elif length == 0 then "" else error("duplicate promotion PRs") end')
          if [ -n "$requested_pr" ] && [ -n "$existing" ] && [ "$requested_pr" != "$existing" ]; then
            echo "Terminal event references a stale promotion PR; safe no-op."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(cat <<EOF
          Serialized automatic promotion for an App-validated completed roster.

          Risk classification: R4
          change_id: \`$change_id\`
          release_issue: \`$RELEASE_ISSUE\`

          This PR promotes reviewed integration history. It does not itself deploy infrastructure.
          EOF
          )"
          if [ -z "$existing" ]; then
            url=$(gh pr create --base "${{ inputs.production_branch }}" --head "${{ inputs.integration_branch }}" \
              --title "Release: promote ${{ inputs.integration_branch }} to ${{ inputs.production_branch }}" --body "$body")
            existing=$(basename "$url")
          fi
          live=$(gh pr view "$existing" --json state,isDraft,headRefOid,baseRefName,headRefName)
          if [ "$(jq -r .state <<<"$live")" != "OPEN" ] || [ "$(jq -r .isDraft <<<"$live")" != "false" ] || \
             [ "$(jq -r .baseRefName <<<"$live")" != "${{ inputs.production_branch }}" ] || \
             [ "$(jq -r .headRefName <<<"$live")" != "${{ inputs.integration_branch }}" ]; then
            echo "Promotion PR identity is not mergeable; refusing." >&2
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$existing" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .headRefOid <<<"$live")" >> "$GITHUB_OUTPUT"

      - name: Select newest authoritative promotion checks
        id: gates
        if: steps.promotion.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: karsift-ai-infra/config
          PR_NUMBER: ${{ steps.promotion.outputs.pr_number }}
          HEAD_SHA: ${{ steps.promotion.outputs.head_sha }}
        run: |
          set -euo pipefail
          live=$(gh pr view "$PR_NUMBER" --json state,headRefOid,baseRefOid)
          if [ "$(jq -r .state <<<"$live")" != "OPEN" ] || [ "$(jq -r .headRefOid <<<"$live")" != "$HEAD_SHA" ]; then
            echo "Promotion PR became terminal or changed; safe no-op."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha=$(jq -r .baseRefOid <<<"$live")
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > /tmp/release-pr.json
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" > /tmp/release-check-runs.json
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/commits/$HEAD_SHA/status?per_page=100" > /tmp/release-statuses.json
          python3 karsift-ai-infra/config/authoritative-checks-runner.py \
            --check-runs-file /tmp/release-check-runs.json --statuses-file /tmp/release-statuses.json \
            --repository "${{ github.repository }}" --pr-number "$PR_NUMBER" --base-sha "$base_sha" \
            --head-sha "$HEAD_SHA" --pull-request-file /tmp/release-pr.json \
            --workflow-event "pull_request" --workflow-event "push" \
            --workflow-event "workflow_dispatch" --workflow-event "schedule" \
            --exclude-prefix "release /" --output /tmp/release-authoritative.json
          total=$(jq -r .total_count /tmp/release-authoritative.json)
          pending=$(jq -r .pending /tmp/release-authoritative.json)
          failed=$(jq -r .failed /tmp/release-authoritative.json)
          if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ] && [ "$failed" -eq 0 ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest authoritative gates are not all successful; no merge decision yet."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Perform the single exact-head merge decision
        if: steps.gates.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pr_number }}
          CHECKED_HEAD_SHA: ${{ steps.promotion.outputs.head_sha }}
          RELEASE_ISSUE: ${{ steps.audit.outputs.issue_number }}
        run: |
          set -euo pipefail
          live=$(gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid,baseRefName,headRefName)
          if [ "$(jq -r .state <<<"$live")" != "OPEN" ]; then
            echo "Promotion PR is already terminal; successful no-op."
            exit 0
          fi
          if [ "$(jq -r .isDraft <<<"$live")" != "false" ] || [ "$(jq -r .headRefOid <<<"$live")" != "$CHECKED_HEAD_SHA" ] || \
             [ "$(jq -r .baseRefName <<<"$live")" != "${{ inputs.production_branch }}" ] || \
             [ "$(jq -r .headRefName <<<"$live")" != "${{ inputs.integration_branch }}" ]; then
            echo "Promotion PR changed after evaluation; refusing stale merge." >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$CHECKED_HEAD_SHA"
          gh issue close "$RELEASE_ISSUE" --comment "Promoted via PR #$PR_NUMBER after newest exact-head checks passed."
