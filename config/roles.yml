# Authoritative current role bindings.
#
# VOC-117 (2026-08-24) makes every active role Cursor-backed. The planner uses
# Grok 4.6 with high effort; review roles use xhigh effort, with only the bounded
# reviewer retry selecting the fast tier. Live Cursor CLI model discovery
# requires the effort-qualified identifier; effort-omitted expressions fail
# closed as unavailable. Implementation and its single escalation attempt both
# use Composer 2.5 by requirement. The identical escalation binding is
# intentional and does not expand the existing retry limit.
#
# Historical provider/model transitions remain available in CHANGELOG.md and
# Git history. They are not current routing or fallback behavior. Workflows
# must fail closed when a configured binding cannot be honored; they must not
# silently select another provider, model, speed tier, or effort level.

implementer: cursor/composer-2.5
implementer_escalation: cursor/composer-2.5
planner: cursor/grok-4.6[effort=high,fast=false]
reviewer: cursor/grok-4.6[effort=xhigh,fast=false]
reviewer_fast_retry: cursor/grok-4.6[effort=xhigh,fast=true]
plan_reviewer: cursor/grok-4.6[effort=xhigh,fast=false]
