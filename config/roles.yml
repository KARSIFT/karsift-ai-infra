# Role -> current model. This is the ONLY file that names a specific AI vendor
# or model anywhere in this repo. Every workflow reads a *role* name
# ("implementer", "reviewer") and resolves it here - swap who occupies a role
# by editing this one file, not by touching workflow logic.
#
# "implementer" and "reviewer" are supposed to stay different model vendors -
# same-vendor review isn't independent review, it's self-review. Restored
# 2026-07-23: OpenAI API billing is now set up, so the implementer runs on
# openai/codex-action again (see implement.yml's header comment). At the time
# this paragraph was written the reviewer stayed on Claude Code, giving real
# cross-vendor independence - that no longer holds as of the very next
# section below (2026-07-24: reviewer also moved to OpenAI, a second,
# different same-vendor compromise). Check the block below and the actual
# `reviewer`/`implementer` values, not this paragraph, for current state.
#
# implementer is pinned to full-size Codex, not the mini tier - the mini tier
# was tried first (2026-07-24) for cost, given the OpenAI account behind
# OPENAI_API_KEY runs on a small prepaid credit balance, but was judged too
# weak for real implementation work. gpt-5.2-codex was the first full-size
# pick but broke immediately - it (and older Codex checkpoints) were
# deprecated at the API level on/around 2026-07-23, confirmed live on
# VOC-018-T02's implement run ("The model `gpt-5.2-codex` has been
# deprecated"). gpt-5.3-codex was the live replacement at that time.
#
# Moved to gpt-5.6-terra (2026-07-24) once OpenAI's GPT-5.6 family (Sol /
# Terra / Luna) rolled out into Codex: Terra is documented as "competitive
# with GPT-5.5" at a lower cost than the Sol flagship ($2.50/$15 vs $5/$30
# per 1M tokens), i.e. the cost-effective everyday-coding tier - not the
# cheapest/weakest Luna tier, which risks repeating the gpt-5.1-codex-mini
# "too weak" outcome. Reason for the move: gpt-5.3-codex's implement output
# was passing FAIL-worthy work to the (paid, slower) independent-review step
# more than desired (VOC-019-T00's first attempt), and a stronger-per-dollar
# model was judged the better lever than just re-prompting - though note
# most of that PR's FAIL findings were project-convention misses (unwired
# Tailwind utility names, nested <main>) that a lint rule would also catch;
# model quality alone won't close that gap. NOT yet exercised live - watch
# the next real implement run to confirm gpt-5.6-terra actually works with
# openai/codex-action (model string just swaps the same way gpt-5.2-codex ->
# gpt-5.3-codex did) and that model_verbosity=medium (implement.yml) is still
# the right override, not a gpt-5.2-codex-specific fix.
#
# This lineup moves fast - check OpenAI's actual deprecations page
# (developers.openai.com/api/docs/deprecations) before assuming this exact
# model string is still both current and the right cost/capability tradeoff.
#
# Leave a value empty to use that provider's own action/CLI current default
# model instead of pinning a version here.
#
# ############################################################################
# TEMPORARY SAME-VENDOR COMPROMISE (2026-07-24) - reviewer and planner moved
# from Claude Code CLI to openai/codex-action because the Anthropic Console
# organization behind ANTHROPIC_API_KEY was disabled (billing/account issue on
# the founder's side, not a karsift-ai-infra bug) and no fallback Claude
# access (subscription OAuth, Bedrock, Vertex) was available at the time.
#
# This is explicitly the same compromise documented above and in
# implement.yml's header comment as "same-vendor review isn't independent
# review, it's self-review" - reviewer and implementer are both OpenAI now,
# which weakens (does not eliminate - different checkpoints still catch
# different things) the independent-verification guarantee this pipeline is
# designed around. review.yml/plan.yml's execution steps were rewritten from
# Claude Code CLI to openai/codex-action to make this possible - reverting
# needs those files' execution steps changed back, not just this config.
#
# REVERT THIS the moment Claude access is restored (fix the Anthropic org, or
# switch to Bedrock/Vertex billing, or a subscription OAuth token) - see
# [[karsift_founder_gate_workflow]]/[[karsift_bugs_fixed]] memory for context
# if you're revisiting this later without the live conversation history.
#
# SUPERSEDED IN PART (2026-07-25): implementer, reviewer, and planner have
# all since moved again, to OpenCode (see each role's own value/comment
# below) - "reviewer and implementer are both OpenAI now" above is no longer
# true. This block is kept as history for why the OpenAI move happened at
# all; check the actual `implementer`/`reviewer`/`planner`/
# `implementer_escalation` values below for current state, not this
# paragraph. implementer_escalation is the one role still deliberately on
# OpenAI - see its own comment for why.
# ############################################################################

