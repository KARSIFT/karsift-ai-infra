implementer: claude-haiku-4-5-20251001

# implementer_escalation (2026-07-24): used ONLY on a remediate.yml retry
# (attempt 2 - implement.yml's own last attempt before it gives up and
# escalates to a human) - see implement.yml's model-resolution step for the
# exact condition. Never used on attempt 1. Opposite lever from
# reviewer_fast_retry: a retry here means the task already proved harder
# than the cheaper tier could handle, so escalate to the strongest model for
# the one remaining shot rather than retry blind with the same model - the
# alternative is a human getting paged regardless, so there's little
# downside to trying harder first. Leave empty to disable escalation
# entirely and always use `implementer`, even on retry.
#
# MOVED TO OPENCODE (2026-07-26, founder directive: "no more quota in
# codex"): was deliberately kept on openai/codex-action (gpt-5.6-sol)
# through 2026-07-25 specifically for cross-vendor independence on the
# hardest retry - not just cost, a real different-infrastructure second
# opinion. That property is gone now that OpenAI/Codex credits are
# exhausted. implement.yml's codex-action step is disabled (if: false),
# not deleted, so restoring cross-vendor escalation is a one-line revert
# if Codex quota is restored later.
#
# Briefly glm-5.2, then founder's direct follow-up (same day) moved it to
# kimi-k2.7-code - the model `implementer` itself ran on through 2026-07-25
# with a genuinely strong track record (the VOC-025-T00 reviewer evidence
# cited above is about kimi in the reviewer role specifically, but its
# implementer-quality output through VOC-025/026/027 was solid too, save
# the one VOC-025-T04 retry documented in the bugs-fixed memory). Now that
# `implementer` itself has moved to minimax-m3 for cost, using kimi here
# keeps escalation a genuinely different, previously-proven-stronger model
# rather than retrying with the same tier that already struggled.
#
# TEMPORARY QUOTA FALLBACK (2026-07-26): moved to claude-haiku-4-5-20251001
# alongside implementer/reviewer - see implementer's own note above for why
# (OpenCode Go quota exhausted, no other authenticated provider available
# today). This is the weakest version of this role's own purpose (escalation
# is supposed to be a genuinely different/stronger model than a struggling
# attempt 1) since it's now IDENTICAL to `implementer` - accepted only
# because the alternative is no escalation path at all until quota resets.
# Revert to opencode-go/kimi-k2.7-code once OpenCode Go quota is back.
implementer_escalation: claude-haiku-4-5-20251001

