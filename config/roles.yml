# Role -> current model. This is the ONLY file that names a specific AI vendor
# or model anywhere in this repo. Every workflow reads a *role* name
# ("implementer", "reviewer") and resolves it here - swap who occupies a role
# by editing this one file, not by touching workflow logic.
#
# "implementer" and "reviewer" are supposed to stay different model vendors -
# same-vendor review isn't independent review, it's self-review. Restored
# 2026-07-23: OpenAI API billing is now set up, so the implementer runs on
# openai/codex-action again (see implement.yml's header comment). At the time
# this paragraph was written the reviewer stayed on Claude Code, giving real
# cross-vendor independence - that no longer holds as of the very next
# section below (2026-07-24: reviewer also moved to OpenAI, a second,
# different same-vendor compromise). Check the block below and the actual
# `reviewer`/`implementer` values, not this paragraph, for current state.
#
# implementer is pinned to full-size Codex, not the mini tier - the mini tier
# was tried first (2026-07-24) for cost, given the OpenAI account behind
# OPENAI_API_KEY runs on a small prepaid credit balance, but was judged too
# weak for real implementation work. gpt-5.2-codex was the first full-size
# pick but broke immediately - it (and older Codex checkpoints) were
# deprecated at the API level on/around 2026-07-23, confirmed live on
# VOC-018-T02's implement run ("The model `gpt-5.2-codex` has been
# deprecated"). gpt-5.3-codex was the live replacement at that time.
#
# Moved to gpt-5.6-terra (2026-07-24) once OpenAI's GPT-5.6 family (Sol /
# Terra / Luna) rolled out into Codex: Terra is documented as "competitive
# with GPT-5.5" at a lower cost than the Sol flagship ($2.50/$15 vs $5/$30
# per 1M tokens), i.e. the cost-effective everyday-coding tier - not the
# cheapest/weakest Luna tier, which risks repeating the gpt-5.1-codex-mini
# "too weak" outcome. Reason for the move: gpt-5.3-codex's implement output
# was passing FAIL-worthy work to the (paid, slower) independent-review step
# more than desired (VOC-019-T00's first attempt), and a stronger-per-dollar
# model was judged the better lever than just re-prompting - though note
# most of that PR's FAIL findings were project-convention misses (unwired
# Tailwind utility names, nested <main>) that a lint rule would also catch;
# model quality alone won't close that gap. NOT yet exercised live - watch
# the next real implement run to confirm gpt-5.6-terra actually works with
# openai/codex-action (model string just swaps the same way gpt-5.2-codex ->
# gpt-5.3-codex did) and that model_verbosity=medium (implement.yml) is still
# the right override, not a gpt-5.2-codex-specific fix.
#
# This lineup moves fast - check OpenAI's actual deprecations page
# (developers.openai.com/api/docs/deprecations) before assuming this exact
# model string is still both current and the right cost/capability tradeoff.
#
# Leave a value empty to use that provider's own action/CLI current default
# model instead of pinning a version here.
#
# ############################################################################
# TEMPORARY SAME-VENDOR COMPROMISE (2026-07-24) - reviewer and planner moved
# from Claude Code CLI to openai/codex-action because the Anthropic Console
# organization behind ANTHROPIC_API_KEY was disabled (billing/account issue on
# the founder's side, not a karsift-ai-infra bug) and no fallback Claude
# access (subscription OAuth, Bedrock, Vertex) was available at the time.
#
# This is explicitly the same compromise documented above and in
# implement.yml's header comment as "same-vendor review isn't independent
# review, it's self-review" - reviewer and implementer are both OpenAI now,
# which weakens (does not eliminate - different checkpoints still catch
# different things) the independent-verification guarantee this pipeline is
# designed around. review.yml/plan.yml's execution steps were rewritten from
# Claude Code CLI to openai/codex-action to make this possible - reverting
# needs those files' execution steps changed back, not just this config.
#
# REVERT THIS the moment Claude access is restored (fix the Anthropic org, or
# switch to Bedrock/Vertex billing, or a subscription OAuth token) - see
# [[karsift_founder_gate_workflow]]/[[karsift_bugs_fixed]] memory for context
# if you're revisiting this later without the live conversation history.
#
# SUPERSEDED IN PART (2026-07-25): implementer, reviewer, and planner have
# all since moved again, to OpenCode (see each role's own value/comment
# below) - "reviewer and implementer are both OpenAI now" above is no longer
# true. This block is kept as history for why the OpenAI move happened at
# all; check the actual `implementer`/`reviewer`/`planner`/
# `implementer_escalation` values below for current state, not this
# paragraph. implementer_escalation is the one role still deliberately on
# OpenAI - see its own comment for why.
# ############################################################################

# MIXED-VENDOR (2026-07-25): implementer itself moved to OpenCode too, after
# opencode-go/kimi-k2.7-code demonstrated genuinely strong analytical quality
# as reviewer first (a real PR review that cross-referenced Ent schemas
# against a raw SQL migration, verified specific field/constraint invariants,
# and found one well-reasoned Low finding rather than rubber-stamping -
# VOC-025-T00, PR #72). That's evidence about review/analysis quality
# specifically, not proof of implementer-quality code writing under real
# build/test constraints - founder made the call anyway; watch early
# implement runs' CI/review pass rate to confirm this holds for writing code,
# not just judging it. implement.yml's execution step is now genuinely
# mixed-vendor: this role runs via a raw `opencode run --agent build`
# invocation, while implementer_escalation below deliberately stayed on
# openai/codex-action - see that file's header comment for why (a real
# different-vendor fallback for the hardest retry, not just cost).
implementer: opencode-go/kimi-k2.7-code

# implementer_escalation (2026-07-24): used ONLY on a remediate.yml retry
# (attempt 2 - implement.yml's own last attempt before it gives up and
# escalates to a human) - see implement.yml's model-resolution step for the
# exact condition. Never used on attempt 1. Opposite lever from
# reviewer_fast_retry: a retry here means the task already proved harder
# than the cheaper tier could handle, so escalate to the strongest model for
# the one remaining shot rather than retry blind with the same model - the
# alternative is a human getting paged regardless, so there's little
# downside to trying harder first. Leave empty to disable escalation
# entirely and always use `implementer`, even on retry.
#
# Deliberately NOT moved to OpenCode alongside `implementer` above (2026-07-25):
# this is the one remaining case where staying on a fully separate vendor
# (OpenAI/codex-action, not just a different model under the same OpenCode
# CLI) matters most - the hardest attempt, one shot left before a human gets
# paged, is exactly when a genuinely different infrastructure stack (not
# just a different checkpoint) is worth keeping.
implementer_escalation: gpt-5.6-sol

# reviewer: gpt-5.6-sol, not gpt-5.6-terra (implementer's own model) - using
# the exact same model for both would mean the reviewer never catches
# anything the implementer itself couldn't have caught, the worst-case
# version of the same-vendor compromise above.
#
# Revised 2026-07-24, same session: initially set to gpt-5.6-sol (the
# strongest OpenAI model for long-horizon reasoning/analysis per public
# benchmarks) on a quality-first basis - founder pushed back immediately on
# cost (Sol is $5/$30 per 1M, the single most expensive OpenAI tier, and
# review.yml is called on *every* implement attempt plus every retry - the
# exact call pattern that ran up the Claude bill this whole pivot was
# reacting to). Reviewer went to gpt-5.6-luna - the cheapest GPT-5.6 tier -
# as the founder's explicit choice, prioritizing cost over the marginal
# quality gap.
#
# PILOT (2026-07-25): moved again, this time off OpenAI entirely, to
# opencode-go/kimi-k2.7-code via OpenCode (opencode.ai) - a model-agnostic
# CLI client, not itself a vendor. Kimi K2.7-Code is Moonshot AI's
# coding-tuned checkpoint. Founder has an OpenCode Go subscription
# ($10/month, opencode.ai/go) - Go-tier models use the `opencode-go/` model
# prefix and are billed against the Go plan, NOT the `opencode/` prefix
# (OpenCode Zen's separate pay-as-you-go billing/balance - confirmed live:
# `opencode/kimi-k2.7-code` returned "Insufficient balance" against an
# unfunded Zen balance, while the identical call against
# `opencode-go/kimi-k2.7-code` succeeded immediately with the same
# credential). Auth is OPENCODE_API_KEY (not OPENCODE_ZEN_API_KEY, which an
# earlier version of this same pilot incorrectly required - see git history
# if resurrecting that). CORRECTION: an earlier version of this comment
# cited a detailed per-model Zen pricing table (specific $/1M figures for
# dozens of models across many vendors) sourced from a web fetch that turned
# out to be fabricated - it even inexplicably listed our own private
# gpt-5.6-sol/terra/luna model names as if they were generic Zen catalog
# entries, which was the tell. Don't trust a fetched pricing/model-catalog
# page for this vendor without cross-checking `opencode models` live
# against a real authenticated session - the CLI's own output is the only
# verified-accurate source found this session. review.yml's execution step
# was rewritten from openai/codex-action to a raw `opencode run
# --format json` CLI invocation with a read-only `reviewer` agent defined in
# a generated opencode.jsonc - see that file's own header comment for why
# (the CLI has no `--permissions`/`--quiet` flags on `run`, contrary to an
# earlier, also-wrong assumption in this same pilot).
#
# MOVED AGAIN (2026-07-25, same day): after kimi-k2.7-code's strong first
# review (see implementer's own note above - that result is WHY implementer
# moved to Kimi), founder asked for a different, well-reputed model for
# reviewer specifically, so it isn't just re-checking implementer's own
# model under another name. DeepSeek has the strongest public reasoning/
# coding-benchmark reputation of the models available on this OpenCode Go
# plan (see `opencode models` for the real live catalog - don't trust a
# fetched pricing page, see the correction note above). Note this is
# cross-MODEL independence (different lab: DeepSeek vs Moonshot AI), not
# cross-VENDOR the way OpenCode-vs-OpenAI was - both implementer and
# reviewer now run through the same `opencode` CLI/OpenCode Go plan, just
# different underlying checkpoints. Whether that's still enough independence
# to catch what a same-vendor compromise would miss is exactly what watching
# real verdicts here is meant to establish - don't assume it's equivalent to
# the OpenAI-vs-OpenCode split without evidence.
reviewer: opencode-go/deepseek-v4-pro

# reviewer_fast_retry: same value as reviewer - see reviewer's own note for
# why a separate "even cheaper for retries" tier isn't being pulled here.
reviewer_fast_retry: opencode-go/deepseek-v4-pro

# planner has no cross-vendor independence requirement the way implementer/reviewer
# do - its output is a DRAFT change package a human reviews and adopts (or doesn't),
# never something an independent AI verifier checks the way review.yml checks
# implementer output. Founder's explicit choice (2026-07-24): gpt-5.6-terra, the
# same cost-effective tier as implementer - not gpt-5.6-sol (tried first, reverted
# on cost grounds, see reviewer's note above for the same reasoning applied here).
#
# MOVED (2026-07-25): planner too moved to OpenCode, founder's explicit
# choice of "a different, slightly stronger model" than implementer's
# kimi-k2.7-code - initially opencode-go/qwen3.7-max, then switched same day
# to opencode-go/glm-5.2 (founder's direct follow-up choice). Different lab
# again either way (Zhipu/GLM vs Moonshot/Kimi vs DeepSeek/reviewer). Still
# no independence requirement to satisfy here (see paragraph above) - this
# is purely a quality/cost choice, not a cross-checking one. plan.yml's
# execution step was rewritten from openai/codex-action to `opencode run
# --agent build` the same way implement.yml's was.
planner: opencode-go/glm-5.2
