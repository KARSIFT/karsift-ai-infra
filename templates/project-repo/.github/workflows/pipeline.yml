name: pipeline

# Thin file. All real logic lives in KARSIFT/karsift-ai-infra's reusable
# workflows - this just wires triggers to them. Runs alongside (not instead
# of) this repo's own governance/risk-classification workflows, if any.
#
# `plan` turns a request (free text, an existing document, or a GitHub issue's
# whole thread) into a DRAFT change package (planner role, see plan.yml).
# Independent plan review and merge policy decide whether the exact draft may
# merge; `adopt` then records authority and opens the real per-task tracking
# issues. A reconcile dispatch repairs a missed handoff idempotently.
# `plan-from-issue` is what makes "anyone (a human, or another
# agent - e.g. one that reads application logs and notices a bug) just opens
# an issue" a valid way in: it auto-drafts a package from that issue, asking a
# clarifying question back on the issue itself if there isn't enough to go on
# yet. A bare issue never becomes implementation authority on its own. Once a
# package is adopted, `adopt.yml` starts the root task automatically and `auto-advance.yml`
# releases each later task only after its predecessor merges.
#
# Copy this file into a project repo and fill in:
#   - auto_merge_enabled, only once you have real evidence for this project's loop
#   - integration_branch below - "develop" if this project splits develop/main,
#     "main" if it's GitHub-flow-only (a single long-lived branch). Get this
#     wrong and the very first checkout step fails outright.
#   - id_prefix - appears TWICE (the workflow_dispatch default, and
#     plan-from-issue's hardcoded value) - keep both in sync, e.g. "VOC"
#   - your project's own PR-body convention for "Risk classification: R#" and
#     "Package path: `...`" if it differs from the defaults this template assumes
#
# PRIVATE REPO + GitHub Free org plan: org-level secrets (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, etc.) silently do NOT reach private repos on a Free org plan,
# even when the secret's visibility is set to "All repositories" and the GitHub
# API reports it as configured for this repo - jobs just see an empty value
# with no error at workflow-definition time, only a runtime "Secret X is
# required, but not provided" failure. Confirmed on vocanova-platform-sandbox's
# first real run. If this repo is private and org secrets aren't reaching it,
# set the same secret again at the repo level (`gh secret set ANTHROPIC_API_KEY
# --repo OWNER/REPO`, likewise for OPENAI_API_KEY) rather than assuming the
# org-level one will work. Public repos and Team/Enterprise-plan orgs are
# unaffected.

on:
  pull_request:
    # ready_for_review is required for draft-aware merge gating: completing
    # evidence can leave the exact reviewed SHA unchanged, so GitHub's draft
    # transition must give the gate a fresh event on that same SHA.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # Polling avoids a workflow_run-on-pipeline recursion loop and can discover
  # any workflow identity declared by a contract without a static name list.
  schedule:
    - cron: "17 * * * *"
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed]
  # Cheap release re-evaluation only. CI/review jobs remain guarded to PR
  # events and are not rerun merely because an external gate completed.
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "Which reusable workflow to run"
        required: true
        type: choice
        options: [implement, plan, reconcile, reconcile-release, reconcile-live-evidence, verify-auto-advance-live-evidence, verify-ready-for-review-reuse]
        default: implement
      change_id:
        description: 'implement only: adopted package to implement from, e.g. "VOC-007"'
        required: false
        type: string
      package_path:
        description: 'implement only: path to the package directory, e.g. "specs/changes/VOC-007-some-slug"'
        required: false
        type: string
      task_id:
        description: "implement only: task ID from the package's task list"
        required: false
        type: string
      issue_number:
        description: "implement only: GitHub issue carrying implementation authority"
        required: false
        type: string
      attempt:
        description: "implement only: 1 or 2"
        required: false
        type: string
        default: "1"
      request:
        description: "plan only: free-text description of the change package to draft"
        required: false
        type: string
      source_document_path:
        description: "plan only: path to an existing document in the repo to draft from, instead of/alongside request"
        required: false
        type: string
      id_prefix:
        description: 'plan only: package ID prefix, e.g. "VOC"'
        required: false
        type: string
        default: "VOC"
      plan_pr_number:
        description: "reconcile only: merged plan PR whose adoption/roster handoff must be repaired"
        required: false
        type: string
      release_issue_number:
        description: "reconcile-release only: release audit issue whose promotion must be retried"
        required: false
        type: string
      live_evidence_pr_number:
        description: "reconcile-live-evidence only: optional target PR; required for declared dispatch"
        required: false
        type: string
      live_evidence_run_id:
        description: "reconcile-live-evidence only: optional Actions run id to observe immediately"
        required: false
        type: string
      live_evidence_dispatch:
        description: "reconcile-live-evidence only: dispatch exactly the target PR contract"
        required: false
        type: boolean
        default: false
      verify_source_run_id:
        description: "verify-auto-advance-live-evidence only: predecessor close pipeline run id"
        required: false
        type: string
      verify_waiting_pr_number:
        description: "verify-auto-advance-live-evidence only: draft evidence-carrier PR number"
        required: false
        type: string
      verify_change_id:
        description: "verify-auto-advance-live-evidence only: adopted package change id"
        required: false
        type: string
      verify_task_id:
        description: "verify-auto-advance-live-evidence only: operator-owned task id"
        required: false
        type: string
      verify_package_path:
        description: "verify-auto-advance-live-evidence only: canonical package directory path"
        required: false
        type: string
      verify_ready_run_id:
        description: "verify-ready-for-review-reuse only: ready_for_review pipeline run id"
        required: false
        type: string
      verify_prior_run_id:
        description: "verify-ready-for-review-reuse only: prior successful pipeline run id"
        required: false
        type: string
      verify_reuse_source_pr_number:
        description: "verify-ready-for-review-reuse only: source transition pull request number"
        required: false
        type: string
      verify_reuse_source_head_sha:
        description: "verify-ready-for-review-reuse only: exact source reviewed head SHA"
        required: false
        type: string
      verify_reuse_source_base_sha:
        description: "verify-ready-for-review-reuse only: exact source reviewed base SHA"
        required: false
        type: string
      verify_reuse_proof_head_sha:
        description: "verify-ready-for-review-reuse only: exact evidence-carrier head SHA"
        required: false
        type: string

# A synchronize event supersedes every older pipeline for the same PR. This
# prevents duplicate reviewer/model runs and stale remediation/merge decisions,
# while issue and manual-dispatch runs retain unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'implement'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/implement.yml@main
    with:
      change_id: ${{ inputs.change_id }}
      package_path: ${{ inputs.package_path }}
      task_id: ${{ inputs.task_id }}
      issue_number: ${{ inputs.issue_number }}
      attempt: ${{ inputs.attempt }}
      integration_branch: "develop"   # "main" for a GitHub-flow-only project
    secrets: inherit

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan.yml@main
    with:
      request: ${{ inputs.request }}
      source_document_path: ${{ inputs.source_document_path }}
      id_prefix: ${{ inputs.id_prefix }}
      integration_branch: "develop"   # match the value used for implement, above
    secrets: inherit

  # Lets ANYONE (or any other agent, authenticated however it authenticates)
  # kick off planning just by opening an issue - no manual workflow_dispatch
  # needed. Gated on the issue carrying NO karsift:* label at open time,
  # since this system's own issue-creation (adopt.yml's task issues,
  # release.yml's release-approval issues) always labels what it opens - see
  # those files' own comments. An unlabeled issue is, by construction,
  # something this system didn't create itself.
  #
  # Also fires on a later comment, but only if the issue is currently labeled
  # `karsift:needs-info` (the planner asked a clarifying question and is
  # waiting - see plan.yml) AND the comment isn't from a bot account, so the
  # planner's own posted question doesn't re-trigger itself in a loop. This
  # is deliberately NOT restricted to human commenters specifically - a
  # human replying and another agent (e.g. one that read a log and is
  # supplying the detail the planner asked for) replying both work exactly
  # the same way, through the same issue thread.
  plan-from-issue:
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened' && toJSON(github.event.issue.labels) == '[]') ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'karsift:needs-info') && github.event.comment.user.type != 'Bot')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan.yml@main
    with:
      source_issue_number: ${{ github.event.issue.number }}
      id_prefix: "VOC"   # match the value used for the workflow_dispatch plan job, above
      integration_branch: "develop"   # match the value used for implement, above
    secrets: inherit

  # The other half of plan.yml's split: opens the ordered per-task tracking
  # issues and immediately starts only the root task once a "plan/"-branch PR
  # merges. Later tasks are started by auto-advance after their predecessor
  # merges. See adopt.yml for the dependency and direct-dispatch guards.
  adopt:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'plan/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile' && inputs.plan_pr_number != '')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/adopt.yml@main
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_pr_number || github.event.pull_request.number }}
    secrets: inherit

  ready-for-review-reuse:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/ready-for-review-reuse.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
      event_action: ${{ github.event.action }}
      current_run_id: ${{ github.run_id }}

  ci:
    needs: [ready-for-review-reuse]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/ci.yml@main
    with:
      # GitHub rulesets evaluate the newest required `ci / ci` context. Keep
      # that context successful on the optimized path without rerunning the
      # application checks; merge-gate still revalidates the prior run.
      reuse_evidence: ${{ needs.ready-for-review-reuse.outputs.outcome == 'reuse-evidence' }}

  plan-review:
    needs: [ready-for-review-reuse, ci]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'plan/') &&
      needs.ci.result == 'success' &&
      needs.ready-for-review-reuse.outputs.outcome != 'reuse-evidence'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan-review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  # Planning PRs (head branch prefixed "plan/" by plan.yml) create a package
  # rather than implementing one, so they never carry the "Package path:"
  # line this job requires - the startsWith guard below skips this (and
  # review/remediate, which depend on it) for those PRs instead of failing a
  # check that would otherwise block the plan-review merge path. merge-gate.yml
  # itself parses the plan package risk declaration and fails closed when it
  # cannot determine a risk class.
  extract-package-path:
    needs: [ready-for-review-reuse]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'agent/') &&
      needs.ready-for-review-reuse.outputs.outcome != 'reuse-evidence'
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.extract.outputs.package_path }}
    steps:
      # PR_BODY goes through env:, never ${{ }}-interpolated directly into
      # the script - a PR body is text anyone who can open a PR controls,
      # and splicing it raw into a bash source before bash parses it is a
      # script-injection vector (a body containing a backtick is enough).
      - name: Parse package path from PR body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          path=$(echo "$PR_BODY" | grep -oP '(?<=Package path: `)[^`]+')
          if [ -z "$path" ]; then
            echo "No 'Package path: \`...\`' line found in the PR body - review cannot run without it." >&2
            exit 1
          fi
          echo "package_path=$path" >> "$GITHUB_OUTPUT"

  review:
    needs: [ready-for-review-reuse, ci, extract-package-path]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'agent/') &&
      needs.ci.result == 'success' &&
      needs.extract-package-path.result == 'success' &&
      needs.ready-for-review-reuse.outputs.outcome != 'reuse-evidence'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      package_path: ${{ needs.extract-package-path.outputs.package_path }}
      integration_branch: "develop"   # match the value used for implement, above
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  # Runs after ci and every review. A no-op unless ci failed outright or the
  # review verdict is FAIL - then it either re-dispatches the implementer
  # once (with the failure details attached) or, if that retry already
  # happened, escalates to the authority issue instead of trying a third
  # time. See remediate.yml for the exact rule.
  #
  # `needs: [ci, review, ...]` + `always()` is required because review.yml
  # never runs at all when ci fails (review's own `needs: [ci, ...]` has no
  # always() guard, so it's skipped by default) - without depending on ci
  # directly and forcing this job to run regardless, a plain CI failure
  # (no reviewer verdict ever produced) left a PR permanently stuck with no
  # automatic retry. Found live: gpt-5.3-codex's first two implement
  # attempts on vocanova-platform-sandbox's VOC-018-T02 both failed CI
  # outright and needed a human to notice and push a fix by hand.
  remediate:
    needs: [ci, review, extract-package-path]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.head_ref, 'agent/') &&
      needs.extract-package-path.result == 'success' &&
      needs.ci.result != 'skipped' && needs.ci.result != 'cancelled'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/remediate.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      package_path: ${{ needs.extract-package-path.outputs.package_path }}
      integration_branch: "develop"   # match the value used for implement, above
      ci_failed: ${{ needs.ci.result == 'failure' }}
      review_job_failed: ${{ needs.review.result == 'failure' }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  # `needs: review` + the `always()` guard below fixes a real race: on a
  # plain `pull_request` event this job used to run with no dependency on
  # `review` at all, so it evaluated in parallel with (not after) review -
  # and since `ci` finishes faster than a full independent-review pass,
  # merge-gate's report-status routinely captured verdict=PENDING before
  # review had posted anything, then never got another chance to look
  # again (no further `pull_request` event fires unless something pushes a
  # new commit). Auto-merge was structurally unable to fire on a normal
  # single-commit PR - discovered on vocanova-platform-sandbox's first real
  # attempt to exercise `auto_merge_enabled`. `always()` is required
  # because a job depending on a *skipped* job is by default also skipped -
  # and `review` is deliberately skipped on planning PRs (`plan/`-prefixed head
  # branch, no implementation package for the task reviewer to check yet) - that case must
  # still reach merge-gate so its status comment actually posts, rather than
  # requiring review's specific 'success' result which a planning PR's
  # deliberately-skipped review can never produce.
  merge-gate:
    needs: [ready-for-review-reuse, ci, review, plan-review]
    if: |
      always() &&
      (
        github.event_name == 'pull_request' && github.event.action != 'closed' &&
        (needs.review.result == 'success' || needs.review.result == 'skipped') &&
        (needs.plan-review.result == 'success' || needs.plan-review.result == 'skipped')
      )
    uses: KARSIFT/karsift-ai-infra/.github/workflows/merge-gate.yml@main
    with:
      auto_merge_enabled: "false"     # flip only after real evidence for this project's loop
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
      reuse_outcome: ${{ needs.ready-for-review-reuse.outputs.outcome }}
      reuse_prior_run_id: ${{ needs.ready-for-review-reuse.outputs.prior_run_id }}
      current_ci_result: ${{ needs.ci.result }}
    secrets: inherit

  # Promotes a completed package after its roster closes. reconcile-release
  # retries an interrupted promotion without creating an approval path.
  release:
    if: |
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile-release' && inputs.release_issue_number != '') ||
      (github.event_name == 'check_run' && github.event.action == 'completed')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/release.yml@main
    with:
      release_issue_number: ${{ inputs.release_issue_number }}
      integration_branch: "develop"   # match the value used elsewhere in this file
      production_branch: "main"
    secrets: inherit

  # Fills the gap between adoption (one human decision, the whole roster at
  # once) and release (one human decision, the whole completed package at
  # once): dispatches the NEXT task in an adopted package's roster
  # automatically once the current task's tracking issue closes, so routine
  # task-to-task progression needs no further per-task human trigger. A
  # no-op on the package's last task (release's own check-completion above
  # handles that transition instead) or if the next task is already
  # dispatched/done. Runs on the same `issues: closed` event as `release`
  # above - both are safe to fire together, since each package/task can
  # only ever be in the "next task exists" or "roster complete" state, never
  # both, so exactly one of the two actually does something per event.
  auto-advance:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/auto-advance.yml@main
    with:
      integration_branch: "develop"   # match the value used elsewhere in this file
    # Narrow contract: ordinary tasks need the active implementer provider;
    # operator-owned carrier publication uses only the GitHub App identity.
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
      KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}

  # Read-only proof that an issues:closed source run took the operator-owned
  # branch and created exactly one trusted draft evidence carrier.
  verify-auto-advance-live-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify-auto-advance-live-evidence'
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: KARSIFT/karsift-ai-infra/.github/workflows/verify-auto-advance-live-evidence.yml@main
    with:
      source_run_id: ${{ inputs.verify_source_run_id }}
      waiting_pr_number: ${{ inputs.verify_waiting_pr_number }}
      change_id: ${{ inputs.verify_change_id }}
      task_id: ${{ inputs.verify_task_id }}
      package_path: ${{ inputs.verify_package_path }}
      integration_branch: "develop"

  verify-ready-for-review-reuse:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify-ready-for-review-reuse'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: KARSIFT/karsift-ai-infra/.github/workflows/verify-ready-for-review-reuse.yml@main
    with:
      ready_run_id: ${{ inputs.verify_ready_run_id }}
      prior_run_id: ${{ inputs.verify_prior_run_id }}
      source_pr_number: ${{ inputs.verify_reuse_source_pr_number }}
      expected_source_head_sha: ${{ inputs.verify_reuse_source_head_sha }}
      expected_source_base_sha: ${{ inputs.verify_reuse_source_base_sha }}
      expected_proof_head_sha: ${{ inputs.verify_reuse_proof_head_sha }}

  # Separate operator path: hourly polling reads Actions metadata for waiting
  # contracts. Manual mode can validate one run immediately or dispatch only a
  # workflow/inputs declared by one target contract. A qualification writes a
  # sanitized result commit, which naturally starts fresh exact-SHA PR review.
  live-evidence-reconcile:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile-live-evidence')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/live-evidence-reconcile.yml@main
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    with:
      mode: ${{ github.event_name == 'schedule' && 'reconcile' || (inputs.live_evidence_dispatch && 'dispatch' || (inputs.live_evidence_run_id != '' && 'observe' || 'reconcile')) }}
      workflow_run_id: ${{ inputs.live_evidence_run_id || '' }}
      pr_number: ${{ inputs.live_evidence_pr_number || '' }}
    secrets:
      KARSIFT_BOT_APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
      KARSIFT_BOT_PRIVATE_KEY: ${{ secrets.KARSIFT_BOT_PRIVATE_KEY }}
